<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>询价业务主流程（当前评审版）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #f8f9fa; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .container { max-width: 1900px; margin: auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .diagram { width: 100%; display: block; }
    .download-btn { display: block; margin: 22px auto 0; padding: 11px 24px; border: 0; border-radius: 4px; background: #1565c0; color: #fff; font-size: 15px; cursor: pointer; }
    .download-btn:hover { background: #0d47a1; }
  </style>
</head>
<body>
  <main class="container" id="capture-container">
    <img class="diagram" id="quotation-flow" src="询价业务主流程-评审版.svg" alt="询价业务主流程图" />
    <button class="download-btn" type="button" onclick="downloadImage()">下载 PNG 图片</button>
  </main>
  <script>
    function downloadImage() {
      const image = document.getElementById('quotation-flow');
      const button = document.querySelector('.download-btn');
      const canvas = document.createElement('canvas');
      const scale = 2;
      canvas.width = image.naturalWidth * scale;
      canvas.height = image.naturalHeight * scale;
      const context = canvas.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      button.disabled = true;
      button.textContent = '正在生成…';
      canvas.toBlob(function (blob) {
        const link = document.createElement('a');
        link.download = '询价业务主流程-评审版.png';
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
        button.disabled = false;
        button.textContent = '下载 PNG 图片';
      }, 'image/png');
    }
  </script>
</body>
</html>
