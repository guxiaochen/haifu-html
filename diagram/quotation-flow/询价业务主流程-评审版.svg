<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1300" role="img" aria-labelledby="title desc">
<title id="title">询价业务主流程（当前评审版）</title><desc id="desc">客户、平台、供应商三端询价、报价、确认与采购订单衔接流程。</desc>
<defs><style><![CDATA[
 text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#333}.t{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#888}.h{font-size:20px;font-weight:700}.lane{font-size:17px;font-weight:700}.n{font-size:15px;font-weight:600}.s{font-size:12px;fill:#666}.x{font-size:13px;fill:#555}.tiny{font-size:11px;fill:#666}.box{fill:#fff;stroke-width:1.5}.client{stroke:#c62828;fill:#fce4ec}.platform{stroke:#1565c0;fill:#e3f2fd}.supplier{stroke:#2e7d32;fill:#e8f5e9}.external{stroke:#ef6c00;fill:#fff3e0}.note{fill:#f0faf5;stroke:#2ba471;stroke-width:1}.line{fill:none;stroke:#777;stroke-width:1.8;marker-end:url(#arrow)}.dash{fill:none;stroke:#ef6c00;stroke-width:1.6;stroke-dasharray:6 4;marker-end:url(#arrowOrange)}.back{fill:none;stroke:#c62828;stroke-width:1.6;stroke-dasharray:6 4;marker-end:url(#arrowRed)}.phase{font-size:14px;font-weight:700}.card{fill:#fff;stroke:#ff9800;stroke-width:2}.th{fill:#fff3e0}.grid{stroke:#eee;stroke-width:1}.tag{font-size:11px;font-weight:700}.yes{fill:#2e7d32;font-size:12px;font-weight:700}.no{fill:#c62828;font-size:12px;font-weight:700}
 ]]></style><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#777"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#ef6c00"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#c62828"/></marker></defs>
<rect width="1900" height="1300" fill="#f8f9fa"/><rect x="25" y="20" width="1850" height="1250" rx="8" fill="#fff" stroke="#e8e8e8"/>
<text x="950" y="67" text-anchor="middle" class="t">询价业务与采购订单衔接流程</text><text x="950" y="93" text-anchor="middle" class="sub">当前评审版 · 三端主流程 / 报价版本规则 / 部分接受采购衔接</text>
<g transform="translate(630 120)"><rect width="14" height="14" rx="3" class="client"/><text x="22" y="12" class="x">客户端</text><rect x="120" width="14" height="14" rx="3" class="platform"/><text x="142" y="12" class="x">平台端</text><rect x="240" width="14" height="14" rx="3" class="supplier"/><text x="262" y="12" class="x">供应商端</text><rect x="370" width="14" height="14" rx="3" class="external"/><text x="392" y="12" class="x">外部供应商</text></g>
<text x="60" y="175" class="h">一、三端询报价主流程</text><rect x="60" y="192" width="1320" height="42" rx="5" fill="#f0faf5"/><text x="78" y="218" class="x"><tspan font-weight="700">阅读口径：</tspan>平台负责组织与综合比价；客户对平台报价拥有最终选择权；客户部分接受时，仅已接受明细进入采购订单。</text>
<!-- lanes --> <rect x="60" y="252" width="390" height="735" fill="#fffafa" stroke="#f3d4d8"/><rect x="450" y="252" width="465" height="735" fill="#f9fcff" stroke="#d3e5f8"/><rect x="915" y="252" width="465" height="735" fill="#fbfffb" stroke="#d8eed9"/>
<rect x="60" y="252" width="390" height="36" class="client"/><rect x="450" y="252" width="465" height="36" class="platform"/><rect x="915" y="252" width="465" height="36" class="supplier"/><text x="255" y="276" text-anchor="middle" class="lane">客户端</text><text x="682" y="276" text-anchor="middle" class="lane">平台端</text><text x="1147" y="276" text-anchor="middle" class="lane">供应商端（含外部供应商）</text>
<rect x="82" y="310" width="346" height="28" rx="4" fill="#fce4ec"/><text x="255" y="330" text-anchor="middle" class="phase">阶段一 · 客户发起询价</text><rect x="472" y="425" width="421" height="28" rx="4" fill="#e3f2fd"/><text x="682" y="445" text-anchor="middle" class="phase">阶段二 · 平台组织与采用报价</text><rect x="937" y="487" width="421" height="28" rx="4" fill="#e8f5e9"/><text x="1147" y="507" text-anchor="middle" class="phase">阶段三 · 供应商报价</text><rect x="82" y="655" width="811" height="28" rx="4" fill="#fff3e0"/><text x="487" y="675" text-anchor="middle" class="phase">阶段四 · 对客报价与客户最终选择</text>
<!-- boxes -->
<rect x="125" y="360" width="260" height="60" rx="7" class="box client"/><text x="255" y="386" text-anchor="middle" class="n">01 创建询价单</text><text x="255" y="406" text-anchor="middle" class="s">手工录入或模板导入产品明细</text>
<rect x="125" y="465" width="260" height="54" rx="7" class="box client"/><text x="255" y="488" text-anchor="middle" class="n">02 提交询价单</text><text x="255" y="506" text-anchor="middle" class="s">推送平台询价员</text>
<rect x="530" y="360" width="305" height="60" rx="7" class="box platform"/><text x="682" y="386" text-anchor="middle" class="n">03 接收平台询价单</text><text x="682" y="406" text-anchor="middle" class="s">查看客户需求明细与询价条件</text>
<rect x="530" y="472" width="305" height="64" rx="7" class="box platform"/><text x="682" y="497" text-anchor="middle" class="n">04 邀请/填写供应商询价</text><text x="682" y="518" text-anchor="middle" class="s">可选多个供应商及对应产品</text>
<rect x="980" y="545" width="335" height="66" rx="7" class="box supplier"/><text x="1147" y="572" text-anchor="middle" class="n">05 已注册供应商提交报价</text><text x="1147" y="594" text-anchor="middle" class="s">填写价格及报价条件</text>
<rect x="980" y="640" width="335" height="66" rx="7" class="box external"/><text x="1147" y="667" text-anchor="middle" class="n">05A 外部供应商免登录报价</text><text x="1147" y="689" text-anchor="middle" class="s">小程序分享链接填写报价</text>
<rect x="530" y="555" width="305" height="64" rx="7" class="box platform"/><text x="682" y="580" text-anchor="middle" class="n">06 汇总、比价并采用报价</text><text x="682" y="601" text-anchor="middle" class="s">价格、交期、税运、起订量等</text>
<rect x="530" y="715" width="305" height="64" rx="7" class="box platform"/><text x="682" y="740" text-anchor="middle" class="n">07 生成并审核平台报价单</text><text x="682" y="761" text-anchor="middle" class="s">形成对客报价版本并推送客户</text>
<rect x="125" y="805" width="260" height="64" rx="7" class="box client"/><text x="255" y="830" text-anchor="middle" class="n">08 客户整单/逐明细确认</text><text x="255" y="851" text-anchor="middle" class="s">全部接受、全部拒绝或部分接受</text>
<!-- decision --> <polygon points="682,820 745,865 682,910 619,865" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/><text x="682" y="861" text-anchor="middle" class="n">是否存在</text><text x="682" y="880" text-anchor="middle" class="n">已接受明细？</text>
<rect x="530" y="930" width="305" height="57" rx="7" class="box platform"/><text x="682" y="954" text-anchor="middle" class="n">09 创建采购订单</text><text x="682" y="975" text-anchor="middle" class="s">仅承接客户已接受明细</text>
<!-- connections -->
<path d="M255 420V465" class="line"/><path d="M385 492H530V390" class="line"/><path d="M682 420V472" class="line"/><path d="M835 504H980V578" class="line"/><path d="M835 504H930V673H980" class="dash"/><path d="M1147 545V536H835" class="line"/><path d="M1147 640V625H835" class="dash"/><path d="M682 619V715" class="line"/><path d="M530 747H450V837H385" class="line"/><path d="M385 837H619" class="line"/><path d="M682 910V930" class="line"/><text x="695" y="924" class="yes">是</text>
<path d="M745 865H875V1030H255V869" class="back"/><text x="842" y="858" class="no">否／拒绝明细</text><text x="493" y="1022" class="tiny">保留原报价历史版本 → 重新询价/生成新报价版本</text>
<!-- side card -->
<rect x="1410" y="192" width="420" height="795" rx="8" class="card"/><rect x="1410" y="192" width="420" height="46" rx="8" class="th"/><text x="1620" y="221" text-anchor="middle" class="h" fill="#e65100">报价确认与版本规则</text>
<line x1="1410" y1="305" x2="1830" y2="305" class="grid"/><line x1="1410" y1="382" x2="1830" y2="382" class="grid"/><line x1="1410" y1="459" x2="1830" y2="459" class="grid"/><line x1="1410" y1="536" x2="1830" y2="536" class="grid"/>
<text x="1434" y="270" class="n">客户选择权</text><text x="1434" y="291" class="s">平台综合比价，客户是最终接受/拒绝方。</text>
<text x="1434" y="335" class="n">部分接受</text><text x="1434" y="356" class="s">只将已接受明细创建采购订单；拒绝明细</text><text x="1434" y="373" class="s">不进入该订单，可按规则重新询价。</text>
<text x="1434" y="412" class="n">全部拒绝</text><text x="1434" y="433" class="s">不创建采购订单，原报价保留为历史版本。</text><text x="1434" y="450" class="s">平台基于原报价重新组织询价。</text>
<text x="1434" y="489" class="n">版本追溯</text><text x="1434" y="510" class="s">新报价版本不得覆盖历史报价、供应商报价</text><text x="1434" y="527" class="s">及客户选择记录。</text>
<text x="1434" y="576" class="n">外部供应商</text><text x="1434" y="597" class="s">可免登录报价；其报价被采用后进入正式采购</text><text x="1434" y="614" class="s">前是否必须完成供应商准入，待客户确认。</text>
<rect x="1430" y="652" width="380" height="160" rx="6" fill="#fafafa" stroke="#eee"/><text x="1450" y="680" class="n">本轮待确认（P0）</text><text x="1450" y="708" class="x">• 外部供应商的注册、认证、准入与签约时点</text><text x="1450" y="734" class="x">• 平台采用是否支持逐明细选择不同供应商</text><text x="1450" y="760" class="x">• 部分拒绝明细是否自动进入重新询价</text><text x="1450" y="786" class="x">• 报价有效期届满、撤销、重报的版本边界</text>
<!-- mapping -->
<text x="60" y="1050" class="h">二、单据映射与评审口径</text><rect x="60" y="1070" width="1770" height="78" rx="8" fill="#fafafa" stroke="#eee"/>
<g class="n"><rect x="95" y="1090" width="220" height="38" rx="6" class="client"/><text x="205" y="1115" text-anchor="middle">客户询价单</text><text x="340" y="1115">→</text><rect x="375" y="1090" width="220" height="38" rx="6" class="platform"/><text x="485" y="1115" text-anchor="middle">平台询价单</text><text x="620" y="1115">→</text><rect x="655" y="1090" width="220" height="38" rx="6" class="supplier"/><text x="765" y="1115" text-anchor="middle">供应商报价（N）</text><text x="900" y="1115">→</text><rect x="935" y="1090" width="220" height="38" rx="6" class="platform"/><text x="1045" y="1115" text-anchor="middle">平台报价单（V1…Vn）</text><text x="1180" y="1115">→</text><rect x="1215" y="1090" width="220" height="38" rx="6" class="client"/><text x="1325" y="1115" text-anchor="middle">客户确认明细</text><text x="1460" y="1115">→</text><rect x="1495" y="1090" width="270" height="38" rx="6" class="platform"/><text x="1630" y="1115" text-anchor="middle">采购订单（仅已接受明细）</text></g>
<rect x="60" y="1170" width="1770" height="70" rx="8" fill="#f0faf5"/><text x="82" y="1198" class="x" font-weight="700">评审口径：</text><text x="82" y="1222" class="x">① 同一产品可邀请多个供应商并统一比价；② 平台负责采用与审核，客户负责最终选择；③ 拒绝/重询价必须保留可追溯版本；④ 与采购订单流程衔接时，仅转换已接受明细。</text>
</svg>
