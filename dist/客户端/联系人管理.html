<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系人管理 - 元象农产品买家工作台</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f5f7fa;color:#333;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.top{height:56px;background:#2BA471;color:#fff;display:flex;align-items:center;padding:0 24px}.brand{font-size:16px;font-weight:600}.layout{display:flex;min-height:calc(100vh - 56px)}.main{flex:1;min-width:0;padding:18px}.breadcrumb{color:#999;font-size:13px;margin-bottom:14px}.breadcrumb a{color:#2BA471;cursor:pointer}.card{background:#fff;border-radius:5px;box-shadow:0 1px 2px #0000000a;margin-bottom:14px}.title-bar{padding:16px 20px;display:flex;align-items:center}.title{font-size:18px;font-weight:600}.title-actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #d9d9d9;background:#fff;color:#333;border-radius:4px;padding:7px 16px;cursor:pointer;font:inherit}.btn:hover{color:#2BA471;border-color:#2BA471}.btn-primary{background:#2BA471;color:#fff;border-color:#2BA471}.btn-primary:hover{color:#fff;background:#249360}.toolbar{padding:14px 20px;display:flex;gap:10px;align-items:center}.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d9d9d9;border-radius:4px;font:inherit;outline:none}.toolbar input{width:240px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 16px;border-bottom:1px solid #f0f0f0;text-align:left;white-space:nowrap}.table th{background:#fafafa;color:#666;font-weight:500}.table tr:hover td{background:#fafdfb}.actions button{border:0;background:none;color:#2BA471;cursor:pointer;margin-right:12px;font:inherit}.actions button.delete{color:#ff4d4f}.empty{text-align:center;color:#999;padding:45px}.modal-mask{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;z-index:10}.modal-mask.show{display:flex}.modal{width:min(680px,calc(100% - 30px));background:#fff;border-radius:8px;box-shadow:0 12px 40px #0003}.modal-head{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;font-weight:600}.close{border:0;background:none;color:#999;font-size:20px;cursor:pointer}.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}.form-item{display:flex;align-items:center;gap:10px}.form-item.full{grid-column:span 2}.form-item label{min-width:70px;text-align:right;color:#666}.form-item input,.form-item textarea{flex:1;min-width:0;padding:8px 10px;border:1px solid #d9d9d9;border-radius:4px;font:inherit}.form-item textarea{resize:vertical;min-height:70px}.modal-foot{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}@media(max-width:700px){.form{grid-template-columns:1fr}.form-item.full{grid-column:auto}.toolbar{flex-wrap:wrap}.toolbar input{width:100%}}
  </style>
</head>
<body>
  <div class="top"><div class="brand">元象农产品　买家工作台</div></div>
  <div class="layout"><div id="sidebar-container"></div><main class="main">
    <div class="breadcrumb"><a onclick="location.href='采购订单列表.html'">采购订单</a>　/　联系人管理</div>
    <div class="card title-bar"><div class="title">联系人管理</div><div class="title-actions"><button class="btn" onclick="location.href='新建采购订单.html'">返回采购订单</button><button class="btn btn-primary" onclick="openEditor()">新增联系人</button></div></div>
    <div class="card"><div class="toolbar"><select id="searchField"><option value="all">全部字段</option><option value="name">姓名</option><option value="phone">手机号</option><option value="email">电子邮箱</option><option value="city">所在城市</option><option value="address">收货地址</option></select><input id="searchInput" placeholder="搜索联系人"><button class="btn" onclick="render()">查询</button><button class="btn" onclick="resetSearch()">重置</button></div><div class="table-wrap"><table class="table"><thead><tr><th>姓名</th><th>手机号</th><th>固定电话</th><th>电子邮箱</th><th>职位</th><th>所在城市</th><th>收货地址</th><th>操作</th></tr></thead><tbody id="contactBody"></tbody></table></div></div>
  </main></div>
  <div class="modal-mask" id="editor"><div class="modal"><div class="modal-head"><span id="editorTitle">新增联系人</span><button class="close" onclick="closeEditor()">×</button></div><div class="form"><div class="form-item"><label>姓名</label><input id="f-name" placeholder="请输入姓名"></div><div class="form-item"><label>手机号</label><input id="f-phone" placeholder="请输入手机号"></div><div class="form-item"><label>固定电话</label><input id="f-tel" placeholder="请输入固定电话"></div><div class="form-item"><label>电子邮箱</label><input id="f-email" placeholder="请输入邮箱"></div><div class="form-item"><label>职位</label><input id="f-title" placeholder="请输入职位"></div><div class="form-item"><label>所在城市</label><input id="f-city" placeholder="请输入所在城市"></div><div class="form-item full"><label>收货地址</label><input id="f-address" placeholder="请输入收货地址"></div><div class="form-item full"><label>备注</label><textarea id="f-remark" placeholder="备注信息"></textarea></div></div><div class="modal-foot"><button class="btn" onclick="closeEditor()">取消</button><button class="btn btn-primary" onclick="saveContact()">保存</button></div></div></div>
  <script src="sidebar.js"></script><script>
    var KEY='clientContacts', editId='';
    var defaults=[{id:'c1',name:'侯振鲁',phone:'17505308090',tel:'',email:'mayingying45@163.com',title:'',city:'菏泽',address:'山东省菏泽市历下区元象仓库',remark:''},{id:'c2',name:'李钦彤',phone:'18480941200',tel:'',email:'',title:'',city:'菏泽',address:'山东省菏泽市牡丹区采购仓库',remark:''},{id:'c3',name:'测试01',phone:'13800000000',tel:'',email:'',title:'',city:'济南市',address:'山东省济南市历下区',remark:''},{id:'c4',name:'邱艳',phone:'18765008620',tel:'',email:'1263576996@qq.com',title:'',city:'菏泽',address:'山东省菏泽市高新区物流中心',remark:''}];
    function getContacts(){try{var data=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(data)&&data.length)return data}catch(e){}return defaults.slice()}
    function setContacts(data){localStorage.setItem(KEY,JSON.stringify(data))}
    function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function render(){var q=document.getElementById('searchInput').value.trim().toLowerCase(),field=document.getElementById('searchField').value;var list=getContacts().filter(function(c){if(!q)return true;var text=field==='all'?[c.name,c.phone,c.email,c.city,c.address].join(' '):String(c[field]||'');return text.toLowerCase().indexOf(q)>=0});var body=document.getElementById('contactBody');body.innerHTML=list.length?list.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.tel)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.title)+'</td><td>'+esc(c.city)+'</td><td>'+esc(c.address)+'</td><td class="actions"><button onclick="openEditor(\''+c.id+'\')">编辑</button><button class="delete" onclick="removeContact(\''+c.id+'\')">删除</button></td></tr>'}).join(''):'<tr><td class="empty" colspan="8">暂无联系人</td></tr>'}
    function resetSearch(){document.getElementById('searchInput').value='';document.getElementById('searchField').value='all';render()}
    function openEditor(id){editId=id||'';var c=getContacts().find(function(x){return x.id===editId})||{};document.getElementById('editorTitle').textContent=editId?'编辑联系人':'新增联系人';['name','phone','tel','email','title','city','address','remark'].forEach(function(k){document.getElementById('f-'+k).value=c[k]||''});document.getElementById('editor').classList.add('show')}
    function closeEditor(){document.getElementById('editor').classList.remove('show')}
    function saveContact(){var c={id:editId||('c'+Date.now()),name:document.getElementById('f-name').value.trim(),phone:document.getElementById('f-phone').value.trim(),tel:document.getElementById('f-tel').value.trim(),email:document.getElementById('f-email').value.trim(),title:document.getElementById('f-title').value.trim(),city:document.getElementById('f-city').value.trim(),address:document.getElementById('f-address').value.trim(),remark:document.getElementById('f-remark').value.trim()};if(!c.name){alert('请输入姓名');return}if(!c.phone){alert('请输入手机号');return}var data=getContacts(),i=data.findIndex(function(x){return x.id===c.id});if(i<0)data.push(c);else data[i]=c;setContacts(data);closeEditor();render()}
    function removeContact(id){var c=getContacts().find(function(x){return x.id===id});if(!c||!confirm('确认删除联系人“'+c.name+'”？'))return;setContacts(getContacts().filter(function(x){return x.id!==id}));render()}
    render();
  </script>
</body>
</html>
