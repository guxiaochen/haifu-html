<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑产品 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh;
        }

        /* ===== 顶部导航 ===== */
        .top-nav {
            height: 56px; background: #fff; color: #333;
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .top-nav-icon { cursor: pointer; color: #666; position: relative; font-size: 18px; padding: 6px; border-radius: 4px; }
        .top-nav-icon:hover { background: #f5f5f5; color: #2BA471; }
        .top-nav-icon .badge {
            position: absolute; top: 2px; right: 2px;
            background: #ff4d4f; color: #fff; font-size: 11px;
            min-width: 16px; height: 16px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
        }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; color: #333; }
        .account:hover { background: #f5f5f5; }
        .account-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #2BA471, #5BC09F);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
        }

        /* ===== 左右分栏 ===== */
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #f0f0f0; flex-shrink: 0; padding: 12px 0; }
        .menu-item { padding: 10px 24px 10px 48px; color: #666; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
        .menu-item:hover { background: #f5f5f5; color: #2BA471; }
        .menu-item.active { color: #2BA471; border-left-color: #2BA471; background: #f0faf5; font-weight: 500; }
        .menu-group-title { padding: 10px 20px; color: #333; font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .menu-group-title:first-of-type { margin-top: 4px; }
        .menu-group-icon { font-size: 16px; width: 20px; text-align: center; }

        /* 右侧主内容 */
        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }

        /* 面包屑 */
        .breadcrumb-bar {
            background: #fff; padding: 12px 20px;
            border-radius: 4px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar a:hover { color: #2BA471; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        /* 页面标题卡片 */
        .title-card {
            background: #fff; padding: 14px 20px;
            border-radius: 4px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 12px;
        }
        .title-card .page-title { font-size: 18px; font-weight: 600; color: #333; }
        .title-card .title-actions { margin-left: auto; display: flex; gap: 8px; }

        /* 按钮 */
        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: all .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }

        /* 内容卡片 */
        .content-card {
            background: #fff; padding: 24px;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            margin-bottom: 12px;
        }
        .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }

        /* 表单 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 80px;
        }
        .form-item { display: flex; align-items: center; gap: 16px; }
        .form-item.full { grid-column: span 2; }
        .form-label {
            min-width: 90px; color: #666; font-size: 13px;
            text-align: right; flex-shrink: 0;
        }
        .form-label .required { color: #ff4d4f; margin-right: 2px; }
        .form-input, .form-select, .form-textarea {
            flex: 1; padding: 6px 10px; border: 1px solid #d9d9d9;
            border-radius: 2px; font-size: 13px; outline: none;
            transition: border-color .2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #2BA471; }
        .form-textarea { min-height: 80px; resize: vertical; font-family: inherit; }
        .stock-period { display: flex; align-items: center; gap: 8px; flex: 1; }
        .stock-period .form-select { flex: 0 0 120px; }
        .stock-period .stock-days-input { flex: 1; min-width: 80px; }
        .product-image-upload { display: flex; align-items: center; gap: 12px; flex: 1; }
        .product-image-preview { width: 56px; height: 56px; display: inline-flex; align-items: center; justify-content: center; background: #f5f7fa; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 24px; overflow: hidden; }
        .product-image-preview img { width: 100%; height: 100%; object-fit: cover; }
        .radio-group { display: flex; gap: 16px; }
        .radio-item { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; }
        .radio-item input { cursor: pointer; }

        /* 提示横幅 */
        .alert {
            display: none; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 4px;
            font-size: 13px; margin-bottom: 12px;
        }
        .alert.show { display: flex; }
        .alert-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .link { color: #2BA471; cursor: pointer; text-decoration: none; }
        .link:hover { text-decoration: underline; }
        .supplier-card { margin-top: 12px; }
        .supplier-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .supplier-toolbar .card-title { margin: 0; padding: 0; border: 0; }
        .supplier-toolbar .btn { margin-left: auto; }
        .supplier-table-wrap { width: 100%; overflow: hidden; }
        .supplier-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        .supplier-table th { background: #fafafa; color: #666; font-weight: 500; white-space: normal; word-break: break-all; }
        .supplier-table th, .supplier-table td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; text-align: left; word-break: break-all; overflow-wrap: anywhere; }
        .supplier-table input, .supplier-table select { width: 100%; min-width: 0; max-width: 100%; padding: 6px 5px; border: 1px solid #d9d9d9; border-radius: 2px; font: inherit; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">

        <div class="top-nav-icon" title="消息">🔔<span class="badge">13</span></div>
        <div class="account">
            <div class="account-avatar">A</div>
            <div>Administrator</div>
        </div>
    </div>
</div>

<div class="layout">
    <div id="sidebar-container"></div>

    <main class="main">
        <!-- 面包屑 -->
        <div class="breadcrumb-bar">
            <span>🏠</span>
            <a onclick="location.href='产品库.html'">首页</a>
            <span class="sep">/</span>
            <a onclick="location.href='产品库.html'">产品管理</a>
            <span class="sep">/</span>
            <a onclick="location.href='产品库.html'">产品库</a>
            <span class="sep">/</span>
            <span class="current">编辑产品</span>
        </div>

        <!-- 标题卡片 -->
        <div class="title-card">
            <div class="page-title">编辑产品</div>
            <div class="title-actions">
                <button class="btn" onclick="location.href='产品库.html'">返回</button>
                <button class="btn btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>

        <!-- 成功提示 -->
        <div class="alert alert-success" id="successAlert">
            <span>✓</span>
            <span>产品修改已保存，<a class="link" onclick="location.href='产品库.html'">返回列表</a></span>
        </div>

        <!-- 基本信息 -->
        <div class="content-card">
            <div class="card-title">基本信息</div>
            <div class="form-grid">
                <div class="form-item">
                    <label class="form-label"><span class="required">*</span>产品编码</label>
                    <input type="text" class="form-input" id="f-code" readonly>
                </div>
                <div class="form-item">
                    <label class="form-label"><span class="required">*</span>产品名称</label>
                    <input type="text" class="form-input" id="f-name" placeholder="请输入产品名称">
                </div>
                <div class="form-item">
                    <label class="form-label">产品图片</label>
                    <div class="product-image-upload"><span class="product-image-preview" id="image-preview">📦</span><input type="file" class="form-input" id="f-image" accept="image/*" onchange="previewProductImage(this)"></div>
                </div>
                <div class="form-item">
                    <label class="form-label">颜色</label>
                    <input type="text" class="form-input" id="f-color" placeholder="请输入颜色">
                </div>
                <div class="form-item">
                    <label class="form-label">规格</label>
                    <input type="text" class="form-input" id="f-spec" placeholder="请输入规格">
                </div>
                <div class="form-item">
                    <label class="form-label">品牌</label>
                    <input type="text" class="form-input" id="f-brand" placeholder="请输入品牌">
                </div>
                <div class="form-item">
                    <label class="form-label">等级</label>
                    <select class="form-select" id="f-grade">
                        <option value="">请选择</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-item">
                    <label class="form-label"><span class="required">*</span>销售价</label>
                    <input type="number" class="form-input" id="f-price" placeholder="请输入销售价" step="0.01" min="0">
                </div>
                <div class="form-item">
                    <label class="form-label">税率</label>
                    <select class="form-select" id="f-tax">
                        <option value="13">13%</option>
                        <option value="9">9%</option>
                        <option value="6">6%</option>
                        <option value="3">3%</option>
                        <option value="0">0%</option>
                    </select>
                </div>
                <div class="form-item">
                    <label class="form-label">计量单位</label>
                    <select class="form-select" id="f-unit">
                        <option value="个">个</option>
                        <option value="台">台</option>
                        <option value="套">套</option>
                        <option value="箱">箱</option>
                        <option value="件">件</option>
                        <option value="付">付</option>
                        <option value="双">双</option>
                        <option value="条">条</option>
                        <option value="包">包</option>
                    </select>
                </div>
                <div class="form-item">
                    <label class="form-label">产品类型</label>
                    <select class="form-select" id="f-type">
                        <option value="所有产品">所有产品</option>
                        <option value="所有产品 / 劳保商品 / 手部...">所有产品 / 劳保商品 / 手部...</option>
                        <option value="所有产品 / 五金工具 / 电动工...">所有产品 / 五金工具 / 电动工...</option>
                        <option value="所有产品 / 商品存储 / 劳保服...">所有产品 / 商品存储 / 劳保服...</option>
                    </select>
                </div>
                <div class="form-item full">
                    <label class="form-label">备注</label>
                    <textarea class="form-textarea" id="f-remark" placeholder="请输入备注"></textarea>
                </div>
            </div>
        </div>

        <div class="content-card supplier-card">
            <div class="supplier-toolbar">
                <div class="card-title">供应商采购明细</div>
                <button class="btn btn-primary" type="button" onclick="addSupplierRow()">+ 新增供应商</button>
            </div>
            <div class="supplier-table-wrap">
                <table class="supplier-table">
                    <thead><tr><th>供应商</th><th>供应商产品名称</th><th>开始日期</th><th>结束日期</th><th>当前库存数量</th><th>单位</th><th>采购价</th><th>产品备货期</th><th>操作</th></tr></thead>
                    <tbody id="supplier-rows"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    var supplierDetails = [
        { supplier: 'aqtest海赋（山东）数字产业发展有限公司HZ', code: 'HZ-000442', name: '卷门遮挡布', start: '', end: '', stock: 0, unit: '个', price: 200, currency: 'CNY' },
        { supplier: 'aqtest海赋（山东）数字产业发展有限公司LL', code: 'LL-000442', name: '卷门遮挡布', start: '', end: '', stock: 0, unit: '个', price: 50, currency: 'CNY' }
    ];
    function previewProductImage(input) {
        var file = input.files && input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(event) { document.getElementById('image-preview').innerHTML = '<img src="' + event.target.result + '" alt="产品图片">'; };
        reader.readAsDataURL(file);
    }
    function supplierRowHtml(item) {
        item = item || { supplier: '', code: '', name: '', start: '', end: '', stock: 0, unit: '个', price: '', currency: 'CNY' };
        return '<tr><td><select class="supplier-input"><option value="">请选择供应商</option><option ' + (item.supplier === 'aqtest海赋（山东）数字产业发展有限公司HZ' ? 'selected' : '') + '>aqtest海赋（山东）数字产业发展有限公司HZ</option><option ' + (item.supplier === 'aqtest海赋（山东）数字产业发展有限公司LL' ? 'selected' : '') + '>aqtest海赋（山东）数字产业发展有限公司LL</option><option ' + (item.supplier === '青岛海尔智能家电有限公司' ? 'selected' : '') + '>青岛海尔智能家电有限公司</option><option ' + (item.supplier === '菏泽牡丹食品加工厂' ? 'selected' : '') + '>菏泽牡丹食品加工厂</option></select></td><td><input class="supplier-input" value="' + item.name + '"></td><td><input class="supplier-input" type="date" value="' + item.start + '"></td><td><input class="supplier-input" type="date" value="' + item.end + '"></td><td><input class="supplier-input" type="number" min="0" step="0.01" value="' + item.stock + '"></td><td><input class="supplier-input" value="' + item.unit + '"></td><td><input class="supplier-input" type="number" min="0" step="0.01" value="' + item.price + '"></td><td><div class="stock-period"><select class="supplier-input"><option value="3">3天</option><option value="7" selected>7天</option><option value="14">14天</option><option value="30">一个月</option><option value="custom">自定义</option></select><input class="supplier-input stock-days-input" type="number" min="1" value="7" placeholder="天数"></div></td><td><a class="link" onclick="removeSupplierRow(this)">删除</a></td></tr>';
    }
    function renderSupplierRows() { document.getElementById('supplier-rows').innerHTML = supplierDetails.map(supplierRowHtml).join(''); }
    function addSupplierRow() { document.getElementById('supplier-rows').insertAdjacentHTML('beforeend', supplierRowHtml()); }
    function removeSupplierRow(link) { link.closest('tr').remove(); }

    function getParam(name) {
        var reg = new RegExp('[?&]' + name + '=([^&]*)');
        var m = location.search.match(reg);
        return m ? decodeURIComponent(m[1]) : '';
    }

    // 预置产品数据（与列表页一致）
    var products = {
        '00000442': { code:'00000442', name:'卷门遮挡布', color:'', spec:'卷门800*250MM', brand:'', grade:'', company:'', price:225.00, unit:'个', type:'所有产品', stockDays:7, remark:'' },
        '00000443': { code:'00000443', name:'灭火器', color:'', spec:'二氯化碳', brand:'', grade:'', company:'', price:70.00, unit:'个', type:'所有产品', template:'', remark:'' },
        '00000111': { code:'00000111', name:'载手套', color:'', spec:'', brand:'君聪', grade:'', company:'', price:125.00, unit:'双', type:'所有产品', template:'', remark:'' },
        '00000151': { code:'00000151', name:'HONEYWELL/霍尼韦尔 首罩... 黄色', color:'黄色', spec:'VIS110', brand:'HONEYWELL...', grade:'', company:'', price:215.39, unit:'个', type:'所有产品 / 劳保商品 / 零力矩...', template:'', remark:'' },
        '00000020': { code:'00000020', name:'咬达咬口器', color:'', spec:'SOS', brand:'世达', grade:'', company:'', price:1.00, unit:'个', type:'所有产品', template:'', remark:'' },
        '00000009': { code:'00000009', name:'ABB防爆排风扇', color:'', spec:'D171S248BCPF29 DC24V', brand:'国产', grade:'', company:'', price:1.00, unit:'个', type:'所有产品', template:'', remark:'' },
        '00000112': { code:'00000112', name:'安全带', color:'', spec:'全身式', brand:'凯捷', grade:'', company:'', price:125.00, unit:'条', type:'所有产品', template:'', remark:'' },
        '00000828': { code:'00000828', name:'YMD/海美博 迷彩防棉服', color:'', spec:'ZW5C0004 L5L 51+58+32cm', brand:'YMD/海美博', grade:'', company:'', price:71.48, unit:'个', type:'所有产品 / 商品存储 / 劳保服...', template:'', remark:'' },
        '00000057': { code:'00000057', name:'网卡', color:'黄色', spec:'16 寸', brand:'GB/戴格斯', grade:'A', company:'', price:79.00, unit:'件', type:'所有产品', template:'', remark:'' },
        '00000113': { code:'00000113', name:'围裙', color:'', spec:'12G', brand:'三泰', grade:'', company:'', price:125.00, unit:'个', type:'所有产品', template:'', remark:'' },
        '00000264': { code:'00000264', name:'东成 充电式刷柄割草机', color:'', spec:'14V', brand:'DGPR1435LFS', grade:'东成', company:'', price:607.84, unit:'个', type:'所有产品 / 五金工具 / 电动工...', template:'', remark:'' },
        '00000037': { code:'00000037', name:'卫生纸', color:'', spec:'4X100', brand:'原木', grade:'', company:'', price:1.00, unit:'包', type:'所有产品', template:'', remark:'' },
        '00000019': { code:'00000019', name:'布手套', color:'', spec:'', brand:'', grade:'', company:'', price:15.00, unit:'付', type:'所有产品 / 劳保商品 / 手部...', template:'', remark:'' },
    };

    function setSelect(id, val) {
        var sel = document.getElementById(id);
        for (var i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === val) { sel.value = val; return; }
        }
    }

    (function init() {
        var code = getParam('code');
        var p = products[code];
        if (!p) p = products['00000442'];
        document.title = '编辑产品 ' + p.code + ' - 运营管理平台';
        document.getElementById('f-code').value = p.code;
        document.getElementById('f-name').value = p.name;
        document.getElementById('f-color').value = p.color || '';
        document.getElementById('f-spec').value = p.spec || '';
        document.getElementById('f-brand').value = p.brand || '';
        setSelect('f-grade', p.grade || '');
        document.getElementById('f-price').value = p.price;
        setSelect('f-tax', p.tax || '13');
        setSelect('f-unit', p.unit);
        setSelect('f-type', p.type);
        document.getElementById('f-remark').value = p.remark || '';
        renderSupplierRows();
    })();

    function saveProduct() {
        var name = document.getElementById('f-name').value.trim();
        var price = document.getElementById('f-price').value.trim();
        if (!name) { alert('请输入产品名称'); return; }
        if (!price) { alert('请输入销售价'); return; }

        // 演示：仅显示成功提示
        document.getElementById('successAlert').classList.add('show');
        window.scrollTo(0, 0);
        setTimeout(function() { location.href = '产品库.html'; }, 2000);
    }
</script>

<script src="sidebar.js"></script>

</body>
</html>
