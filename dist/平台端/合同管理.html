<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>合同管理 - 平台端</title><link rel="stylesheet" href="../合同管理基础.css"><style>body{min-width:1180px}.top{position:sticky;top:0;z-index:20;height:56px;padding:0 20px;background:#fff;border-bottom:1px solid #f0f0f0;box-shadow:0 1px 4px rgba(0,0,0,.04);color:#333}.brand{display:flex;align-items:center;gap:8px;font-size:16px}.brand-logo{display:grid;width:32px;height:32px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#2BA471,#5BC09F);color:#fff}.top:after{margin-left:auto;content:'Administrator　⌄';color:#666;font-size:13px}.main{padding:16px 20px 36px}.card{border-radius:4px}.title{font-size:18px}.breadcrumb{padding:0 4px}.template{border-radius:4px}</style></head><body>
<div class="top"><div class="brand"><span class="brand-logo">叶</span>运营管理平台</div></div><div class="layout"><div id="sidebar-container"></div><main class="main">
<div class="breadcrumb"><a onclick="location.href='采购订单列表.html'">采购订单</a>　/　合同管理</div><section class="card titlebar"><div class="title">合同管理</div><div class="title-actions"><button class="btn" onclick="ContractBasic.switchTab('templates',document.querySelector('[data-tab=templates]'))">合同模板</button><button class="btn btn-primary" onclick="ContractBasic.openCreate()">新建合同</button></div></section>
<section class="card"><div class="tabs"><div class="tab active" data-tab="contracts" onclick="ContractBasic.switchTab('contracts',this)">全部合同</div><div class="tab" data-tab="templates" onclick="ContractBasic.switchTab('templates',this)">合同模板</div></div><div id="contractsPanel" class="panel"><div class="toolbar"><input id="contractSearch" placeholder="搜索合同编号、名称、签约方"><select id="contractStatus"><option value="">全部状态</option><option value="draft">草稿</option><option value="uploaded">已上传</option><option value="signing">待我签署</option><option value="signed">已签署</option></select><button class="btn" onclick="ContractBasic.renderContracts()">查询</button></div><div style="height:14px"></div><div class="table-wrap"><table class="table"><thead><tr><th>合同编号</th><th>合同名称</th><th>合同类型</th><th>甲方 / 乙方</th><th>关联订单</th><th>合同文件</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="contractBody"></tbody></table></div></div><div id="templatesPanel" class="panel" style="display:none"><div class="toolbar" style="margin-bottom:14px"><span class="muted">平台可查看全部合同模板；平台模板对客户和供应商公开下载。</span><button class="btn btn-primary" style="margin-left:auto" onclick="ContractBasic.openTemplate()">上传平台模板</button></div><div class="template-grid" id="templateGrid"></div></div></section>
</main></div>
<div class="modal-mask" id="createModal"><div class="modal"><div class="modal-head"><span>新建合同</span><button class="close" onclick="ContractBasic.close('createModal')">×</button></div><div class="modal-body"><div class="selection-note">框架合同可不关联订单；采购合同需关联已确定的订单。系统只记录订单关联，合同内容请自行上传完整文件。</div><div class="form-grid"><div><label>合同名称</label><input id="contractName" placeholder="请输入合同名称"></div><div><label>合同类型</label><select id="contractType" onchange="ContractBasic.syncOrderArea()"><option value="purchase">采购合同</option><option value="framework">框架合同</option></select></div><div><label>签约关系</label><select id="contractRelation" onchange="ContractBasic.refreshPartyHint()"><option value="customer-platform">客户—平台</option><option value="platform-supplier">平台—供应商</option></select></div><div><label>甲方</label><input id="partyA"></div><div><label>乙方</label><input id="partyB"></div></div><div id="orderSelector" style="margin-top:20px"><div class="toolbar"><strong>关联订单</strong><input id="orderSearch" placeholder="搜索确定订单" oninput="ContractBasic.renderOrderChoices()"></div><div style="height:10px"></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>订单编号</th><th>订单名称</th><th>状态</th><th>金额</th></tr></thead><tbody id="orderChoices"></tbody></table></div></div><div class="file-line"><strong>合同文件</strong><input id="contractFile" type="file" accept=".doc,.docx,.pdf,.jpg,.jpeg,.png" onchange="ContractBasic.fileSelected(this,'contractFileName')"><span id="contractFileName">尚未选择文件</span></div></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('createModal')">取消</button><button class="btn btn-primary" onclick="ContractBasic.createContract()">保存合同</button></div></div></div>
<div class="modal-mask" id="templateModal"><div class="modal"><div class="modal-head"><span>上传平台合同模板</span><button class="close" onclick="ContractBasic.close('templateModal')">×</button></div><div class="modal-body"><div class="selection-note">平台上传的模板可被客户和供应商查看、下载；不做自动填写。</div><div class="form-grid"><div><label>模板名称</label><input id="templateName" placeholder="例如：平台采购合同模板"></div><div><label>合同类型</label><select id="templateType"><option value="purchase">采购合同</option><option value="framework">框架合同</option></select></div></div><div class="file-line"><strong>模板文件</strong><input id="templateFile" type="file" accept=".doc,.docx,.pdf,.jpg,.jpeg,.png" onchange="ContractBasic.fileSelected(this,'templateFileName')"><span id="templateFileName">尚未选择文件</span></div></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('templateModal')">取消</button><button class="btn btn-primary" onclick="ContractBasic.saveTemplate()">保存模板</button></div></div></div>
<div class="modal-mask" id="detailModal"><div class="modal"><div class="modal-head"><span>合同详情</span><button class="close" onclick="ContractBasic.close('detailModal')">×</button></div><div class="modal-body" id="detailBody"></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('detailModal')">关闭</button></div></div></div>
<script src="sidebar.js"></script><script>window.ContractAppConfig={role:'platform',orders:[{no:'PO20260803002',name:'供应商 A 采购订单',status:'已确认',amount:'¥ 28,560.00'},{no:'PO20260803003',name:'供应商 B 采购订单',status:'已确认',amount:'¥ 12,380.50'},{no:'SO2026080008',name:'客户采购订单',status:'已确认',amount:'¥ 40,940.50'}],demoContracts:[{id:'demo-platform-1',no:'HT20260817005',name:'平台—供应商采购合同',type:'purchase',partyA:'海赋（山东）数字产业发展有限公司',partyB:'供应商 A',orders:'PO20260803002',fileName:'平台供应商采购合同.docx',content:'合同文件（演示）',status:'uploaded',updated:'2026-08-17 09:30'},{id:'demo-platform-2',no:'HT20260816006',name:'客户供应链框架合同',type:'framework',partyA:'客户企业',partyB:'海赋（山东）数字产业发展有限公司',orders:'',fileName:'供应链框架合同.doc',content:'合同文件（演示）',status:'signing',updated:'2026-08-16 13:50'}]};</script><script src="../合同管理基础.js"></script></body></html>
