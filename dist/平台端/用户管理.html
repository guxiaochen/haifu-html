<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh;
        }
        /* 顶部 */
        .top-nav { height: 56px; background: #fff; color: #333; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .account:hover { background: #f5f5f5; }
        .account-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #2BA471, #5BC09F); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #f0f0f0; flex-shrink: 0; padding: 12px 0; }
        .menu-item { padding: 10px 24px 10px 48px; color: #666; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
        .menu-item:hover { background: #f5f5f5; color: #2BA471; }
        .menu-item.active { color: #2BA471; border-left-color: #2BA471; background: #f0faf5; font-weight: 500; }
        .menu-group-title { padding: 10px 20px; color: #333; font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .menu-group-title:first-of-type { margin-top: 4px; }
        .menu-group-icon { font-size: 16px; width: 20px; text-align: center; }

        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar { background: #fff; padding: 12px 20px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        .filter-card { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 13px; outline: none; min-width: 140px; transition: border-color .2s; }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: all .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-danger { color: #ff4d4f; border-color: #ffa39e; }
        .btn-danger:hover { background: #fff1f0; border-color: #ff4d4f; }

        .table-card { background: #fff; padding: 16px 20px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count { color: #999; font-weight: 400; font-size: 13px; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead { background: #fafafa; }
        table th { padding: 10px 12px; text-align: left; color: #555; font-weight: 500; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        table td { padding: 10px 12px; color: #333; border-bottom: 1px solid #f5f5f5; }
        table tbody tr:hover { background: #fafdfb; }
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 8px; }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #ff4d4f; }
        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch span { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 18px; transition: .2s; }
        .switch span:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .2s; }
        .switch input:checked + span { background: #2BA471; }
        .switch input:checked + span:before { transform: translateX(18px); }
    </style>
    <link rel="stylesheet" href="rbac.css">
</head>
<body>

<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<div class="layout">
    <div id="sidebar-container"></div>
    <main class="main">
        <div class="breadcrumb-bar">
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <a>系统管理</a>
            <span class="sep">/</span>
            <span class="current">用户管理</span>
        </div>

        <div class="rbac-split">
            <!-- 左侧部门树 -->
            <div class="rbac-tree-panel">
                <div class="tree-head">
                    <span>部门组织</span>
                    <span class="tree-refresh" onclick="loadDeptTree()">刷新</span>
                </div>
                <div id="dept-tree"></div>
            </div>

            <!-- 右侧用户列表 -->
            <div class="rbac-list-panel">
                <div class="filter-card">
                    <div class="filter-row">
                        <div class="filter-item">
                            <label>登录名称</label>
                            <input type="text" id="f-loginName" placeholder="请输入登录名称">
                        </div>
                        <div class="filter-item">
                            <label>手机号码</label>
                            <input type="text" id="f-phone" placeholder="请输入手机号码">
                        </div>
                        <div class="filter-item">
                            <label>状态</label>
                            <select id="f-status">
                                <option value="">全部</option>
                                <option value="0">正常</option>
                                <option value="1">停用</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>创建时间</label>
                            <input type="date" id="f-date">
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-primary" onclick="searchUsers()">🔍 搜索</button>
                            <button class="btn" onclick="resetSearch()">重置</button>
                        </div>
                    </div>
                </div>

                <div class="table-card">
                    <div class="table-toolbar">
                        <div class="table-title">
                            用户列表
                            <span class="count" id="user-count"></span>
                        </div>
                        <div class="table-toolbar-right rbac-toolbar-btns">
                            <button class="btn btn-primary" onclick="openUserModal()">+ 新增</button>
                            <!-- <button class="btn" onclick="alert('演示项目：导入功能')">📥 导入</button> -->
                            <button class="btn" onclick="exportUsers()">📤 导出</button>
                            <button class="btn btn-danger" onclick="batchDelete()">🗑 删除</button>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width:32px;"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
                                <th>用户编号</th>
                                <th>登录名称</th>
                                <th>用户昵称</th>
                                <th>部门</th>
                                <th>手机号码</th>
                                <th>状态</th>
                                <th>角色</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 用户新增/编辑弹窗 -->
<div class="rbac-modal-mask" id="user-modal">
    <div class="rbac-modal">
        <div class="rbac-modal-header">
            <span class="rbac-modal-title" id="user-modal-title">新增用户</span>
            <span class="rbac-modal-close" onclick="closeUserModal()">×</span>
        </div>
        <div class="rbac-modal-body">
            <div class="rbac-form">
                <div class="form-row">
                    <label>登录名称 <span class="req">*</span></label>
                    <input type="text" id="m-loginName" placeholder="请输入登录名称">
                </div>
                <div class="form-row">
                    <label>用户昵称 <span class="req">*</span></label>
                    <input type="text" id="m-userName" placeholder="请输入用户昵称">
                </div>
                <div class="form-row" id="m-pwd-row">
                    <label>密码 <span class="req">*</span></label>
                    <input type="password" id="m-pwd" placeholder="请输入密码">
                </div>
                <div class="form-row">
                    <label>所属部门</label>
                    <select id="m-deptId"></select>
                </div>
                <div class="form-row">
                    <label>手机号码</label>
                    <input type="text" id="m-phone" placeholder="请输入手机号码">
                </div>
                <div class="form-row">
                    <label>邮箱</label>
                    <input type="text" id="m-email" placeholder="请输入邮箱">
                </div>
                <div class="form-row">
                    <label>性别</label>
                    <select id="m-sex">
                        <option value="0">男</option>
                        <option value="1">女</option>
                        <option value="2">未知</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>状态</label>
                    <select id="m-status">
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                <div class="form-row full">
                    <label>角色分配</label>
                    <div id="m-roles" style="display:flex;flex-wrap:wrap;gap:8px 16px;padding:6px 0;"></div>
                </div>
                <div class="form-row full">
                    <label>备注</label>
                    <textarea id="m-remark" placeholder="请输入备注"></textarea>
                </div>
            </div>
        </div>
        <div class="rbac-modal-footer">
            <button class="btn" onclick="closeUserModal()">取消</button>
            <button class="btn btn-primary" onclick="saveUser()">确定</button>
        </div>
    </div>
</div>

<!-- 重置密码弹窗 -->
<div class="rbac-modal-mask" id="pwd-modal">
    <div class="rbac-modal" style="min-width:420px;">
        <div class="rbac-modal-header">
            <span class="rbac-modal-title">重置密码</span>
            <span class="rbac-modal-close" onclick="document.getElementById('pwd-modal').classList.remove('show')">×</span>
        </div>
        <div class="rbac-modal-body">
            <div class="rbac-form" style="grid-template-columns:1fr;">
                <div class="form-row">
                    <label>登录名称</label>
                    <input type="text" id="pwd-loginName" disabled>
                </div>
                <div class="form-row">
                    <label>新密码 <span class="req">*</span></label>
                    <input type="password" id="pwd-new" placeholder="请输入新密码">
                </div>
            </div>
        </div>
        <div class="rbac-modal-footer">
            <button class="btn" onclick="document.getElementById('pwd-modal').classList.remove('show')">取消</button>
            <button class="btn btn-primary" onclick="confirmResetPwd()">确定</button>
        </div>
    </div>
</div>

<script src="rbac-data.js"></script>
<script src="sidebar.js"></script>
<script>
var selectedDeptId = null;   // 选中的部门 ID（null = 全部）
var editingUserId  = null;   // 当前编辑的用户 ID
var pwdResetUserId = null;   // 当前重置密码的用户 ID

/* ===== 部门树 ===== */
function loadDeptTree() {
    var tree = RBAC.getDeptTree();
    var html = '<div class="tree-node' + (selectedDeptId === null ? ' active' : '') + '" onclick="selectDept(null)">' +
               '<span class="tree-toggle empty"></span><span class="tree-icon">🏠</span><span class="tree-label">全部</span></div>';
    html += renderDeptNodes(tree, 0);
    document.getElementById('dept-tree').innerHTML = html;
}
function renderDeptNodes(nodes, level) {
    var html = '';
    nodes.forEach(function (n) {
        var indent = '';
        for (var i = 0; i < level; i++) indent += '　　';
        var cls = selectedDeptId === n.id ? ' active' : '';
        html += '<div class="tree-node' + cls + '" onclick="selectDept(\'' + n.id + '\')">' +
                '<span class="tree-toggle empty"></span>' +
                '<span class="tree-icon">📁</span>' +
                '<span class="tree-label">' + indent + (level > 0 ? '├ ' : '') + n.name + '</span></div>';
        if (n.children && n.children.length) {
            html += renderDeptNodes(n.children, level + 1);
        }
    });
    return html;
}
function selectDept(deptId) {
    selectedDeptId = deptId || null;
    loadDeptTree();
    renderUsers();
}

/* ===== 用户列表 ===== */
function renderUsers() {
    var users = RBAC.getUsers();
    var roles = RBAC.getRoles();
    var depts = RBAC.getDepts();

    // 按部门筛选
    if (selectedDeptId) {
        var deptIds = RBAC.getDeptChildIds(selectedDeptId);
        users = users.filter(function (u) { return deptIds.indexOf(u.deptId) >= 0; });
    }
    // 搜索条件
    var loginName = document.getElementById('f-loginName').value.trim();
    var phone     = document.getElementById('f-phone').value.trim();
    var status    = document.getElementById('f-status').value;
    if (loginName) users = users.filter(function (u) { return u.loginName.indexOf(loginName) >= 0; });
    if (phone)     users = users.filter(function (u) { return (u.phone || '').indexOf(phone) >= 0; });
    if (status)    users = users.filter(function (u) { return u.status === status; });

    var deptMap = {}; depts.forEach(function (d) { deptMap[d.id] = d.name; });
    var roleMap = {}; roles.forEach(function (r) { roleMap[r.id] = r.name; });

    var html = '';
    users.forEach(function (u) {
        var roleNames = (u.roleIds || []).map(function (rid) { return roleMap[rid] || '-'; }).join('、') || '-';
        var deptName = deptMap[u.deptId] || '-';
        var checked = u.status === '0';
        html += '<tr>' +
            '<td><input type="checkbox" class="row-check" data-id="' + u.id + '"></td>' +
            '<td>' + u.id + '</td>' +
            '<td>' + u.loginName + '</td>' +
            '<td>' + u.userName + '</td>' +
            '<td>' + deptName + '</td>' +
            '<td>' + (u.phone || '-') + '</td>' +
            '<td><label class="switch"><input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleStatus(\'' + u.id + '\', this.checked)"><span></span></label></td>' +
            '<td>' + roleNames + '</td>' +
            '<td>' + (u.createTime || '2026-01-01') + '</td>' +
            '<td>' +
                '<a class="link" onclick="openUserModal(\'' + u.id + '\')">编辑</a>' +
                '<a class="link" onclick="openResetPwd(\'' + u.id + '\')">重置密码</a>' +
                '<a class="link link-danger" onclick="deleteUser(\'' + u.id + '\')">删除</a>' +
            '</td>' +
        '</tr>';
    });
    if (!html) html = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
    document.getElementById('user-tbody').innerHTML = html;
    document.getElementById('user-count').textContent = '共 ' + users.length + ' 条';
}

function searchUsers() { renderUsers(); }
function resetSearch() {
    document.getElementById('f-loginName').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-status').value = '';
    document.getElementById('f-date').value = '';
    renderUsers();
}

function toggleAll(el) {
    document.querySelectorAll('.row-check').forEach(function (cb) { cb.checked = el.checked; });
}
function getCheckedIds() {
    var ids = [];
    document.querySelectorAll('.row-check:checked').forEach(function (cb) { ids.push(cb.dataset.id); });
    return ids;
}

function toggleStatus(userId, checked) {
    var users = RBAC.getUsers();
    var u = users.find(function (x) { return x.id === userId; });
    if (u) {
        u.status = checked ? '0' : '1';
        RBAC.saveUsers(users);
    }
}

/* ===== 新增/编辑 ===== */
function openUserModal(userId) {
    editingUserId = userId || null;
    document.getElementById('user-modal-title').textContent = userId ? '编辑用户' : '新增用户';

    // 部门下拉
    var deptTree = RBAC.getDeptTree();
    var deptOpts = '<option value="">请选择部门</option>' + RBAC.renderTreeOptions(deptTree, 'name', 'id', '');
    document.getElementById('m-deptId').innerHTML = deptOpts;

    // 角色复选
    var roles = RBAC.getRoles();
    var roleHtml = '';
    roles.forEach(function (r) {
        roleHtml += '<label style="display:flex;align-items:center;gap:4px;font-size:13px;color:#333;">' +
                    '<input type="checkbox" class="m-role" value="' + r.id + '"> ' + r.name + '</label>';
    });
    document.getElementById('m-roles').innerHTML = roleHtml;

    if (userId) {
        var u = RBAC.getUserById(userId);
        document.getElementById('m-loginName').value = u.loginName;
        document.getElementById('m-userName').value  = u.userName;
        document.getElementById('m-pwd').value = '';
        document.getElementById('m-pwd-row').style.display = 'none';
        document.getElementById('m-deptId').value = u.deptId || '';
        document.getElementById('m-phone').value  = u.phone || '';
        document.getElementById('m-email').value  = u.email || '';
        document.getElementById('m-sex').value    = u.sex || '0';
        document.getElementById('m-status').value = u.status || '0';
        document.getElementById('m-remark').value = u.remark || '';
        (u.roleIds || []).forEach(function (rid) {
            var cb = document.querySelector('.m-role[value="' + rid + '"]');
            if (cb) cb.checked = true;
        });
    } else {
        document.getElementById('m-loginName').value = '';
        document.getElementById('m-userName').value = '';
        document.getElementById('m-pwd').value = '';
        document.getElementById('m-pwd-row').style.display = '';
        document.getElementById('m-deptId').value = '';
        document.getElementById('m-phone').value = '';
        document.getElementById('m-email').value = '';
        document.getElementById('m-sex').value = '0';
        document.getElementById('m-status').value = '0';
        document.getElementById('m-remark').value = '';
    }
    document.getElementById('user-modal').classList.add('show');
}

function closeUserModal() {
    document.getElementById('user-modal').classList.remove('show');
}

function saveUser() {
    var loginName = document.getElementById('m-loginName').value.trim();
    var userName  = document.getElementById('m-userName').value.trim();
    if (!loginName) { alert('请输入登录名称'); return; }
    if (!userName)  { alert('请输入用户昵称'); return; }

    var roleIds = [];
    document.querySelectorAll('.m-role:checked').forEach(function (cb) { roleIds.push(cb.value); });

    var users = RBAC.getUsers();
    if (editingUserId) {
        var u = users.find(function (x) { return x.id === editingUserId; });
        u.loginName = loginName;
        u.userName  = userName;
        u.deptId    = document.getElementById('m-deptId').value;
        u.phone     = document.getElementById('m-phone').value.trim();
        u.email     = document.getElementById('m-email').value.trim();
        u.sex       = document.getElementById('m-sex').value;
        u.status    = document.getElementById('m-status').value;
        u.remark    = document.getElementById('m-remark').value.trim();
        u.roleIds   = roleIds;
    } else {
        var pwd = document.getElementById('m-pwd').value.trim();
        if (!pwd) { alert('请输入密码'); return; }
        users.push({
            id: RBAC.genId('U'),
            loginName: loginName,
            userName: userName,
            pwd: pwd,
            deptId: document.getElementById('m-deptId').value,
            phone: document.getElementById('m-phone').value.trim(),
            email: document.getElementById('m-email').value.trim(),
            sex: document.getElementById('m-sex').value,
            status: document.getElementById('m-status').value,
            remark: document.getElementById('m-remark').value.trim(),
            roleIds: roleIds,
            createTime: new Date().toISOString().slice(0, 10)
        });
    }
    RBAC.saveUsers(users);
    closeUserModal();
    renderUsers();
}

function deleteUser(userId) {
    if (!confirm('确认删除该用户？')) return;
    var users = RBAC.getUsers().filter(function (u) { return u.id !== userId; });
    RBAC.saveUsers(users);
    renderUsers();
}

function batchDelete() {
    var ids = getCheckedIds();
    if (!ids.length) { alert('请勾选要删除的用户'); return; }
    if (!confirm('确认删除选中的 ' + ids.length + ' 个用户？')) return;
    var users = RBAC.getUsers().filter(function (u) { return ids.indexOf(u.id) < 0; });
    RBAC.saveUsers(users);
    renderUsers();
}

/* ===== 重置密码 ===== */
function openResetPwd(userId) {
    pwdResetUserId = userId;
    var u = RBAC.getUserById(userId);
    document.getElementById('pwd-loginName').value = u.loginName;
    document.getElementById('pwd-new').value = '';
    document.getElementById('pwd-modal').classList.add('show');
}
function confirmResetPwd() {
    var newPwd = document.getElementById('pwd-new').value.trim();
    if (!newPwd) { alert('请输入新密码'); return; }
    var users = RBAC.getUsers();
    var u = users.find(function (x) { return x.id === pwdResetUserId; });
    if (u) { u.pwd = newPwd; RBAC.saveUsers(users); }
    document.getElementById('pwd-modal').classList.remove('show');
    alert('密码重置成功');
}

/* ===== 导出 ===== */
function exportUsers() {
    var users = RBAC.getUsers();
    var roles = RBAC.getRoles();
    var depts = RBAC.getDepts();
    var deptMap = {}; depts.forEach(function (d) { deptMap[d.id] = d.name; });
    var roleMap = {}; roles.forEach(function (r) { roleMap[r.id] = r.name; });
    var header = '用户编号,登录名称,用户昵称,部门,手机号码,状态,角色\n';
    var rows = users.map(function (u) {
        var roleNames = (u.roleIds || []).map(function (rid) { return roleMap[rid] || ''; }).join(';');
        return [u.id, u.loginName, u.userName, deptMap[u.deptId] || '', u.phone || '', u.status === '0' ? '正常' : '停用', roleNames].join(',');
    });
    var csv = header + rows.join('\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '用户列表.csv';
    a.click();
}

/* ===== 初始化 ===== */
loadDeptTree();
renderUsers();
</script>
