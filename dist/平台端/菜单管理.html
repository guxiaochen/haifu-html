<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单管理 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh; }
        .top-nav { height: 56px; background: #fff; color: #333; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .account:hover { background: #f5f5f5; }
        .account-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #2BA471, #5BC09F); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #f0f0f0; flex-shrink: 0; padding: 12px 0; }
        .menu-item { padding: 10px 24px 10px 48px; color: #666; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
        .menu-item:hover { background: #f5f5f5; color: #2BA471; }
        .menu-item.active { color: #2BA471; border-left-color: #2BA471; background: #f0faf5; font-weight: 500; }
        .menu-group-title { padding: 10px 20px; color: #333; font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .menu-group-title:first-of-type { margin-top: 4px; }
        .menu-group-icon { font-size: 16px; width: 20px; text-align: center; }

        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar { background: #fff; padding: 12px 20px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        .filter-card { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 13px; outline: none; min-width: 140px; transition: border-color .2s; }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: all .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-danger { color: #ff4d4f; border-color: #ffa39e; }
        .btn-danger:hover { background: #fff1f0; border-color: #ff4d4f; }

        .table-card { background: #fff; padding: 16px 20px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count { color: #999; font-weight: 400; font-size: 13px; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 8px; }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #ff4d4f; }
    </style>
    <link rel="stylesheet" href="rbac.css">
</head>
<body>

<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<div class="layout">
    <div id="sidebar-container"></div>
    <main class="main">
        <div class="breadcrumb-bar">
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <a>系统管理</a>
            <span class="sep">/</span>
            <span class="current">菜单管理</span>
        </div>

        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>菜单名称</label>
                    <input type="text" id="f-name" placeholder="请输入菜单名称">
                </div>
                <div class="filter-item">
                    <label>是否可见</label>
                    <select id="f-visible">
                        <option value="">全部</option>
                        <option value="0">显示</option>
                        <option value="1">隐藏</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="renderMenuTable()">🔍 搜索</button>
                    <button class="btn" onclick="resetSearch()">重置</button>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-title">
                    菜单列表
                    <span class="count" id="menu-count"></span>
                </div>
                <div class="table-toolbar-right rbac-toolbar-btns">
                    <button class="btn btn-primary" onclick="openMenuModal()">+ 新增</button>
                    <button class="btn" onclick="expandAll(true)">展开全部</button>
                    <button class="btn" onclick="expandAll(false)">折叠全部</button>
                </div>
            </div>
            <table class="tree-table">
                <thead>
                    <tr>
                        <th style="min-width:220px;">菜单名称</th>
                        <th style="width:70px;">图标</th>
                        <th style="width:80px;">类型</th>
                        <th style="width:60px;">排序</th>
                        <th style="width:200px;">路由地址</th>
                        <th style="width:200px;">权限标识</th>
                        <th style="width:80px;">是否可见</th>
                        <th style="width:80px;">状态</th>
                        <th style="width:160px;">创建时间</th>
                        <th style="width:160px;">操作</th>
                    </tr>
                </thead>
                <tbody id="menu-tbody"></tbody>
            </table>
        </div>
    </main>
</div>

<!-- 菜单新增/编辑弹窗 -->
<div class="rbac-modal-mask" id="menu-modal">
    <div class="rbac-modal" style="min-width:620px;">
        <div class="rbac-modal-header">
            <span class="rbac-modal-title" id="menu-modal-title">新增菜单</span>
            <span class="rbac-modal-close" onclick="closeMenuModal()">×</span>
        </div>
        <div class="rbac-modal-body">
            <div class="rbac-form">
                <div class="form-row">
                    <label>上级菜单</label>
                    <select id="m-parentId">
                        <option value="0">主目录</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>菜单类型</label>
                    <select id="m-type" onchange="onTypeChange()">
                        <option value="M">目录</option>
                        <option value="C">菜单</option>
                        <option value="F">按钮</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>菜单名称 <span class="req">*</span></label>
                    <input type="text" id="m-name" placeholder="请输入菜单名称">
                </div>
                <div class="form-row" id="row-icon">
                    <label>图标</label>
                    <input type="text" id="m-icon" placeholder="如 📋">
                </div>
                <div class="form-row" id="row-sort">
                    <label>显示排序</label>
                    <input type="number" id="m-sort" value="0" min="0">
                </div>
                <div class="form-row" id="row-visible">
                    <label>是否可见</label>
                    <select id="m-visible">
                        <option value="0">显示</option>
                        <option value="1">隐藏</option>
                    </select>
                </div>
                <div class="form-row" id="row-path">
                    <label>路由地址</label>
                    <input type="text" id="m-path" placeholder="如 销售订单列表.html">
                </div>
                <div class="form-row" id="row-perms">
                    <label>权限标识</label>
                    <input type="text" id="m-perms" placeholder="如 order:sales:list">
                </div>
                <div class="form-row full">
                    <label>状态</label>
                    <select id="m-status">
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="rbac-modal-footer">
            <button class="btn" onclick="closeMenuModal()">取消</button>
            <button class="btn btn-primary" onclick="saveMenu()">确定</button>
        </div>
    </div>
</div>

<script src="rbac-data.js"></script>
<script src="sidebar.js"></script>
<script>
var editingMenuId = null;
var expandedNodes = {}; // 记录展开状态 { menuId: true }

/* ===== 渲染树表格 ===== */
function renderMenuTable() {
    var tree = RBAC.getMenuTree();
    var searchName = document.getElementById('f-name').value.trim();
    var searchVis  = document.getElementById('f-visible').value;

    // 过滤（搜索时自动展开包含匹配项的路径）
    function filterNodes(nodes) {
        var result = [];
        nodes.forEach(function (n) {
            var matchName = !searchName || n.name.indexOf(searchName) >= 0;
            var matchVis  = !searchVis  || n.visible === searchVis;
            var filteredChildren = n.children && n.children.length ? filterNodes(n.children) : [];
            if ((matchName && matchVis) || filteredChildren.length) {
                var copy = Object.assign({}, n);
                copy.children = filteredChildren;
                if (searchName || searchVis) expandedNodes[n.id] = true; // 搜索时自动展开
                result.push(copy);
            }
        });
        return result;
    }
    var filtered = (searchName || searchVis) ? filterNodes(tree) : tree;

    var html = buildRows(filtered, 0);
    if (!html) html = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
    document.getElementById('menu-tbody').innerHTML = html;

    var allCount = RBAC.getMenus().length;
    document.getElementById('menu-count').textContent = '共 ' + allCount + ' 条';
}

function buildRows(nodes, level) {
    var html = '';
    nodes.forEach(function (n) {
        var hasChildren = n.children && n.children.length;
        var indent = '';
        for (var i = 0; i < level; i++) indent += '　　　';
        var toggleIcon = hasChildren
            ? '<span class="tree-expand-icon" onclick="toggleExpand(\'' + n.id + '\')">' + (expandedNodes[n.id] ? '▼' : '▶') + '</span>'
            : '<span class="tree-expand-icon" style="visibility:hidden;">·</span>';
        var iconDisplay = n.icon ? n.icon : '<span style="color:#ccc;">-</span>';
        var pathDisplay = n.path && n.path !== '#' ? n.path : '<span style="color:#ccc;">-</span>';
        var permsDisplay = n.perms ? n.perms : '<span style="color:#ccc;">-</span>';
        var visibleDisplay = n.visible === '0' ? '<span class="rbac-tag tag-ok">显示</span>' : '<span class="rbac-tag tag-stop">隐藏</span>';

        html += '<tr data-id="' + n.id + '" data-level="' + level + '"' + (level > 0 && !isAncestorExpanded(n.parentId) ? ' style="display:none;"' : '') + '>' +
            '<td><div class="tree-name-cell">' + indent + toggleIcon +
                '<span>' + (level === 0 ? '<strong>' + n.name + '</strong>' : n.name) + '</span></div></td>' +
            '<td>' + iconDisplay + '</td>' +
            '<td>' + RBAC.menuTypeTag(n.type) + '</td>' +
            '<td>' + n.sort + '</td>' +
            '<td style="color:#666;">' + pathDisplay + '</td>' +
            '<td style="color:#999;font-size:12px;">' + permsDisplay + '</td>' +
            '<td>' + visibleDisplay + '</td>' +
            '<td>' + RBAC.statusTag(n.status) + '</td>' +
            '<td style="color:#999;">' + (n.createTime || '2026-01-01') + '</td>' +
            '<td>' +
                '<a class="link" onclick="openMenuModal(null, \'' + n.id + '\')">新增子项</a>' +
                '<a class="link" onclick="openMenuModal(\'' + n.id + '\')">编辑</a>' +
                '<a class="link link-danger" onclick="deleteMenu(\'' + n.id + '\')">删除</a>' +
            '</td>' +
        '</tr>';
        if (hasChildren && expandedNodes[n.id]) {
            html += buildRows(n.children, level + 1);
        }
    });
    return html;
}

/* 判断祖先节点是否展开（控制子行显示/隐藏） */
function isAncestorExpanded(parentId) {
    var menus = RBAC.getMenus();
    var pid = parentId;
    while (pid && pid !== '0') {
        if (!expandedNodes[pid]) return false;
        var p = menus.find(function (m) { return m.id === pid; });
        if (!p) return false;
        pid = p.parentId;
    }
    return true;
}

function toggleExpand(menuId) {
    if (expandedNodes[menuId]) delete expandedNodes[menuId];
    else expandedNodes[menuId] = true;
    renderMenuTable();
}
function expandAll(expand) {
    if (expand) {
        RBAC.getMenus().forEach(function (m) { expandedNodes[m.id] = true; });
    } else {
        expandedNodes = {};
    }
    renderMenuTable();
}

function resetSearch() {
    document.getElementById('f-name').value = '';
    document.getElementById('f-visible').value = '';
    expandedNodes = {};
    renderMenuTable();
}

/* ===== 新增/编辑 ===== */
function openMenuModal(menuId, presetParentId) {
    editingMenuId = menuId || null;
    document.getElementById('menu-modal-title').textContent = menuId ? '编辑菜单' : '新增菜单';

    // 上级菜单下拉（树形）
    var tree = RBAC.getMenuTree();
    var opts = '<option value="0">主目录</option>' + RBAC.renderTreeOptions(tree, 'name', 'id', '');
    document.getElementById('m-parentId').innerHTML = opts;

    if (menuId) {
        var m = RBAC.getMenuById(menuId);
        document.getElementById('m-parentId').value = m.parentId;
        document.getElementById('m-type').value    = m.type;
        document.getElementById('m-name').value    = m.name;
        document.getElementById('m-icon').value    = m.icon || '';
        document.getElementById('m-sort').value    = m.sort || 0;
        document.getElementById('m-visible').value = m.visible || '0';
        document.getElementById('m-path').value    = m.path || '';
        document.getElementById('m-perms').value   = m.perms || '';
        document.getElementById('m-status').value  = m.status || '0';
    } else {
        document.getElementById('m-parentId').value = presetParentId || '0';
        document.getElementById('m-type').value = 'M';
        document.getElementById('m-name').value = '';
        document.getElementById('m-icon').value = '';
        document.getElementById('m-sort').value = 0;
        document.getElementById('m-visible').value = '0';
        document.getElementById('m-path').value = '';
        document.getElementById('m-perms').value = '';
        document.getElementById('m-status').value = '0';
    }
    onTypeChange();
    document.getElementById('menu-modal').classList.add('show');
}

function closeMenuModal() {
    document.getElementById('menu-modal').classList.remove('show');
}

/* 根据类型控制字段显隐：按钮(F)不显示图标/路由/可见性 */
function onTypeChange() {
    var type = document.getElementById('m-type').value;
    var isBtn = type === 'F';
    document.getElementById('row-icon').style.display = isBtn ? 'none' : '';
    document.getElementById('row-path').style.display = isBtn ? 'none' : '';
    document.getElementById('row-visible').style.display = isBtn ? 'none' : '';
}

function saveMenu() {
    var name = document.getElementById('m-name').value.trim();
    if (!name) { alert('请输入菜单名称'); return; }

    var data = {
        parentId: document.getElementById('m-parentId').value,
        type:     document.getElementById('m-type').value,
        name:     name,
        icon:     document.getElementById('m-icon').value.trim(),
        sort:     parseInt(document.getElementById('m-sort').value) || 0,
        visible:  document.getElementById('m-visible').value,
        path:     document.getElementById('m-path').value.trim(),
        perms:    document.getElementById('m-perms').value.trim(),
        status:   document.getElementById('m-status').value
    };

    var menus = RBAC.getMenus();
    if (editingMenuId) {
        var m = menus.find(function (x) { return x.id === editingMenuId; });
        Object.assign(m, data);
    } else {
        data.id = RBAC.genId('M');
        data.createTime = new Date().toISOString().slice(0, 10);
        menus.push(data);
        expandedNodes[data.parentId] = true;
    }
    RBAC.saveMenus(menus);
    closeMenuModal();
    renderMenuTable();
}

function deleteMenu(menuId) {
    // 递归删除子菜单
    var menus = RBAC.getMenus();
    var toDelete = [menuId];
    function collect(pid) {
        menus.filter(function (m) { return m.parentId === pid; }).forEach(function (m) {
            toDelete.push(m.id);
            collect(m.id);
        });
    }
    collect(menuId);
    if (!confirm('确认删除该菜单及其所有子菜单（共 ' + toDelete.length + ' 项）？')) return;
    menus = menus.filter(function (m) { return toDelete.indexOf(m.id) < 0; });
    RBAC.saveMenus(menus);
    renderMenuTable();
}

/* ===== 初始化 ===== */
renderMenuTable();
</script>
</body>
</html>
