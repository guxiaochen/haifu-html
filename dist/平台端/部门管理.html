<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh; }
        .top-nav { height: 56px; background: #fff; color: #333; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .account:hover { background: #f5f5f5; }
        .account-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #2BA471, #5BC09F); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #f0f0f0; flex-shrink: 0; padding: 12px 0; }
        .menu-item { padding: 10px 24px 10px 48px; color: #666; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
        .menu-item:hover { background: #f5f5f5; color: #2BA471; }
        .menu-item.active { color: #2BA471; border-left-color: #2BA471; background: #f0faf5; font-weight: 500; }
        .menu-group-title { padding: 10px 20px; color: #333; font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .menu-group-title:first-of-type { margin-top: 4px; }
        .menu-group-icon { font-size: 16px; width: 20px; text-align: center; }

        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar { background: #fff; padding: 12px 20px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        .filter-card { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 13px; outline: none; min-width: 140px; transition: border-color .2s; }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: all .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-danger { color: #ff4d4f; border-color: #ffa39e; }
        .btn-danger:hover { background: #fff1f0; border-color: #ff4d4f; }

        .table-card { background: #fff; padding: 16px 20px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count { color: #999; font-weight: 400; font-size: 13px; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 8px; }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #ff4d4f; }
    </style>
    <link rel="stylesheet" href="rbac.css">
</head>
<body>

<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<div class="layout">
    <div id="sidebar-container"></div>
    <main class="main">
        <div class="breadcrumb-bar">
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <a>系统管理</a>
            <span class="sep">/</span>
            <span class="current">部门管理</span>
        </div>

        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>部门名称</label>
                    <input type="text" id="f-name" placeholder="请输入部门名称">
                </div>
                <div class="filter-item">
                    <label>状态</label>
                    <select id="f-status">
                        <option value="">全部</option>
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="renderDeptTable()">🔍 搜索</button>
                    <button class="btn" onclick="resetSearch()">重置</button>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-title">
                    部门列表
                    <span class="count" id="dept-count"></span>
                </div>
                <div class="table-toolbar-right rbac-toolbar-btns">
                    <button class="btn btn-primary" onclick="openDeptModal()">+ 新增</button>
                    <button class="btn" onclick="expandAll(true)">展开全部</button>
                    <button class="btn" onclick="expandAll(false)">折叠全部</button>
                </div>
            </div>
            <table class="tree-table">
                <thead>
                    <tr>
                        <th style="min-width:200px;">部门名称</th>
                        <th style="width:100px;">显示顺序</th>
                        <th style="width:100px;">负责人</th>
                        <th style="width:130px;">联系电话</th>
                        <th style="width:180px;">邮箱</th>
                        <th style="width:80px;">状态</th>
                        <th style="width:120px;">创建时间</th>
                        <th style="width:160px;">操作</th>
                    </tr>
                </thead>
                <tbody id="dept-tbody"></tbody>
            </table>
        </div>
    </main>
</div>

<!-- 部门新增/编辑弹窗 -->
<div class="rbac-modal-mask" id="dept-modal">
    <div class="rbac-modal" style="min-width:560px;">
        <div class="rbac-modal-header">
            <span class="rbac-modal-title" id="dept-modal-title">新增部门</span>
            <span class="rbac-modal-close" onclick="closeDeptModal()">×</span>
        </div>
        <div class="rbac-modal-body">
            <div class="rbac-form">
                <div class="form-row full">
                    <label>上级部门</label>
                    <select id="m-parentId">
                        <option value="0">顶级</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>部门名称 <span class="req">*</span></label>
                    <input type="text" id="m-name" placeholder="请输入部门名称">
                </div>
                <div class="form-row">
                    <label>显示顺序</label>
                    <input type="number" id="m-sort" value="0" min="0">
                </div>
                <div class="form-row">
                    <label>负责人</label>
                    <input type="text" id="m-leader" placeholder="请输入负责人">
                </div>
                <div class="form-row">
                    <label>联系电话</label>
                    <input type="text" id="m-phone" placeholder="请输入联系电话">
                </div>
                <div class="form-row">
                    <label>邮箱</label>
                    <input type="text" id="m-email" placeholder="请输入邮箱">
                </div>
                <div class="form-row">
                    <label>状态</label>
                    <select id="m-status">
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="rbac-modal-footer">
            <button class="btn" onclick="closeDeptModal()">取消</button>
            <button class="btn btn-primary" onclick="saveDept()">确定</button>
        </div>
    </div>
</div>

<script src="rbac-data.js"></script>
<script src="sidebar.js"></script>
<script>
var editingDeptId = null;
var expandedNodes = {};

/* ===== 渲染树表格 ===== */
function renderDeptTable() {
    var tree = RBAC.getDeptTree();
    var searchName = document.getElementById('f-name').value.trim();
    var searchStatus = document.getElementById('f-status').value;

    function filterNodes(nodes) {
        var result = [];
        nodes.forEach(function (n) {
            var matchName = !searchName || n.name.indexOf(searchName) >= 0;
            var matchStatus = !searchStatus || n.status === searchStatus;
            var filteredChildren = n.children && n.children.length ? filterNodes(n.children) : [];
            if ((matchName && matchStatus) || filteredChildren.length) {
                var copy = Object.assign({}, n);
                copy.children = filteredChildren;
                if (searchName || searchStatus) expandedNodes[n.id] = true;
                result.push(copy);
            }
        });
        return result;
    }
    var filtered = (searchName || searchStatus) ? filterNodes(tree) : tree;
    var html = buildRows(filtered, 0);
    if (!html) html = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
    document.getElementById('dept-tbody').innerHTML = html;
    document.getElementById('dept-count').textContent = '共 ' + RBAC.getDepts().length + ' 条';
}

function buildRows(nodes, level) {
    var html = '';
    nodes.forEach(function (n) {
        var hasChildren = n.children && n.children.length;
        var indent = '';
        for (var i = 0; i < level; i++) indent += '　　　';
        var toggleIcon = hasChildren
            ? '<span class="tree-expand-icon" onclick="toggleExpand(\'' + n.id + '\')">' + (expandedNodes[n.id] ? '▼' : '▶') + '</span>'
            : '<span class="tree-expand-icon" style="visibility:hidden;">·</span>';

        html += '<tr data-id="' + n.id + '"' + (level > 0 && !isAncestorExpanded(n.parentId) ? ' style="display:none;"' : '') + '>' +
            '<td><div class="tree-name-cell">' + indent + toggleIcon +
                '<span>' + (level === 0 ? '<strong>' + n.name + '</strong>' : n.name) + '</span></div></td>' +
            '<td>' + n.sort + '</td>' +
            '<td>' + (n.leader || '-') + '</td>' +
            '<td>' + (n.phone || '-') + '</td>' +
            '<td style="color:#666;">' + (n.email || '-') + '</td>' +
            '<td>' + RBAC.statusTag(n.status) + '</td>' +
            '<td style="color:#999;">' + (n.createTime || '2026-01-01') + '</td>' +
            '<td>' +
                '<a class="link" onclick="openDeptModal(null, \'' + n.id + '\')">新增子部门</a>' +
                '<a class="link" onclick="openDeptModal(\'' + n.id + '\')">编辑</a>' +
                '<a class="link link-danger" onclick="deleteDept(\'' + n.id + '\')">删除</a>' +
            '</td>' +
        '</tr>';
        if (hasChildren && expandedNodes[n.id]) {
            html += buildRows(n.children, level + 1);
        }
    });
    return html;
}

function isAncestorExpanded(parentId) {
    var depts = RBAC.getDepts();
    var pid = parentId;
    while (pid && pid !== '0') {
        if (!expandedNodes[pid]) return false;
        var p = depts.find(function (d) { return d.id === pid; });
        if (!p) return false;
        pid = p.parentId;
    }
    return true;
}

function toggleExpand(deptId) {
    if (expandedNodes[deptId]) delete expandedNodes[deptId];
    else expandedNodes[deptId] = true;
    renderDeptTable();
}
function expandAll(expand) {
    if (expand) {
        RBAC.getDepts().forEach(function (d) { expandedNodes[d.id] = true; });
    } else {
        expandedNodes = {};
    }
    renderDeptTable();
}
function resetSearch() {
    document.getElementById('f-name').value = '';
    document.getElementById('f-status').value = '';
    expandedNodes = {};
    renderDeptTable();
}

/* ===== 新增/编辑 ===== */
function openDeptModal(deptId, presetParentId) {
    editingDeptId = deptId || null;
    document.getElementById('dept-modal-title').textContent = deptId ? '编辑部门' : '新增部门';

    var tree = RBAC.getDeptTree();
    var opts = '<option value="0">顶级</option>' + RBAC.renderTreeOptions(tree, 'name', 'id', '');

    // 编辑时，不能把自己或子部门设为父节点（防止环）
    if (deptId) {
        var disabledIds = RBAC.getDeptChildIds(deptId);
        opts = opts.replace(/<option value="([^"]+)"/g, function (match, val) {
            if (disabledIds.indexOf(val) >= 0) return match.replace('<option', '<option disabled');
            return match;
        });
    }
    document.getElementById('m-parentId').innerHTML = opts;

    if (deptId) {
        var d = RBAC.getDeptById(deptId);
        document.getElementById('m-parentId').value = d.parentId;
        document.getElementById('m-name').value   = d.name;
        document.getElementById('m-sort').value   = d.sort || 0;
        document.getElementById('m-leader').value = d.leader || '';
        document.getElementById('m-phone').value  = d.phone || '';
        document.getElementById('m-email').value  = d.email || '';
        document.getElementById('m-status').value = d.status || '0';
    } else {
        document.getElementById('m-parentId').value = presetParentId || '0';
        document.getElementById('m-name').value = '';
        document.getElementById('m-sort').value = 0;
        document.getElementById('m-leader').value = '';
        document.getElementById('m-phone').value = '';
        document.getElementById('m-email').value = '';
        document.getElementById('m-status').value = '0';
    }
    document.getElementById('dept-modal').classList.add('show');
}

function closeDeptModal() {
    document.getElementById('dept-modal').classList.remove('show');
}

function saveDept() {
    var name = document.getElementById('m-name').value.trim();
    if (!name) { alert('请输入部门名称'); return; }

    var data = {
        parentId: document.getElementById('m-parentId').value,
        name:     name,
        sort:     parseInt(document.getElementById('m-sort').value) || 0,
        leader:   document.getElementById('m-leader').value.trim(),
        phone:    document.getElementById('m-phone').value.trim(),
        email:    document.getElementById('m-email').value.trim(),
        status:   document.getElementById('m-status').value
    };

    var depts = RBAC.getDepts();
    if (editingDeptId) {
        var d = depts.find(function (x) { return x.id === editingDeptId; });
        Object.assign(d, data);
    } else {
        data.id = RBAC.genId('D');
        data.createTime = new Date().toISOString().slice(0, 10);
        depts.push(data);
        expandedNodes[data.parentId] = true;
    }
    RBAC.saveDepts(depts);
    closeDeptModal();
    renderDeptTable();
}

function deleteDept(deptId) {
    var depts = RBAC.getDepts();
    var toDelete = [deptId];
    function collect(pid) {
        depts.filter(function (d) { return d.parentId === pid; }).forEach(function (d) {
            toDelete.push(d.id);
            collect(d.id);
        });
    }
    collect(deptId);
    if (!confirm('确认删除该部门及其所有子部门（共 ' + toDelete.length + ' 项）？')) return;
    depts = depts.filter(function (d) { return toDelete.indexOf(d.id) < 0; });
    RBAC.saveDepts(depts);
    renderDeptTable();
}

/* ===== 初始化 ===== */
renderDeptTable();
</script>
</body>
</html>
