<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待采订单审核 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh;
        }

        /* ===== 顶部导航 ===== */
        .top-nav {
            height: 56px; background: #fff; color: #333;
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .top-nav-icon {
            cursor: pointer; color: #666; position: relative;
            font-size: 18px; padding: 6px; border-radius: 4px;
        }
        .top-nav-icon:hover { background: #f5f5f5; color: #2BA471; }
        .top-nav-icon .badge {
            position: absolute; top: 2px; right: 2px;
            background: #ff4d4f; color: #fff; font-size: 11px;
            min-width: 16px; height: 16px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
        }
        .account {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; padding: 4px 10px; border-radius: 4px;
            font-size: 13px; color: #333;
        }
        .account:hover { background: #f5f5f5; }
        .account-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #2BA471, #5BC09F);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
        }
        .account-name { font-size: 13px; }

        /* ===== 左右分栏 ===== */
        .layout { display: flex; min-height: calc(100vh - 56px); }

        /* 右侧主内容 */
        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar {
            background: #fff; padding: 12px 20px;
            border-radius: 4px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .breadcrumb-bar .menu-toggle { font-size: 18px; color: #666; cursor: pointer; margin-right: 8px; }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar a:hover { color: #2BA471; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        /* 搜索筛选区 */
        .filter-card {
            background: #fff; padding: 20px;
            border-radius: 4px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select {
            padding: 6px 10px; border: 1px solid #d9d9d9;
            border-radius: 2px; font-size: 13px;
            outline: none; min-width: 140px;
            transition: border-color .2s;
        }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        /* 按钮 */
        .btn {
            padding: 6px 16px; border: 1px solid #d9d9d9;
            background: #fff; border-radius: 2px;
            cursor: pointer; font-size: 13px; color: #333;
            transition: all .2s;
        }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-search { background: #fff; }

        /* 列表表格 */
        .table-card {
            background: #fff; padding: 16px 20px;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count { color: #999; font-weight: 400; font-size: 13px; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }
        .btn-add {
            background: #2BA471; color: #fff; border: none;
            padding: 7px 18px; border-radius: 2px; font-size: 13px; cursor: pointer;
        }
        .btn-add:hover { background: #229963; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead { background: #fafafa; }
        table th {
            padding: 10px 12px; text-align: left; color: #555;
            font-weight: 500; border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        table td {
            padding: 12px; color: #333; border-bottom: 1px solid #f5f5f5;
        }
        table tbody tr:hover { background: #fafdfb; }

        /* 审核状态徽标 */
        .audit-status {
            display: inline-block; padding: 2px 10px;
            border-radius: 10px; font-size: 12px; font-weight: 500;
        }
        .audit-pending { background: #fff7e6; color: #d48806; border: 1px solid #ffd591; }
        .audit-pass { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .audit-reject { background: #fff2f0; color: #cf1322; border: 1px solid #ffa39e; }

        /* 操作链接 */
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 12px; }
        .link:hover { text-decoration: underline; }
        .link-disabled { color: #bfbfbf; margin-right: 12px; cursor: not-allowed; }

        /* 分页 */
        .pagination {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 8px; margin-top: 16px; font-size: 13px; color: #666;
        }
        .pagination .page-info { margin-right: 16px; }
        .page-btn {
            min-width: 28px; height: 28px; padding: 0 8px;
            border: 1px solid #d9d9d9; background: #fff;
            border-radius: 2px; cursor: pointer; font-size: 13px;
        }
        .page-btn:hover { color: #2BA471; border-color: #2BA471; }
        .page-btn.active { background: #2BA471; color: #fff; border-color: #2BA471; }
        .page-btn:disabled { color: #ccc; cursor: not-allowed; }
        .page-jumper input {
            width: 40px; padding: 4px 6px; border: 1px solid #d9d9d9;
            border-radius: 2px; margin: 0 4px; text-align: center;
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">

        <div class="top-nav-icon" title="消息">🔔<span class="badge">13</span></div>
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<!-- 左右分栏 -->
<div class="layout">

    <!-- 左侧菜单（组件化） -->
    <div id="sidebar-container"></div>

    <!-- 右侧主内容 -->
    <main class="main">

        <!-- 面包屑导航 -->
        <div class="breadcrumb-bar">
            <span class="menu-toggle">☰</span>
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <span class="current">待采订单审核</span>
        </div>

        <!-- 搜索筛选区 -->
        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>待采订单号</label>
                    <input type="text" id="order-filter" placeholder="请输入待采订单号">
                </div>
                <div class="filter-item">
                    <label>客户名称</label>
                    <input type="text" placeholder="请输入客户名称">
                </div>
                <div class="filter-item">
                    <label>订单状态</label>
                    <select id="status-filter">
                        <option value="">全部</option>
                        <option value="pending">待审核</option>
                        <option value="review">审核中</option>
                        <option value="pass">审核通过</option>
                        <option value="reject">审核驳回</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-search" onclick="applyFilter()">🔍 搜索</button>
                    <button class="btn" onclick="resetFilter()">重置</button>
                </div>
            </div>
        </div>

        <!-- 表格 -->
        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-title">
                    待采订单
                    <span class="count" id="total-count">共 0 条</span>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>待采单号</th>
                        <th>确认日期</th>
                        <th>客户</th>
                        <th>源销售单</th>
                        <th>金额</th>
                        <th>审核状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="audit-tbody">
                    <!-- 由 JS 渲染 -->
                </tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination">
                <span class="page-info" id="page-info">共 0 条</span>
                <button class="page-btn" disabled>‹</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">›</button>
            </div>
        </div>
    </main>
</div>

<!-- 左侧菜单组件 -->
<script src="sidebar.js"></script>

<script>
    // 预置演示数据（内存态，每次打开重置）
    // status: empty(未提交) / pending(待审核) / pass(审核通过) / reject(审核驳回)
    var auditData = [
        { order: '待采-SO000205', source: 'SO000205', customer: 'agtest淘宝（山东）数字产业发展有限公司LL', contact: '侯振鲁', amount: '¥ 8,970.59', time: '2026-04-01 09:12', status: '' },
        { order: '待采-SO000210', source: 'SO000210', customer: '青岛海尔智能家电有限公司', contact: '王晓东', amount: '¥ 18,500.00', time: '2026-04-02 14:30', status: 'pending' },
        { order: '待采-SO000208', source: 'SO000208', customer: '菏泽牡丹食品加工厂', contact: '李梅', amount: '¥ 6,420.50', time: '2026-04-02 16:45', status: 'pending' },
        { order: '待采-SO000203', source: 'SO000203', customer: '济南历下区机械设备有限公司', contact: '张建国', amount: '¥ 32,800.00', time: '2026-03-28 10:05', status: 'pass' },
        { order: '待采-SO000201', source: 'SO000201', customer: '青岛港物流股份有限公司', contact: '陈志远', amount: '¥ 9,650.00', time: '2026-03-26 11:20', status: 'pass' },
        { order: '待采-SO000198', source: 'SO000198', customer: '潍坊寿光蔬菜产业园', contact: '刘慧敏', amount: '¥ 1,280.00', time: '2026-03-24 09:00', status: 'reject' },
        { order: '待采-SO000196', source: 'SO000196', customer: '烟台苹果合作社', contact: '孙强', amount: '¥ 4,560.00', time: '2026-03-22 15:40', status: 'reject' }
    ];

    var statusMap = {
        '':       ['', ''],
        pending: ['audit-pending', '待审核'],
        review:  ['audit-review', '审核中'],
        pass:    ['audit-pass', '审核通过'],
        reject:  ['audit-reject', '审核驳回']
    };

    function renderRows(list) {
        var tbody = document.getElementById('audit-tbody');
        tbody.innerHTML = '';
        list.forEach(function(o) {
            var sm = statusMap[o.status];
            var tr = document.createElement('tr');
            var detailUrl = '待采订单详情.html?order=' + encodeURIComponent(o.order) + '&status=' + o.status;
            var reviewUrl = '待采订单审核详情.html?order=' + encodeURIComponent(o.order) + '&status=' + o.status;
            var opHtml;
            if (o.status === 'pending') {
                opHtml = '<a class="link" onclick="location.href=\'' + reviewUrl + '\'">审核</a>';
            } else if (o.status === '') {
                opHtml = '';
            } else if (o.status === 'pass' || o.status === 'reject' || o.status === 'review') {
                opHtml = '';
            }
            tr.innerHTML =
                '<td><a class="link" onclick="location.href=\'' + detailUrl + '\'">' + o.order + '</a></td>' +
                '<td>' + o.time + '</td>' +
                '<td>' + o.customer + '</td>' +
                '<td><a class="link" onclick="location.href=\'销售订单详情.html?order=' + encodeURIComponent(o.source) + '\'">' + o.source + '</a></td>' +
                '<td>' + o.amount + '</td>' +
                '<td><span class="audit-status ' + sm[0] + '">' + sm[1] + '</span></td>' +
                '<td>' + opHtml + ' <a class="link" onclick="location.href=\'' + detailUrl + '\'">查看</a></td>';
            tbody.appendChild(tr);
        });
        document.getElementById('total-count').textContent = '共 ' + list.length + ' 条';
        document.getElementById('page-info').textContent = '共 ' + list.length + ' 条';
    }

    function submitPending(orderNo) {
        var item = auditData.find(function(row) { return row.order === orderNo; });
        if (!item || item.status !== 'pending') return;
        item.status = 'review';
        renderRows(auditData);
        alert('待采订单已提交审核，供应商信息将锁定');
    }

    function applyFilter() {
        var kw = (document.getElementById('order-filter').value || '').trim().toLowerCase();
        var st = document.getElementById('status-filter').value;
        var list = auditData.filter(function(o) {
            var okKw = !kw || o.order.toLowerCase().indexOf(kw) >= 0 || o.source.toLowerCase().indexOf(kw) >= 0 || o.customer.toLowerCase().indexOf(kw) >= 0;
            var okSt = !st || o.status === st;
            return okKw && okSt;
        });
        renderRows(list);
    }

    function resetFilter() {
        document.getElementById('order-filter').value = '';
        document.getElementById('status-filter').value = '';
        renderRows(auditData);
    }

    // 初始渲染
    renderRows(auditData);
</script>

</body>
</html>
