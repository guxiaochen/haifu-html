<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家入驻 - 供应商端</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#262626;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.main-area{margin-left:200px;min-height:100vh}.top-nav{height:50px;background:#fff;border-bottom:1px solid #f0f0f0;padding:0 24px;display:flex;align-items:center;position:sticky;top:0;z-index:10}.breadcrumb{display:flex;gap:8px;align-items:center;color:#666}.breadcrumb .current{color:#262626;font-weight:500}.sep{color:#d9d9d9}.user{margin-left:auto;color:#666}.main{max-width:1060px;margin:0 auto;padding:22px 20px 48px}.page-title{font-size:20px;font-weight:600;margin:0 0 16px}.steps{background:#fff;border-radius:4px;padding:22px 70px;margin-bottom:16px;display:flex;align-items:flex-start;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}.step{width:170px;text-align:center;position:relative;color:#999}.circle{width:28px;height:28px;border:1px solid #d9d9d9;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:#fff}.step b{display:block;font-size:14px;color:#595959}.step small{display:block;margin-top:3px;color:#999}.step.active .circle,.step.done .circle{color:#fff;background:#1890ff;border-color:#1890ff}.step.active b{color:#1890ff}.step.done b{color:#262626}.line{height:1px;flex:1;max-width:350px;background:#d9d9d9;margin-top:14px}.line.done{background:#1890ff}.card{background:#fff;border-radius:4px;padding:28px 40px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.hint{padding:10px 12px;background:#e6f7ff;border:1px solid #91d5ff;border-radius:3px;color:#096dd9;margin-bottom:22px}.info-block{border:1px solid #f0f0f0;border-radius:4px;margin-bottom:18px;padding:20px 22px}.info-block:last-child{margin-bottom:0}.block-head{display:flex;align-items:center;padding-bottom:14px;border-bottom:1px solid #f0f0f0;margin-bottom:4px}.section-title{font-size:15px;font-weight:600;margin:0;padding-left:10px;border-left:3px solid #1890ff}.block-note{margin:8px 0 14px;color:#8c8c8c;font-size:13px}.status-tag{margin-left:auto;padding:3px 8px;border-radius:2px;font-size:12px}.status-tag.verified{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f}.status-tag.identified{background:#e6f7ff;color:#096dd9;border:1px solid #91d5ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 38px}.item{display:flex;min-height:45px;border-bottom:1px solid #f0f0f0;align-items:center}.item.full{grid-column:1 / -1}.label{width:132px;text-align:right;color:#8c8c8c;padding-right:16px;flex:none}.value{color:#262626;min-width:0;word-break:break-all}.readonly{color:#595959}.item.doc{padding:12px 0;align-items:flex-start}.item.doc>.label{padding-top:3px}.doc-list{display:flex;gap:16px;flex-wrap:wrap}.doc-card{width:132px;cursor:pointer}.doc-thumb{height:92px;border:1px solid #d9d9d9;border-radius:2px;background:linear-gradient(180deg,#f5f7fa,#eceff3);display:flex;align-items:center;justify-content:center;color:#8c8c8c;font-size:13px;letter-spacing:1px;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}.doc-card:hover .doc-thumb{border-color:#1890ff;box-shadow:0 1px 4px rgba(24,144,255,.2)}.doc-thumb::after{content:"查看大图";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:12px;letter-spacing:0;opacity:0;transition:opacity .15s}.doc-card:hover .doc-thumb::after{opacity:1}.doc-card.idcard{width:108px}.doc-card.idcard .doc-thumb{height:68px;font-size:12px}.doc-name{margin-top:6px;text-align:center;font-size:12px;color:#8c8c8c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}.viewer.show{display:flex}.viewer-box{position:relative;background:#fff;padding:8px;border-radius:4px}.viewer-img{width:660px;height:460px;max-width:80vw;max-height:76vh;background:linear-gradient(180deg,#f5f7fa,#eceff3);display:flex;align-items:center;justify-content:center;color:#8c8c8c;font-size:16px;letter-spacing:2px}.viewer-img.idcard{height:416px}.viewer-close{position:absolute;top:-34px;right:0;color:#fff;font-size:24px;line-height:1;cursor:pointer;user-select:none}.upload-license{display:flex;align-items:center;gap:12px}.upload-license input{display:none}.upload-license label{display:inline-flex;align-items:center;height:32px;padding:0 14px;color:#1890ff;border:1px solid #1890ff;border-radius:2px;cursor:pointer}.upload-license label:hover{background:#e6f7ff}.upload-text{font-size:13px;color:#8c8c8c}.preview{color:#1890ff;cursor:pointer}.field{width:100%;height:34px;border:1px solid #d9d9d9;border-radius:2px;padding:6px 10px;font:inherit;outline:none}.field:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.14)}select.field{background:#fff}.company-input{max-width:290px}.form-item{margin-bottom:20px}.form-item label{display:block;margin-bottom:14px;color:#595959}.required::before{content:"*";color:#ff4d4f;margin-right:4px}.radio{display:flex;gap:25px;height:34px;align-items:center}.radio label{margin:0;color:#262626;cursor:pointer}.category-box{min-height:82px;border:1px solid #d9d9d9;border-radius:2px;padding:9px;display:flex;gap:8px;align-content:flex-start;flex-wrap:wrap}.tag{background:#e6f7ff;border:1px solid #91d5ff;color:#096dd9;border-radius:2px;padding:4px 8px}.tag::after{content:" ×";cursor:pointer}.contact-grid{max-width:520px}.footer{margin-top:26px;display:flex;justify-content:center;gap:12px}.btn{height:34px;padding:0 24px;border:1px solid #d9d9d9;background:#fff;border-radius:2px;color:#595959;cursor:pointer;font:inherit}.btn:hover{color:#1890ff;border-color:#1890ff}.btn.primary{background:#1890ff;color:#fff;border-color:#1890ff}.btn.primary:hover{background:#40a9ff}.step-page{display:none}.step-page.active{display:block}.result{padding:46px 20px;text-align:center}.result-icon{width:56px;height:56px;border-radius:50%;background:#fff7e6;color:#fa8c16;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px}.result h2{font-size:18px;margin:0 0 10px}.result p{color:#8c8c8c;margin:0}.result-info{margin:24px auto 0;max-width:470px;text-align:left;background:#fafafa;padding:16px 20px;line-height:2;color:#595959}@media(max-width:760px){.main-area{margin-left:0}.grid{grid-template-columns:1fr}.steps{padding:20px 12px}.step{width:100px}.card{padding:24px 18px}.sidebar{display:none}.item.full{grid-column:auto}}
</style>
</head>
<body>
<script src="sidebar.js"></script>
<div class="main-area">
  <header class="top-nav"><div class="breadcrumb"><span>首页</span><span class="sep">/</span><span class="current">商家入驻</span></div><div class="user">🔔　超级管理员 ▾</div></header>
  <main class="main">
    <h1 class="page-title">商家入驻</h1>
    <section class="step-page active" id="page-1"><div class="card"><div class="grid">
      <div class="form-item full"><label class="required">店铺名称</label><input class="field" id="storeName" placeholder="请输入店铺名称"></div>
      <div class="form-item"><label class="required">店铺所在地</label><input class="field" id="storeAddress" placeholder="请选择店铺所在地"></div>
      <div class="form-item"><label>店铺坐标</label><input class="field" id="storeCoordinate" placeholder="根据店铺所在地获取坐标"></div>
      <div class="form-item"><label class="required">店铺分类</label><select class="field" id="storeType"><option value="">请选择店铺分类</option><option>农产品供应店</option><option>农资经营店</option></select></div>
      <div class="form-item"><label class="required">主营类目</label><div class="category-box"><span class="tag">蔬菜</span><span class="tag">调味品</span><span class="preview" onclick="alert('演示：从平台维护的商品类目中选择')">+ 选择类目</span></div></div>
    </div></div><div class="footer"><button class="btn primary" onclick="submitStore()">提交审核</button></div></section>

    <section class="step-page" id="page-result"><div class="card result"><div class="result-icon">◷</div><h2>开店申请已提交</h2><p>平台将审核您的店铺资料，审核结果将通过消息中心通知您。</p><div class="result-info">店铺名称：待填写店铺名称<br>认证主体：海赋（山东）数字产业发展有限公司<br>当前状态：待审核</div></div></section>
  </main>
</div>
<script>
if(new URLSearchParams(location.search).get('mode')==='edit'){var note=document.createElement('div');note.className='hint';note.textContent='开店申请已被驳回：店铺分类与主营类目不符，请修改后重新提交。';document.querySelector('#page-1 .card').insertBefore(note,document.querySelector('#page-1 .card').firstChild);document.getElementById('storeName').value='海赋农产品供应店';document.getElementById('storeAddress').value='山东省菏泽市牡丹区';document.getElementById('storeCoordinate').value='34.817211,115.549187';document.getElementById('storeType').value='农产品供应店'}
function submitStore(){document.querySelectorAll('.step-page').forEach(function(p){p.classList.remove('active')});document.getElementById('page-result').classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
</script>
</body>
</html>
