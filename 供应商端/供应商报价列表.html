<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商报价 - 商家管理平台</title>
  <style>
    * { box-sizing: border-box; }
    :root { --blue:#1890ff; --blue-dark:#096dd9; --ink:#1f2937; --muted:#8c98a8; --line:#edf0f4; --surface:#fff; --page:#f4f6f9; }
    body { margin:0; min-width:1180px; background:var(--page); color:var(--ink); font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .main-area { margin-left:200px; min-height:100vh; }
    .top-nav { height:64px; display:flex; align-items:center; padding:0 32px; background:#fff; border-bottom:1px solid var(--line); }
    .breadcrumb { display:flex; align-items:center; gap:9px; color:#9aa5b1; font-size:13px; }.breadcrumb a{color:#667382;text-decoration:none}.breadcrumb .current{color:#253142;font-weight:600}.sep{color:#cfd6de}
    .top-actions{display:flex;align-items:center;gap:22px;margin-left:auto;color:#778393}.notice{position:relative;font-size:18px;cursor:pointer}.badge{position:absolute;top:-7px;right:-8px;display:grid;min-width:16px;height:16px;place-items:center;padding:0 4px;border:2px solid #fff;border-radius:9px;background:#ff4d4f;color:#fff;font-size:10px}.user{display:flex;align-items:center;gap:9px;color:#475467}.avatar{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;background:#e6f4ff;color:var(--blue);font-weight:600}
    .main{max-width:1600px;padding:26px 32px 40px}.page-intro{display:flex;align-items:flex-end;margin-bottom:20px}.eyebrow{margin-bottom:8px;color:var(--blue);font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}.page-title{margin:0;color:#182230;font-size:25px;font-weight:650}.page-desc{margin:7px 0 0;color:var(--muted);font-size:13px}.summary{display:flex;gap:10px;margin-left:auto}.summary-card{min-width:112px;padding:13px 18px;border:1px solid var(--line);border-radius:8px;background:#fff}.summary-card .label{margin-bottom:4px;color:#8b96a3;font-size:12px}.summary-card strong{color:#253142;font-size:20px}.summary-card.accent{border-color:#b7dcff;background:#f5fbff}.summary-card.accent strong{color:var(--blue)}
    .card{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 4px 16px rgba(29,45,61,.03)}.filter-card{padding:18px 20px;margin-bottom:16px}.filter-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.filter-item{display:flex;align-items:center;gap:8px}.filter-label{color:#667382;font-size:12px}.filter-input,.filter-select{height:34px;min-width:180px;padding:0 10px;border:1px solid #d8dee6;border-radius:4px;outline:0;background:#fff;color:#344054;font:13px inherit}.filter-input:focus,.filter-select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,144,255,.12)}.filter-actions{display:flex;gap:8px;margin-left:auto}.btn{height:34px;padding:0 17px;border:1px solid #d8dee6;border-radius:4px;background:#fff;color:#52606f;cursor:pointer;font:13px inherit}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{border-color:var(--blue-dark);background:var(--blue-dark)}
    .table-head{display:flex;align-items:center;height:58px;padding:0 20px;border-bottom:1px solid var(--line)}.table-title{color:#253142;font-size:15px;font-weight:600}.table-title span{margin-left:6px;color:#98a2b3;font-size:12px;font-weight:400}.table-tools{display:flex;gap:8px;margin-left:auto}.tool-btn{height:30px;padding:0 12px;border:1px solid #d8dee6;border-radius:4px;background:#fff;color:#667382;cursor:pointer;font-size:12px}.table-wrap{overflow-x:auto;padding-left:20px}.data-table{width:100%;min-width:1120px;border-collapse:collapse;font-size:13px}.data-table th{height:44px;padding:0 14px;border-bottom:1px solid var(--line);background:#fafbfd;color:#667382;text-align:left;font-weight:600;white-space:nowrap}.data-table td{height:66px;padding:0 14px;border-bottom:1px solid #f2f4f7;color:#344054;white-space:nowrap}.data-table tbody tr:hover{background:#fbfdff}.quote-no{color:var(--blue);font-weight:600;cursor:pointer}.quote-no:hover{text-decoration:underline}.status{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:4px;font-size:12px}.status:before{width:5px;height:5px;border-radius:50%;background:currentColor;content:""}.pending{background:#eaf4ff;color:#1677d2}.submitted{background:#f1fae9;color:#389e0d}.expired{background:#f4f5f7;color:#667382}.action-link{margin-right:14px;color:var(--blue);cursor:pointer}.action-link:hover{text-decoration:underline}.pagination{display:flex;align-items:center;justify-content:flex-end;height:64px;gap:6px;padding:0 20px;color:#98a2b3;font-size:12px}.page-btn{width:28px;height:28px;border:1px solid #d8dee6;border-radius:4px;background:#fff;color:#667382}.page-btn.active{border-color:var(--blue);background:var(--blue);color:#fff}
    @media(max-width:1000px){.main-area{margin-left:180px}.main,.top-nav{padding-left:20px;padding-right:20px}.page-intro{align-items:flex-start;flex-direction:column;gap:18px}.summary{margin-left:0}.filter-actions{margin-left:0}}
  </style>
</head>
<body>
  <script src="sidebar.js"></script>
  <div class="main-area">
    <header class="top-nav"><div class="breadcrumb"><a href="#">首页</a><span class="sep">/</span><span class="current">供应商报价</span></div><div class="top-actions"><span class="notice" title="点击查看最新报价邀请" onclick="goDetail('XJ2026080062','待填报')">♧<span class="badge">2</span></span><div class="user"><span class="avatar">管</span><span>超级管理员</span><span style="font-size:11px">⌄</span></div></div></header>
    <main class="main">
      <section class="page-intro"><div><div class="eyebrow">Supplier workspace / Quotation</div><h1 class="page-title">供应商报价</h1><p class="page-desc">查看平台询价邀请，填写含税报价、货期和价格有效期；提交后报价不可修改。</p></div><div class="summary"><div class="summary-card accent"><div class="label">待填报</div><strong>2</strong></div><div class="summary-card"><div class="label">已提交</div><strong>1</strong></div><div class="summary-card"><div class="label">即将截止</div><strong>1</strong></div></div></section>
      <section class="card filter-card"><div class="filter-row"><label class="filter-item"><span class="filter-label">询价单号</span><input class="filter-input" id="keyword" placeholder="请输入询价单号或询价名称"></label><label class="filter-item"><span class="filter-label">报价状态</span><select class="filter-select" id="statusFilter"><option value="">全部状态</option><option value="待填报">待填报</option><option value="已提交">已提交</option><option value="已过期">已过期</option></select></label><div class="filter-actions"><button class="btn primary" onclick="render()">查询</button><button class="btn" onclick="resetFilter()">重置</button></div></div></section>
      <section class="card"><div class="table-head"><div class="table-title">报价邀请列表 <span id="total">共 4 条</span></div><div class="table-tools"><button class="tool-btn" onclick="goDetail('XJ2026080062','待填报')">查看最新提醒</button></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>询价单号</th><th>询价名称</th><th>邀请产品</th><th>产品数量</th><th>报价截止日期</th><th>客户联系人</th><th>报价状态</th><th>操作</th></tr></thead><tbody id="quoteBody"></tbody></table></div><div class="pagination"><span id="pageTotal">共 4 条</span><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div></section>
    </main>
  </div>
  <script>
    const QUOTES = [
      { no:'XJ2026080062', name:'2026年8月农产品采购询价', products:'大蒜、洋葱', count:2, deadline:'2026-08-27 16:00', contact:'侯振鲁', status:'待填报' },
      { no:'XJ2026080067', name:'山东区域蔬菜采购询价', products:'土豆', count:1, deadline:'2026-08-28 10:00', contact:'李敏', status:'待填报' },
      { no:'XJ2026080058', name:'冷链农产品补货询价', products:'大蒜、洋葱', count:2, deadline:'2026-08-24 18:00', contact:'张晓', status:'已提交' },
      { no:'XJ2026080049', name:'农产品月度采购询价', products:'生姜', count:1, deadline:'2026-08-20 12:00', contact:'王磊', status:'已过期' }
    ];
    const cls = { '待填报':'pending', '已提交':'submitted', '已过期':'expired' };
    function goDetail(no, status) { location.href = '供应商报价详情.html?no=' + encodeURIComponent(no) + '&status=' + encodeURIComponent(status); }
    function render() {
      const keyword = document.getElementById('keyword').value.trim();
      const status = document.getElementById('statusFilter').value;
      const list = QUOTES.filter(function(q) { return (!keyword || (q.no + q.name).includes(keyword)) && (!status || q.status === status); });
      document.getElementById('quoteBody').innerHTML = list.length ? list.map(function(q) { const operation = q.status === '待填报' ? '去报价' : '查看'; return '<tr><td><span class="quote-no" onclick="goDetail(\'' + q.no + '\',\'' + q.status + '\')">' + q.no + '</span></td><td>' + q.name + '</td><td>' + q.products + '</td><td>' + q.count + '</td><td>' + q.deadline + '</td><td>' + q.contact + '</td><td><span class="status ' + cls[q.status] + '">' + q.status + '</span></td><td><span class="action-link" onclick="goDetail(\'' + q.no + '\',\'' + q.status + '\')">' + operation + '</span></td></tr>'; }).join('') : '<tr><td colspan="8" style="height:120px;text-align:center;color:#98a2b3">未查询到匹配的报价邀请</td></tr>';
      document.getElementById('total').textContent = '共 ' + list.length + ' 条';
      document.getElementById('pageTotal').textContent = '共 ' + list.length + ' 条';
    }
    function resetFilter() { document.getElementById('keyword').value = ''; document.getElementById('statusFilter').value = ''; render(); }
    render();
  </script>
</body>
</html>
