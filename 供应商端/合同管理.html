<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>合同管理 - 供应商端</title><link rel="stylesheet" href="../合同管理基础.css"><style>:root{--supplier-primary:#1890ff}body{min-width:1180px;background:#f4f6f9}.top{height:64px;padding:0 32px;background:#fff;border-bottom:1px solid #edf0f4;color:#1f2937}.brand{font-size:16px;font-weight:600;color:#253142}.top:after{margin-left:auto;content:'🔔　超级管理员　⌄';color:#778393;font-size:13px}.main{max-width:1600px;padding:26px 32px 40px}.breadcrumb{color:#9aa5b1}.breadcrumb a,.actions a,.template-actions a{color:var(--supplier-primary)}.card{border-color:#edf0f4;border-radius:8px;box-shadow:0 4px 16px rgba(29,45,61,.03)}.btn-primary{background:var(--supplier-primary);border-color:var(--supplier-primary)}.tab.active{color:var(--supplier-primary);border-color:var(--supplier-primary)}.tag-uploaded{background:#eaf4ff;color:#1677d2}.template{border-radius:8px}.selection-note{background:#f5fbff;color:#1677d2}.form-grid input:focus,.form-grid select:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--supplier-primary);box-shadow:0 0 0 2px rgba(24,144,255,.12)}</style></head><body>
<style>.layout{display:block}.top{margin-left:200px}.main{max-width:none;margin-left:200px}@media(max-width:1000px){.top,.main{margin-left:180px}}</style><div class="top"><div class="brand">供应商管理平台</div></div><div class="layout"><div id="sidebar-container"></div><main class="main">
<div class="breadcrumb">合同管理</div><section class="card titlebar"><div class="title">合同管理</div><div class="title-actions"><button class="btn" onclick="ContractBasic.switchTab('templates',document.querySelector('[data-tab=templates]'))">合同模板</button><button class="btn btn-primary" onclick="ContractBasic.openCreate()">新建合同</button></div></section>
<section class="card"><div class="tabs"><div class="tab active" data-tab="contracts" onclick="ContractBasic.switchTab('contracts',this)">我的合同</div><div class="tab" data-tab="templates" onclick="ContractBasic.switchTab('templates',this)">合同模板</div></div><div id="contractsPanel" class="panel"><div class="toolbar"><input id="contractSearch" placeholder="搜索合同编号、名称、签约方"><select id="contractStatus"><option value="">全部状态</option><option value="draft">草稿</option><option value="uploaded">已上传</option><option value="signing">待我签署</option><option value="signed">已签署</option></select><button class="btn" onclick="ContractBasic.renderContracts()">查询</button></div><div style="height:14px"></div><div class="table-wrap"><table class="table"><thead><tr><th>合同编号</th><th>合同名称</th><th>合同类型</th><th>甲方 / 乙方</th><th>关联订单</th><th>合同文件</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="contractBody"></tbody></table></div></div><div id="templatesPanel" class="panel" style="display:none"><div class="toolbar" style="margin-bottom:14px"><span class="muted">可查看平台模板与我上传的模板；合同文件请在线下填写完整后上传。</span><button class="btn btn-primary" style="margin-left:auto" onclick="ContractBasic.openTemplate()">上传我的模板</button></div><div class="template-grid" id="templateGrid"></div></div></section>
</main></div>
<div class="modal-mask" id="createModal"><div class="modal"><div class="modal-head"><span>新建合同</span><button class="close" onclick="ContractBasic.close('createModal')">×</button></div><div class="modal-body"><div class="selection-note">框架合同可不关联订单；采购合同需关联已确定的平台采购订单。系统仅保存订单关联，不自动填写合同正文。</div><div class="form-grid"><div><label>合同名称</label><input id="contractName" placeholder="请输入合同名称"></div><div><label>合同类型</label><select id="contractType" onchange="ContractBasic.syncOrderArea()"><option value="purchase">采购合同</option><option value="framework">框架合同</option></select></div><div><label>签约关系</label><select id="contractRelation" onchange="ContractBasic.refreshPartyHint()"><option value="platform-supplier">平台—供应商</option></select></div><div><label>甲方</label><input id="partyA"></div><div><label>乙方</label><input id="partyB"></div></div><div id="orderSelector" style="margin-top:20px"><div class="toolbar"><strong>关联订单</strong><input id="orderSearch" placeholder="搜索供应商销售订单" oninput="ContractBasic.renderOrderChoices()"></div><div style="height:10px"></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>销售单编号</th><th>销售单名称</th><th>状态</th><th>金额</th></tr></thead><tbody id="orderChoices"></tbody></table></div></div><div class="file-line"><strong>合同文件</strong><input id="contractFile" type="file" accept=".doc,.docx,.pdf,.jpg,.jpeg,.png" onchange="ContractBasic.fileSelected(this,'contractFileName')"><span id="contractFileName">尚未选择文件</span></div></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('createModal')">取消</button><button class="btn btn-primary" onclick="ContractBasic.createContract()">保存合同</button></div></div></div>
<div class="modal-mask" id="templateModal"><div class="modal"><div class="modal-head"><span>上传我的合同模板</span><button class="close" onclick="ContractBasic.close('templateModal')">×</button></div><div class="modal-body"><div class="selection-note">模板仅用于下载参考；不自动填充甲乙方、订单或金额。</div><div class="form-grid"><div><label>模板名称</label><input id="templateName" placeholder="例如：供应商采购合同模板"></div><div><label>合同类型</label><select id="templateType"><option value="purchase">采购合同</option><option value="framework">框架合同</option></select></div></div><div class="file-line"><strong>模板文件</strong><input id="templateFile" type="file" accept=".doc,.docx,.pdf,.jpg,.jpeg,.png" onchange="ContractBasic.fileSelected(this,'templateFileName')"><span id="templateFileName">尚未选择文件</span></div></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('templateModal')">取消</button><button class="btn btn-primary" onclick="ContractBasic.saveTemplate()">保存模板</button></div></div></div>
<div class="modal-mask" id="detailModal"><div class="modal"><div class="modal-head"><span>合同详情</span><button class="close" onclick="ContractBasic.close('detailModal')">×</button></div><div class="modal-body" id="detailBody"></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('detailModal')">关闭</button></div></div></div>
<script src="sidebar.js"></script><script>window.ContractAppConfig={role:'supplier',orders:[{no:'SO20260803002',name:'叉车设备销售订单',status:'待发货',amount:'¥ 28,560.00'},{no:'SO20260803008',name:'洋葱供货销售订单',status:'待确认',amount:'¥ 12,380.50'}],demoContracts:[{id:'demo-supplier-1',no:'HT20260817003',name:'供应商供货采购合同',type:'purchase',partyA:'海赋（山东）数字产业发展有限公司',partyB:'当前供应商',orders:'SO20260803002',fileName:'供应商供货采购合同.docx',content:'合同文件（演示）',status:'uploaded',updated:'2026-08-17 11:10'},{id:'demo-supplier-2',no:'HT20260816004',name:'年度供货框架合同',type:'framework',partyA:'海赋（山东）数字产业发展有限公司',partyB:'当前供应商',orders:'',fileName:'年度供货框架合同.pdf',content:'合同文件（演示）',status:'signing',updated:'2026-08-16 14:20'}]};</script><script src="../合同管理基础.js"></script></body></html>
