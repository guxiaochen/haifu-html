  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f6f9;color:#253142;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.main-area{margin-left:200px;min-height:100vh}.top-nav{height:64px;display:flex;align-items:center;padding:0 32px;background:#fff;border-bottom:1px solid #edf0f4}.breadcrumb{display:flex;align-items:center;gap:9px;color:#9aa5b1;font-size:13px}.breadcrumb a,.order-link{color:#1890ff;text-decoration:none}.breadcrumb a:hover,.order-link:hover{text-decoration:underline}.breadcrumb .current{color:#253142;font-weight:600}.sep{color:#cfd6de}.top-actions{margin-left:auto;display:flex;align-items:center;gap:22px;color:#778393}.notice{font-size:18px;position:relative}.badge{position:absolute;top:-7px;right:-8px;display:grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border:2px solid #fff;border-radius:9px;background:#ff4d4f;color:#fff;font-size:10px}.user{display:flex;align-items:center;gap:9px;color:#475467}.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e6f4ff;color:#1890ff;font-weight:600}.main{max-width:1600px;padding:26px 32px 40px}.title-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}.title-row h1{margin:0;font-size:21px}.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:4px;background:#f1fae9;color:#389e0d;font-size:12px}.card{margin-bottom:16px;border:1px solid #edf0f4;border-radius:8px;background:#fff;box-shadow:0 4px 16px rgba(29,45,61,.03)}.actions{display:flex;align-items:center;min-height:66px;padding:0 20px;border-bottom:1px solid #edf0f4}.btn{height:34px;padding:0 16px;border:1px solid #d8dee6;border-radius:4px;background:#fff;color:#52606f;cursor:pointer;font:inherit;font-size:13px}.btn:hover{border-color:#1890ff;color:#1890ff}.locked{margin-left:12px;color:#8b96a3;font-size:12px}.steps{display:flex;margin-left:auto}.step{margin-right:-7px;padding:6px 18px;background:#f5f5f5;color:#667382;font-size:13px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}.step:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}.step:last-child{margin:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8px 50%)}.step.done{background:#e8e8e8;color:#999}.step.active{background:#1890ff;color:#fff}.content{padding:20px 22px 24px}.section-title{margin:0 0 16px;padding-left:9px;border-left:3px solid #1890ff;font-size:15px;font-weight:600}.info{display:grid;grid-template-columns:1fr 1fr;gap:0 54px;padding:0 10px 22px}.info .field{display:flex;min-width:0;padding:9px 0;border-bottom:1px solid #f2f4f7}.field label{flex:0 0 94px;color:#667382;font-size:13px}.field span{min-width:0;overflow-wrap:anywhere;color:#344054}.highlight{color:#1890ff!important;font-weight:600}.summary-strip{display:flex;align-items:center;gap:28px;margin-bottom:20px;padding:14px 16px;border:1px solid #d8ecff;border-radius:6px;background:#f7fbff}.metric span{display:block;color:#8b96a3;font-size:12px}.metric b{display:block;margin-top:4px;color:#1890ff;font-size:18px;font-variant-numeric:tabular-nums}.order-group{margin-bottom:16px;border:1px solid #e7edf3;border-radius:6px}.order-group:last-child{margin-bottom:0}.order-group-head{display:flex;align-items:center;min-height:48px;padding:0 16px;background:#fafcff;border-bottom:1px solid #edf0f4}.order-group-head span{margin-left:10px;color:#8b96a3;font-size:12px}.order-group-head b{margin-left:auto;color:#344054;font-size:13px}.table-wrap{overflow:auto}.data-table{width:100%;min-width:1520px;border-collapse:collapse}.data-table th{height:44px;padding:0 12px;background:#fff;border-bottom:1px solid #edf0f4;color:#667382;text-align:left;font-size:13px;font-weight:600;white-space:nowrap}.data-table td{height:62px;padding:0 12px;border-bottom:1px solid #f2f4f7;color:#344054;white-space:nowrap}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover td{background:#fbfdff}.qty-input{width:76px;height:30px;padding:0 8px;border:1px solid #d8dee6;border-radius:5px;color:#344054;font:inherit}.qty-input:focus{border-color:#1890ff;outline:none;box-shadow:0 0 0 2px rgba(24,144,255,.12)}.qty-input:disabled{background:#f5f6f7;color:#99a4a8}.link{color:#1890ff;text-decoration:none}.link:hover{text-decoration:underline}.product-name{font-weight:500;color:#344054}.product-img{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid #e5e7eb;border-radius:5px;background:#f5f7fa;font-size:22px}.tax{display:inline-block;padding:3px 8px;border:1px solid #d6e4ff;border-radius:9px;background:#f0f5ff;color:#1890ff;font-size:11px}.type{display:inline-flex;align-items:center;padding:4px 9px;border-radius:4px;font-size:12px}.type.normal{background:#eaf4ff;color:#1677d2}.type.owing{background:#fff7e6;color:#d46b08}.type.damage{background:#fff1f0;color:#cf1322}.muted{color:#8b96a3}.qty{font-weight:600;font-variant-numeric:tabular-nums}.total-row td{background:#fafcff;font-weight:600;border-top:1px solid #edf0f4}.tip{margin:14px 0 0;color:#8b96a3;font-size:12px}@media(max-width:1000px){.sidebar{width:180px}.main-area{margin-left:180px}.main,.top-nav{padding-left:20px;padding-right:20px}.info{grid-template-columns:1fr;gap:0}.steps{margin-top:12px;margin-left:0}.actions{align-items:flex-start;flex-direction:column;padding:14px 20px}.summary-strip{flex-wrap:wrap}}
  </style>
</head>
<body>
  <script src="sidebar.js"></script>
  <div class="main-area"><header class="top-nav"><div class="breadcrumb"><a href="送货单列表（全部）.html">送货单</a><span class="sep">/</span><span class="current" id="crumbNo">DH202609008</span></div><div class="top-actions"><span class="notice">♧<span class="badge">3</span></span><div class="user"><span class="avatar">管</span><span>超级管理员</span><span style="font-size:11px">⌄</span></div></div></header><main class="main"><div class="title-row"><h1>批量送货单 <span id="deliveryNo">DH202609008</span></h1><span class="tag">已发货</span></div><section class="card"><div class="actions"><button class="btn" onclick="backToDeliveryList()">返回送货单</button><div class="steps"><span class="step done">待发货</span><span class="step active">已发货</span></div></div><div class="content"><h2 class="section-title">送货信息</h2><div class="info"><div class="field"><label>客户</label><span id="customer">海赋农产品贸易有限公司</span></div><div class="field"><label>发货日期</label><span id="deliveryDate">2026-09-15 14:20</span></div><div class="field"><label>联系人</label><span>侯振鲁　17505308090</span></div><div class="field"><label>收货地址</label><span id="address">山东省菏泽市牡丹区黄河路88号</span></div><div class="field"><label>关联销售订单</label><span class="highlight" id="orderCount">2 笔</span></div><div class="field"><label>送货明细</label><span class="highlight" id="lineCount">2 条</span></div></div><h2 class="section-title">送货分摊明细</h2><div class="table-wrap" id="allocationWrap"></div></div></section></main></div>
  <script>
    var fallbackItems=[{id:'s1',order:'SO202608901',name:'大蒜',code:'AG-001',brand:'金乡',spec:'4.0',color:'白色',category:'农产品',unit:'吨',orderQty:8,shipped:8,type:'normal',typeName:'正常发货',reason:'—',qty:5,received:5,address:'山东省菏泽市牡丹区黄河路88号'},{id:'s2',order:'SO202608902',name:'洋葱',code:'ON-002',brand:'金乡',spec:'3.2',color:'紫色',category:'农产品',unit:'吨',orderQty:6,shipped:6,type:'normal',typeName:'正常发货',reason:'—',qty:4,received:4,address:'山东省菏泽市牡丹区黄河路88号'}];var demo=[{no:'DH202609008',date:'2026-09-15 14:20',customer:'海赋农产品贸易有限公司',address:'山东省菏泽市牡丹区黄河路88号',items:fallbackItems},{no:'DH202609007',date:'2026-09-14 09:35',customer:'海赋农产品贸易有限公司',address:'山东省菏泽市牡丹区黄河路88号',items:[{id:'s3',order:'SO202608880',name:'生姜',code:'GI-003',brand:'昌邑',spec:'一级',color:'黄色',category:'农产品',unit:'吨',orderQty:9,shipped:9,type:'owing',typeName:'欠单补发',reason:'关联欠单 QD202608019',qty:3,received:3,address:'山东省菏泽市牡丹区黄河路88号'}]}];function readHistory(){try{var data=JSON.parse(sessionStorage.getItem('supplierBatchDeliveryHistory'));return Array.isArray(data)&&data.length?data:demo}catch(e){return demo}}var batch=new URLSearchParams(location.search).get('batch')||'DH202609008',delivery=readHistory().filter(function(item){return item.no===batch})[0]||demo[0],items=delivery.items.filter(function(row){return row&&row.id});
    // 列表页写入的历史数据不含已接收字段，按“已发货即已接收”补齐，保证与演示数据口径一致
    items.forEach(function(row){if(row.received==null)row.received=Number(row.qty||0)});function total(rows){return rows.reduce(function(sum,row){return sum+Number(row.qty||0)},0)}function tag(row){return '<span class="type '+row.type+'">'+row.typeName+'</span>'}
    var PRICE_DB={'AG-001':1200,'ON-002':980,'GI-003':1600,'TM-004':860};
    function priceOf(row){var fixed=PRICE_DB[row.code];return Number(fixed!=null?fixed:row.price||0)}
    function amountOf(row){return priceOf(row)*Number(row.qty||0)}
    function sumAmount(rows){return rows.reduce(function(sum,row){return sum+amountOf(row)},0)}
    function money(value){return '¥ '+value.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
    // 返回送货单列表页
    function backToDeliveryList(){location.href='送货单列表（全部）.html'}
    function render(){var orders={};items.forEach(function(row){orders[row.order]=1});
      document.getElementById('deliveryNo').textContent=delivery.no;document.getElementById('crumbNo').textContent=delivery.no;document.getElementById('customer').textContent=delivery.customer;document.getElementById('deliveryDate').textContent=delivery.date;document.getElementById('address').textContent=delivery.address;document.getElementById('orderCount').textContent=Object.keys(orders).length+' 笔';document.getElementById('lineCount').textContent=items.length+' 条';
      var head='<table class="data-table"><thead><tr><th>序号</th><th>商品图片</th><th>物料编码</th><th>产品名称</th><th>规格</th><th>品牌</th><th>订单数量</th><th>发货数量</th><th>单位</th><th>单价</th><th>税项</th><th>不含税金额</th><th>履约类型</th></tr></thead><tbody>';
      var body=items.map(function(row,index){return '<tr><td class="muted">'+(index+1)+'</td><td><span class="product-img" aria-label="商品图片">📦</span></td><td>'+row.code+'</td><td><span class="product-name">'+row.name+'</span></td><td>'+row.spec+'</td><td>'+row.brand+'</td><td class="muted">'+row.orderQty+'</td><td class="qty">'+row.qty+'</td><td>'+row.unit+'</td><td>'+priceOf(row).toFixed(2)+'</td><td><span class="tax">13% 进项税</span></td><td>'+money(amountOf(row))+'</td><td>'+tag(row)+'</td></tr>'}).join('');
      var foot='<tr class="total-row"><td colspan="6">合计</td><td class="qty" data-cell="orderQty">'+total(items)+'</td><td class="qty" data-cell="qty">'+total(items)+'</td><td data-cell="unit">'+((items[0]&&items[0].unit)||'')+'</td><td>—</td><td>—</td><td data-cell="amount">'+money(sumAmount(items))+'</td><td>—</td></tr>';
      document.getElementById('allocationWrap').innerHTML=head+body+foot+'</tbody></table>';}
    render();
  </script>
</body>
</html>
