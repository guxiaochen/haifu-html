<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>合同管理 - 客户端</title><link rel="stylesheet" href="询价样式.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#243044;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.top{height:56px;background:#2BA471;color:#fff;display:flex;align-items:center;padding:0 24px}.brand{font-size:16px;font-weight:600}.layout{display:flex;min-height:calc(100vh - 56px)}.main{flex:1;min-width:0;padding:18px}.breadcrumb{color:#98a2b3;font-size:13px;margin-bottom:14px}.breadcrumb a,.actions a,.template-actions a{color:#2BA471;cursor:pointer;text-decoration:none}.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px #172b4d0a;margin-bottom:14px}.titlebar{padding:16px 20px;display:flex;align-items:center}.title{font-size:18px;font-weight:600}.title-actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #d9e0e7;background:#fff;color:#344054;border-radius:4px;padding:7px 15px;cursor:pointer;font:inherit}.btn-primary{background:#2BA471;color:#fff;border-color:#2BA471}.tabs{display:flex;padding:0 20px;border-bottom:1px solid #edf0f2}.tab{padding:13px 6px;margin-right:28px;color:#667085;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#2BA471;border-color:#2BA471;font-weight:600}.panel{padding:16px 20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select,.form-grid input,.form-grid select{padding:7px 10px;border:1px solid #d9e0e7;border-radius:4px;font:inherit}.toolbar input{width:230px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #edf0f2;text-align:left;white-space:nowrap}.table th{background:#fafbfc;color:#667085;font-weight:500}.tag{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px}.tag-draft{background:#f2f4f7;color:#667085}.tag-uploaded{background:#e8f7ef;color:#237b58}.tag-signing{background:#fff7e6;color:#b76a00}.tag-signed{background:#ecfdf3;color:#168458}.actions a{margin-right:12px}.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.template{border:1px solid #e5eaf0;border-radius:8px;padding:16px}.template h3{margin:0 0 8px;font-size:15px}.template p{margin:3px 0;color:#667085;font-size:12px}.template .file{color:#98a2b3}.template-foot{margin-top:14px;display:flex;justify-content:space-between;color:#98a2b3;font-size:12px}.template-actions{display:flex;gap:10px}.muted{color:#98a2b3}.modal-mask{display:none;position:fixed;inset:0;background:#0b1f3380;align-items:center;justify-content:center;z-index:20}.modal-mask.show{display:flex}.modal{width:min(860px,calc(100% - 28px));max-height:88vh;overflow:hidden;background:#fff;border-radius:8px;box-shadow:0 18px 60px #172b4d35}.modal-head{padding:16px 20px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;align-items:center;font-weight:600}.close{border:0;background:none;color:#98a2b3;font-size:20px;cursor:pointer}.modal-body{padding:18px 20px;overflow:auto;max-height:66vh}.modal-foot{padding:12px 20px;border-top:1px solid #edf0f2;display:flex;justify-content:flex-end;gap:8px}.selection-note{padding:10px 12px;background:#f0faf5;color:#237b58;border-radius:4px;margin-bottom:16px;line-height:1.7}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.form-grid label,.replace-file label{display:block;color:#667085;margin-bottom:6px}.form-grid input,.form-grid select{width:100%}.file-line{display:flex;align-items:center;gap:12px;color:#667085;margin-top:14px}.file-line input{max-width:360px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail-grid label{display:block;color:#98a2b3;font-size:12px;margin-bottom:6px}.detail-grid b{font-weight:500}.file-panel{margin-top:22px;padding:14px;background:#f8fafc;border-radius:6px;display:flex;justify-content:space-between;align-items:center}.file-panel p{margin:5px 0 0;color:#667085}.replace-file{margin-top:18px;padding-top:16px;border-top:1px solid #edf0f2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.empty{text-align:center;color:#98a2b3;padding:40px}@media(max-width:800px){.template-grid,.form-grid,.detail-grid{grid-template-columns:1fr}.main{padding:12px}.top{padding:0 14px}}
</style></head><body>
<header class="top-nav"><div class="brand-logo">元</div><div class="brand-name">元象农产品</div><div class="brand-sub">买家工作台</div><div class="top-right">🔔　超级管理员　▾</div></header><div class="layout"><div id="sidebar-container"></div><main class="main">
<div class="breadcrumb"><a onclick="location.href='采购订单列表.html'">采购订单</a>　/　合同管理</div><section class="card titlebar"><div class="title">合同管理</div><div class="title-actions"><button class="btn" onclick="ContractBasic.switchTab('templates',document.querySelector('[data-tab=templates]'))">合同模板</button><button class="btn btn-primary" onclick="ContractBasic.openCreate()">新建合同</button></div></section>
<section class="card"><div class="tabs"><div class="tab active" data-tab="contracts" onclick="ContractBasic.switchTab('contracts',this)">我的合同</div><div class="tab" data-tab="templates" onclick="ContractBasic.switchTab('templates',this)">合同模板</div></div><div id="contractsPanel" class="panel"><div class="toolbar"><input id="contractSearch" placeholder="搜索合同编号、名称、签约方"><select id="contractStatus"><option value="">全部状态</option><option value="draft">草稿</option><option value="uploaded">已上传</option><option value="signing">待我签署</option><option value="signed">已签署</option></select><button class="btn" onclick="ContractBasic.renderContracts()">查询</button></div><div style="height:14px"></div><div class="table-wrap"><table class="table"><thead><tr><th>合同编号</th><th>合同名称</th><th>合同类型</th><th>甲方 / 乙方</th><th>关联订单</th><th>合同文件</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="contractBody"></tbody></table></div></div><div id="templatesPanel" class="panel" style="display:none"><div class="toolbar" style="margin-bottom:14px"><span class="muted">可查看平台模板与我上传的模板；合同文件请在线下填写完整后上传。</span><button class="btn btn-primary" style="margin-left:auto" onclick="ContractBasic.openTemplate()">上传我的模板</button></div><div class="template-grid" id="templateGrid"></div></div></section>
</main></div>
<div class="modal-mask" id="createModal"><div class="modal"><div class="modal-head"><span>新建合同</span><button class="close" onclick="ContractBasic.close('createModal')">×</button></div><div class="modal-body"><div class="selection-note">框架合同可不关联订单；采购合同需关联已确定的采购订单。系统仅保存关联关系，不自动填写合同正文。</div><div class="form-grid"><div><label>合同名称</label><input id="contractName" placeholder="请输入合同名称"></div><div><label>合同类型</label><select id="contractType" onchange="ContractBasic.syncOrderArea()"><option value="purchase">采购合同</option><option value="framework">框架合同</option></select></div><div><label>签约关系</label><select id="contractRelation" onchange="ContractBasic.refreshPartyHint()"><option value="customer-platform">客户—平台</option></select></div><div><label>甲方</label><input id="partyA"></div><div><label>乙方</label><input id="partyB"></div></div><div id="orderSelector" style="margin-top:20px"><div class="toolbar"><strong>关联采购订单</strong><input id="orderSearch" placeholder="搜索采购订单" oninput="ContractBasic.renderOrderChoices()"></div><div style="height:10px"></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>采购单编号</th><th>采购单名称</th><th>状态</th><th>金额</th></tr></thead><tbody id="orderChoices"></tbody></table></div></div><div class="file-line"><strong>合同文件</strong><input id="contractFile" type="file" accept=".doc,.docx,.pdf,.jpg,.jpeg,.png" onchange="ContractBasic.fileSelected(this,'contractFileName')"><span id="contractFileName">尚未选择文件</span></div></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('createModal')">取消</button><button class="btn btn-primary" onclick="ContractBasic.createContract()">保存合同</button></div></div></div>
<div class="modal-mask" id="templateModal"><div class="modal"><div class="modal-head"><span>上传我的合同模板</span><button class="close" onclick="ContractBasic.close('templateModal')">×</button></div><div class="modal-body"><div class="selection-note">模板仅用于下载参考；不自动填充甲乙方、订单或金额。</div><div class="form-grid"><div><label>模板名称</label><input id="templateName" placeholder="例如：客户采购合同模板"></div><div><label>合同类型</label><select id="templateType"><option value="purchase">采购合同</option><option value="framework">框架合同</option></select></div></div><div class="file-line"><strong>模板文件</strong><input id="templateFile" type="file" accept=".doc,.docx,.pdf,.jpg,.jpeg,.png" onchange="ContractBasic.fileSelected(this,'templateFileName')"><span id="templateFileName">尚未选择文件</span></div></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('templateModal')">取消</button><button class="btn btn-primary" onclick="ContractBasic.saveTemplate()">保存模板</button></div></div></div>
<div class="modal-mask" id="detailModal"><div class="modal"><div class="modal-head"><span>合同详情</span><button class="close" onclick="ContractBasic.close('detailModal')">×</button></div><div class="modal-body" id="detailBody"></div><div class="modal-foot"><button class="btn" onclick="ContractBasic.close('detailModal')">关闭</button></div></div></div>
