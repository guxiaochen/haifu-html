<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>平台报价单 - 元象农产品买家工作台</title>
  <link rel="stylesheet" href="询价样式.css">
  <link rel="stylesheet" href="客户端详情公共样式.css">
  <style>
    .main{min-width:0}.page-head{gap:12px}.page-head .title-actions{margin-left:auto;display:flex;gap:8px}.filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filter label{color:#666;font-size:13px}.filter input,.filter select{margin:0;min-width:154px}.table-wrap{overflow-x:auto}.table{min-width:960px}.table th,.table td{white-space:nowrap}.status-confirm{background:#fff7e6;color:#d46b08}.status-done{background:#f0faf5;color:#2BA471}.action-link{color:#2BA471;cursor:pointer;text-decoration:none}.action-link:hover{text-decoration:underline}.muted{color:#999}.empty{padding:44px!important;text-align:center!important;color:#999}
  </style>
</head>
<body>
  <header class="top-nav"><div class="brand-logo">元</div><div class="brand-name">元象农产品</div><div class="brand-sub">买家工作台</div><div class="top-right">🔔　超级管理员　▾</div></header>
  <div class="layout"><div id="sidebar-container"></div><main class="main">
    <div class="bread"><a href="询价单列表.html">询价单</a> / 平台报价单</div>
    <div class="page-head"><span class="title">平台报价单</span><div class="title-actions"><button class="btn default" type="button" onclick="location.href='询价单列表.html'">返回询价单</button></div></div>
    <section class="card filter">
      <label for="quoteNo">报价单号</label><input id="quoteNo" placeholder="请输入报价单号">
      <label for="inquiryNo">关联询价单号</label><input id="inquiryNo" placeholder="请输入关联询价单号">
      <label for="quoteStatus">报价状态</label><select id="quoteStatus"><option value="">全部状态</option><option value="confirm">待确认</option><option value="done">已完成</option></select>
      <label for="effectiveDate">价格有效期</label><input id="effectiveDate" type="date">
      <button class="btn primary" id="searchBtn" type="button">查询</button><button class="btn default" id="resetBtn" type="button">重置</button>
    </section>
    <section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>报价单号</th><th>关联询价单号</th><th>价格有效期</th><th>创建日期</th><th>报价状态</th><th>操作</th></tr></thead><tbody id="quoteBody"></tbody></table></div><div class="pagination"><span id="total">共 0 条</span><button class="page-btn" type="button">‹</button><button class="page-btn active" type="button">1</button><button class="page-btn" type="button">›</button></div></section>
  </main></div>
  <script src="sidebar.js"></script>
  <script>
    (function(){
      var query=new URLSearchParams(location.search);
      var data=[
        {no:'BJ20260903001',inquiry:'XJ20260903001',effective:'2026-09-08',date:'2026-09-03',status:'confirm',requoteOf:'BJ20260821018',requoteLines:'1'},
        {no:'BJ20260825062',inquiry:'XJ2026080062',effective:'2026-08-27',date:'2026-08-25',status:'confirm'},
        {no:'BJ20260818038',inquiry:'XJ2025080021',effective:'2026-08-25',date:'2026-08-18',status:'done'}
      ];
      try { var requoteQuote=JSON.parse(sessionStorage.getItem('clientRequoteQuote')||'null'); if(requoteQuote&&requoteQuote.no){data.unshift({no:requoteQuote.no,inquiry:requoteQuote.inquiry,effective:requoteQuote.effective,date:requoteQuote.date,status:'confirm',requoteOf:requoteQuote.sourceQuote,requoteLines:requoteQuote.rejectedLines})} } catch(error) {}
      var labels={confirm:['status-confirm','待确认'],done:['status-done','已完成']};
      var $=function(id){return document.getElementById(id)};
      $('inquiryNo').value='';
      function render(){var no=$('quoteNo').value.trim().toLowerCase(),inquiry=$('inquiryNo').value.trim().toLowerCase(),status=$('quoteStatus').value,date=$('effectiveDate').value;var list=data.filter(function(item){return(!no||item.no.toLowerCase().indexOf(no)>=0)&&(!inquiry||item.inquiry.toLowerCase().indexOf(inquiry)>=0)&&(!status||item.status===status)&&(!date||item.effective===date)});$('total').textContent='共 '+list.length+' 条';$('quoteBody').innerHTML=list.length?list.map(function(item){var label=labels[item.status];var inquiryStatus=item.status==='done'?'completed':'submitted';var url='平台报价单详情.html?quote='+encodeURIComponent(item.no)+'&status='+encodeURIComponent(item.status)+'&inquiry='+encodeURIComponent(item.inquiry)+(item.requoteOf?'&requoteOf='+encodeURIComponent(item.requoteOf)+'&requoteLines='+encodeURIComponent(item.requoteLines||''):'');return '<tr><td><a class="action-link" href="'+url+'">'+item.no+(item.requoteOf?' <span class="muted">（重新报价）</span>':'')+'</a></td><td><a class="action-link" href="询价单详情.html?no='+encodeURIComponent(item.inquiry)+'&status='+inquiryStatus+'">'+item.inquiry+'</a></td><td>'+item.effective+'</td><td>'+item.date+'</td><td><span class="tag '+label[0]+'">'+label[1]+'</span></td><td><a class="action-link" href="'+url+'">查看</a></td></tr>'}).join(''):'<tr><td class="empty" colspan="6">暂无平台报价单</td></tr>'}
      function reset(){$('quoteNo').value='';$('inquiryNo').value='';$('quoteStatus').value='';$('effectiveDate').value='';render()}
      $('searchBtn').addEventListener('click',render);$('resetBtn').addEventListener('click',reset);render();
    })();
  </script>
</body>
</html>
