<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平台报价单详情 - 元象农产品买家工作台</title>
  <link rel="stylesheet" href="询价样式.css">
  <link rel="stylesheet" href="客户端详情公共样式.css">
  <style>
    .main{min-width:0}.quote-title{display:flex;flex-direction:column;gap:4px}.quote-title span{color:#2BA471;font-weight:600}.quote-title strong{font-size:18px}.quote-title small{color:#999}.link{color:#2BA471;text-decoration:none;cursor:pointer}.card{padding:20px 24px}.topbar{display:flex;align-items:center;gap:8px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #f0f0f0}.steps{display:flex;margin-left:auto;font-size:13px}.steps span{position:relative;margin-right:-8px;padding:6px 18px;background:#f5f5f5;color:#666;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}.steps span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}.steps span:last-child{margin:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8px 50%)}.steps .done{background:#e8e8e8;color:#999}.steps .active{background:#2BA471;color:#fff}.notice{margin-bottom:16px;padding:10px 13px;border-radius:4px;background:#fff7e6;color:#ad6800;font-size:13px}.notice:empty{display:none}.notice.warn{background:#fff1f0;color:#cf1322}.decision-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px}.decision-bar:empty{display:none}.decision-bar .hint{margin-left:4px;color:#999;font-size:12px}.step-hint{margin-left:auto;padding:8px 12px;border-radius:4px;background:#f0f7f3;color:#527566;font-size:12px}.btn.purchase{background:#d46b08;color:#fff;border-color:#d46b08}.btn.danger{border-color:#ff7875;background:#fff1f0;color:#cf1322}.info-title,.section-title{margin:22px 0 14px;padding-left:8px;border-left:3px solid #2BA471;color:#2BA471;font-weight:600}.info{display:grid;grid-template-columns:1fr 1fr;gap:16px 60px}.field{display:flex;gap:12px;min-width:0}.field label{width:100px;flex:0 0 100px;text-align:right;color:#666}.field span,.field a{min-width:0;color:#333}.table-wrap{overflow-x:auto}.table{min-width:1820px}.table th,.table td{white-space:nowrap;text-align:center;vertical-align:middle}.table th{font-size:12px}.product-img{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:4px;background:#f4f8f5;color:#6f8978}.money{font-weight:600;color:#b75d31}.row-accepted td{background:#f0faf5}.row-rejected td{background:#fff1f0}.line-status{position:sticky;right:150px;z-index:2;min-width:104px;background:#fff}.line-actions{position:sticky;right:0;z-index:3;min-width:150px;background:#fff}.row-accepted .line-status,.row-accepted .line-actions{background:#f0faf5}.row-rejected .line-status,.row-rejected .line-actions{background:#fff1f0}.line-actions .btn{margin:2px;padding:5px 8px}.tag.accepted{background:#f0faf5;color:#2BA471}.tag.rejected{background:#fff1f0;color:#ff4d4f}.tag.abandoned{background:#f5f5f5;color:#8c8c8c}.tag.requested{background:#e6f7ff;color:#1890ff}.summary{display:flex;justify-content:flex-end;gap:22px;padding-top:16px;color:#666}.summary strong{color:#2BA471}.modal-mask{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.42)}.modal-mask.show{display:flex}.modal{width:560px;max-width:calc(100vw - 32px);overflow:hidden;border-radius:7px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eee;font-weight:600}.modal-head button{border:0;background:transparent;font-size:20px;color:#999;cursor:pointer}.modal-body{padding:20px;color:#666;line-height:1.8}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #eee}@media(max-width:900px){.info{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.steps{margin-left:0}.step-hint{margin-left:0}}
    .tag.expired{display:inline-block;padding:3px 8px;border:1px solid #d9d9d9;border-radius:10px;background:#f5f5f5;color:#8c8c8c;font-size:12px}
  </style>
</head>
<body>
  <header class="top-nav"><div class="brand-logo">元</div><div class="brand-name">元象农产品</div><div class="brand-sub">买家工作台</div><div class="top-right">🔔　超级管理员　▾</div></header>
  <div class="layout"><div id="sidebar-container"></div><main class="main">
    <div class="bread"><a href="平台报价单列表.html">平台报价单</a> / <span id="crumb">报价单详情</span></div>
    <div class="page-head"><div class="quote-title"><span>平台报价单</span><strong id="quoteNo"></strong><small>关联询价单：<a class="link" id="inquiryLink"></a></small></div></div>
    <section class="card">
      <div class="topbar"><div id="topActions"></div><div class="steps" id="steps"><span>待确认</span><span>已完成</span></div></div>
      <!-- <div style="display:flex;align-items:center;gap:8px;margin:-2px 0 16px;padding:10px 12px;border:1px dashed #b7c9be;border-radius:4px;background:#fbfefc;font-size:12px;color:#667382"><span>失效演示模拟：</span><button class="btn default" type="button" data-expiry-demo="none">均有效</button><button class="btn default" type="button" data-expiry-demo="one">第 2 条失效</button><button class="btn default" type="button" data-expiry-demo="all">全部失效</button><span style="margin-left:4px;color:#999">仅用于原型演示，不保存页面状态。</span></div> -->
      <div class="notice" id="notice"></div><div class="decision-bar" id="decisionBar"></div><div id="resultPanel"></div>
      <div class="info-title">基本信息</div>
      <div class="info"><div class="field"><label>业务员</label><span>张三</span></div><div class="field"><label>创建日期</label><span>2026年08月25日</span></div><div class="field"><label>付款条款</label><span>立即付款</span></div><div class="field"><label>客户</label><span>aqtest海赋（山东）数字产业发展有限公司LL</span></div><div class="field"><label>关联询价单号</label><a class="link" id="inquiryInfoLink"></a></div><div class="field"><label>联系人</label><span>侯振鲁</span></div><div class="field"><label>联系电话</label><span>17505308090</span></div><div class="field"><label>地址</label><span>山东省菏泽市单县港镇哈伦街1123</span></div></div>
      <div class="section-title">报价明细</div><div class="table-wrap"><table class="table"><thead><tr><th>序号</th><th>产品名称</th><th>产品图片</th><th>品牌</th><th>规格</th><th>单位</th><th>订购数量</th><th>期望交期</th><th>备注</th><th>采购单价</th><th>采购供应商</th><th>平台销售单价</th><th>税率</th><th>税额</th><th>未税金额</th><th>含税总价</th><th>价格有效期</th><th class="line-status">状态</th><th class="line-actions">操作</th></tr></thead><tbody id="lines"></tbody></table></div>
      <div class="summary"><span>已接受未税金额：<strong id="untaxedTotal">¥ 0.00</strong></span><span>已接受税额：<strong id="taxTotal">¥ 0.00</strong></span><span>已接受含税金额：<strong id="grossTotal">¥ 0.00</strong></span></div>
    </section>
  </main></div>
  <div class="modal-mask" id="submitModal"><div class="modal"><div class="modal-head">提交确认 <button type="button" data-close="submitModal">×</button></div><div class="modal-body" id="submitText"></div><div class="modal-foot"><button class="btn default" type="button" data-close="submitModal">取消</button><button class="btn primary" id="confirmSubmit" type="button">确认提交</button></div></div></div>
  <div class="modal-mask" id="purchaseModal"><div class="modal"><div class="modal-head">生成采购订单 <button type="button" data-close="purchaseModal">×</button></div><div class="modal-body" id="purchaseText"></div><div class="modal-foot"><button class="btn default" type="button" data-close="purchaseModal">取消</button><button class="btn purchase" id="confirmPurchase" type="button">确认生成</button></div></div></div>
  <div class="modal-mask" id="requestRequoteModal"><div class="modal"><div class="modal-head">请求重新报价 <button type="button" data-close="requestRequoteModal">×</button></div><div class="modal-body" id="requestRequoteText"></div><div class="modal-foot"><button class="btn default" type="button" data-close="requestRequoteModal">取消</button><button class="btn primary" id="confirmRequote" type="button">确认提交</button></div></div></div>
  <div class="modal-mask" id="abandonModal"><div class="modal"><div class="modal-head">确认放弃 <button type="button" data-close="abandonModal">×</button></div><div class="modal-body" id="abandonText"></div><div class="modal-foot"><button class="btn default" type="button" data-close="abandonModal">取消</button><button class="btn danger" id="confirmAbandon" type="button">确认放弃</button></div></div></div>
  <script src="sidebar.js"></script>
  <script>
    (function(){
      var query=new URLSearchParams(location.search),status=query.get('status')||'confirm',quote=query.get('quote')||'BJ20260825062',inquiry=query.get('inquiry')||'XJ2026080062',requoteOf=query.get('requoteOf')||'',requoteLineIndexes=(query.get('requoteLines')||'').split(',').filter(function(value){return value!==''}).map(Number),expiredIndexes=(query.get('expiredLines')||(query.get('expired')==='1'?'0,1':'')).split(',').filter(function(value){return value!==''}).map(Number),requoteTaskKey='clientRequoteTask_'+quote,requoteTask=null;
      // 原型页的接受、拒绝、重新报价仅作为当前页演示，不跨刷新保存；同时清理旧演示遗留状态。
      sessionStorage.removeItem(requoteTaskKey);
      var lines=[{name:'大蒜',brand:'金乡',spec:'4.0',unit:'吨',qty:5,expectedDelivery:'2026-08-31',buy:2000,supplier:'aqtest海赋供应链',sell:2352.94,tax:13,validUntil:'2026-08-31 23:59',note:'需冷链运输',choice:'pending'},{name:'洋葱',brand:'金乡',spec:'3.2',unit:'吨',qty:8,expectedDelivery:'2026-09-02',buy:1115,supplier:'天津市思睿国际贸易有限公司',sell:1307.06,tax:5,validUntil:'2026-08-30 23:59',note:'—',choice:'pending'}];
      if(requoteOf&&requoteLineIndexes.length){lines=lines.filter(function(line,index){return requoteLineIndexes.indexOf(index)>=0});var sourceTip=document.createElement('div');sourceTip.className='notice';sourceTip.textContent='本单为原平台报价单 '+requoteOf+' 的重新报价，仅包含客户请求重新报价的明细。';document.querySelector('.page-head').insertAdjacentElement('afterend',sourceTip)}
      lines.forEach(function(line){line.requoteRequested=false});
      expiredIndexes.forEach(function(index){if(lines[index])lines[index].choice='expired'});
      var $=function(id){return document.getElementById(id)},money=function(value){return '¥ '+Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})};
      function syncInquiryLinks(){var inquiryStatus=status==='done'&&!requoteTask?'completed':'submitted';['inquiryLink','inquiryInfoLink'].forEach(function(id){$(id).textContent=inquiry;$(id).href='询价单详情.html?no='+encodeURIComponent(inquiry)+'&status='+inquiryStatus})}
      $('quoteNo').textContent=quote;$('crumb').textContent=quote;syncInquiryLinks();
      function calculate(line){var gross=line.qty*line.sell,untaxed=gross/(1+line.tax/100);return{gross:gross,untaxed:untaxed,tax:gross-untaxed}}
      function acceptedLines(){return lines.filter(function(line){return line.choice==='accepted'})}
      function rejectedIndexes(){return lines.map(function(line,index){return line.choice==='rejected'?index:null}).filter(function(index){return index!==null})}
      function expiredLineIndexes(){return lines.map(function(line,index){return line.choice==='expired'?index:null}).filter(function(index){return index!==null})}
      function abandonedIndexes(){return lines.map(function(line,index){return line.choice==='abandoned'?index:null}).filter(function(index){return index!==null})}
      function requoteIndexes(){return rejectedIndexes().concat(expiredLineIndexes()).filter(function(index){return !lines[index].requoteRequested})}
      function allResolved(){return lines.every(function(line){return line.choice!=='pending'})}
      function setSteps(){var steps=$('steps').children;steps[0].className=status==='done'?'done':'active';steps[1].className=status==='done'?'active':''}
      var pendingRequoteIndexes=[],pendingAbandonIndexes=[];
      function openRequoteRequest(index){pendingRequoteIndexes=typeof index==='number'?[index]:requoteIndexes();$('requestRequoteText').textContent='将向平台提交重新报价请求，平台仅针对 '+pendingRequoteIndexes.length+' 条未接受或已失效明细重新询价；已接受明细不受影响。';$('requestRequoteModal').classList.add('show')}
      function openAbandonConfirm(index){pendingAbandonIndexes=typeof index==='number'?[index]:rejectedIndexes();var allRejected=pendingAbandonIndexes.length===lines.length&&expiredLineIndexes().length===0;$('abandonText').textContent=allRejected?'放弃后，本报价单不再请求重新报价，也不会生成采购订单。是否确认放弃当前报价？':'放弃后，该已拒绝明细不再请求重新报价；其他明细不受影响。是否确认？';$('abandonModal').classList.add('show')}
      function acceptedIndexes(){return lines.map(function(line,index){return line.choice==='accepted'?index:null}).filter(function(index){return index!==null})}
      function openPurchase(){var accepted=acceptedIndexes();$('purchaseText').textContent='将带入全部 '+accepted.length+' 条已接受报价明细及采购金额，生成一张采购订单；采购订单中每条明细的供应商可分别选择，也允许暂不填写。';$('purchaseModal').classList.add('show')}
      function renderActions(){
        var accepted=acceptedLines(),rejected=rejectedIndexes(),expired=expiredLineIndexes(),abandoned=abandonedIndexes(),summary=['已接受 '+accepted.length+' 条',rejected.length?'已拒绝 '+rejected.length+' 条':'',expired.length?'已失效 '+expired.length+' 条':'',abandoned.length?'已放弃 '+abandoned.length+' 条':''].filter(Boolean).join(' ｜ ');
        $('resultPanel').innerHTML='';
        if(expired.length===lines.length&&status!=='done'){$('topActions').innerHTML='<button class="btn default" type="button" disabled>报价明细已失效</button>';$('decisionBar').innerHTML='';$('notice').classList.add('warn');$('notice').textContent='全部报价明细的价格有效期已截止，无法再接受或拒绝报价。';return}
        if(status==='done'){$('topActions').innerHTML=accepted.length?'<button class="btn purchase" type="button" id="makePurchase">生成采购订单</button>':'<button class="btn default" type="button" disabled>已提交确认</button>';$('decisionBar').innerHTML='';if($('makePurchase'))$('makePurchase').onclick=openPurchase;return}
        $('topActions').innerHTML='<button class="btn primary" type="button" id="submitConfirm">提交确认</button>';
        $('decisionBar').innerHTML='<button class="btn primary" type="button" id="acceptAll">全部接受</button><button class="btn default" type="button" id="rejectAll">全部拒绝</button><span class="step-hint">1. 选择是否采纳有效报价 → 2. 提交确认 → 3. 未接受或失效明细可请求重新报价；已接受明细可生成采购订单</span>';
        $('acceptAll').onclick=function(){lines.forEach(function(line){if(line.choice!=='expired')line.choice='accepted'});render()};$('rejectAll').onclick=function(){lines.forEach(function(line){if(line.choice!=='expired')line.choice='rejected'});render()};$('submitConfirm').onclick=function(){if(!allResolved()){var pending=lines.filter(function(line){return line.choice==='pending'}).length;$('notice').classList.add('warn');$('notice').textContent='还有 '+pending+' 条有效报价明细未选择，请完成选择后再提交确认。';return}$('notice').classList.remove('warn');var requestable=requoteIndexes();$('submitText').textContent=(accepted.length?'已接受 '+accepted.length+' 条':'')+(accepted.length&&requestable.length?'，':'')+(requestable.length?'未接受或已失效 '+requestable.length+' 条报价明细。':'全部报价明细已接受。')+'提交后结果不可修改；已接受明细将同步至我的产品库。';$('submitModal').classList.add('show')}
      }
      function render(){
        setSteps();syncInquiryLinks();$('notice').classList.remove('warn');$('notice').textContent='';
        $('lines').innerHTML=lines.map(function(line,index){var amount=calculate(line),state,action;if(line.choice==='abandoned'){state='<span class="tag abandoned">已放弃</span>';action='—'}else if(line.requoteRequested){state='<span class="tag requested">已请求重新报价</span>';action='—'}else if(line.choice==='expired'){state='<span class="tag expired">价格已失效</span>';action='<button class="btn default" type="button" data-requote="'+index+'">重新报价</button>'}else if(status==='done'&&line.choice==='accepted'){state='<span class="tag accepted">已接受</span>';action='—'}else if(status==='done'&&line.choice==='rejected'){state='<span class="tag rejected">已拒绝</span>';action='<button class="btn primary" type="button" data-requote="'+index+'">重新报价</button><button class="btn danger" type="button" data-abandon="'+index+'">放弃</button>'}else if(line.choice==='accepted'){state='<span class="tag accepted">已接受</span>';action='—'}else if(line.choice==='rejected'){state='<span class="tag rejected">已拒绝</span>';action='—'}else{state='<span class="tag">待选择</span>';action='<button class="btn primary" type="button" data-choice="accepted" data-index="'+index+'">接受报价</button><button class="btn default" type="button" data-choice="rejected" data-index="'+index+'">拒绝报价</button>'}return '<tr class="'+(line.choice==='accepted'?'row-accepted':line.choice==='rejected'?'row-rejected':'')+'"><td>'+(index+1)+'</td><td>'+line.name+'</td><td><span class="product-img">🖼</span></td><td>'+line.brand+'</td><td>'+line.spec+'</td><td>'+line.unit+'</td><td>'+line.qty+'</td><td>'+line.expectedDelivery+'</td><td>'+line.note+'</td><td class="money">'+money(line.buy)+'</td><td>'+line.supplier+'</td><td class="money">'+money(line.sell)+'</td><td>'+line.tax+'%</td><td>'+money(amount.tax)+'</td><td>'+money(amount.untaxed)+'</td><td class="money">'+money(amount.gross)+'</td><td>'+line.validUntil+'</td><td class="line-status">'+state+'</td><td class="line-actions">'+action+'</td></tr>'}).join('');
        Array.prototype.forEach.call(document.querySelectorAll('[data-choice]'),function(button){button.onclick=function(){lines[Number(this.dataset.index)].choice=this.dataset.choice;render()}});Array.prototype.forEach.call(document.querySelectorAll('[data-requote]'),function(button){button.onclick=function(){openRequoteRequest(Number(this.dataset.requote))}});Array.prototype.forEach.call(document.querySelectorAll('[data-abandon]'),function(button){button.onclick=function(){openAbandonConfirm(Number(this.dataset.abandon))}});
        var totals=acceptedLines().reduce(function(total,line){var amount=calculate(line);total.untaxed+=amount.untaxed;total.tax+=amount.tax;total.gross+=amount.gross;return total},{untaxed:0,tax:0,gross:0});$('untaxedTotal').textContent=money(totals.untaxed);$('taxTotal').textContent=money(totals.tax);$('grossTotal').textContent=money(totals.gross);renderActions();
      }
      function syncExpiryButtons(mode){Array.prototype.forEach.call(document.querySelectorAll('[data-expiry-demo]'),function(button){button.style.borderColor=button.dataset.expiryDemo===mode?'#2BA471':'';button.style.color=button.dataset.expiryDemo===mode?'#2BA471':'';button.style.background=button.dataset.expiryDemo===mode?'#f0faf5':''})}
      function setExpiryDemo(mode){expiredIndexes=mode==='one'?[1]:mode==='all'?[0,1]:[];requoteTask=null;sessionStorage.removeItem(requoteTaskKey);lines.forEach(function(line,index){line.choice=expiredIndexes.indexOf(index)>=0?'expired':'pending';line.requoteRequested=false});status='confirm';syncExpiryButtons(mode);render()}
      function closeModal(id){$(id).classList.remove('show')}Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(button){button.onclick=function(){closeModal(this.dataset.close)}});['submitModal','purchaseModal','requestRequoteModal','abandonModal'].forEach(function(id){$(id).onclick=function(event){if(event.target===this)closeModal(id)}});
      $('confirmSubmit').onclick=function(){closeModal('submitModal');status='done';try{sessionStorage.setItem('platformQuoteClientConfirmed_'+quote,'1')}catch(error){}render()};$('confirmPurchase').onclick=function(){closeModal('purchaseModal');var accepted=acceptedIndexes().join(',');location.href='新建采购订单.html?quote='+encodeURIComponent(quote)+'&inquiry='+encodeURIComponent(inquiry)+'&accepted='+encodeURIComponent(accepted)};
      $('confirmAbandon').onclick=function(){var allRejected=pendingAbandonIndexes.length===lines.length&&expiredLineIndexes().length===0;pendingAbandonIndexes.forEach(function(index){lines[index].choice='abandoned'});closeModal('abandonModal');$('notice').classList.remove('warn');$('notice').textContent=allRejected?'已放弃当前报价。':'已放弃该拒绝报价明细。';render();};$('confirmRequote').onclick=function(){pendingRequoteIndexes.forEach(function(index){lines[index].requoteRequested=true});requoteTask={quote:quote,inquiry:inquiry,rejectedLines:lines.map(function(line,index){return line.requoteRequested?index:null}).filter(function(index){return index!==null}),requestedAt:new Date().toLocaleString('zh-CN')};closeModal('requestRequoteModal');$('notice').classList.remove('warn');$('notice').textContent='已向平台提交重新报价请求。';render();};
      Array.prototype.forEach.call(document.querySelectorAll('[data-expiry-demo]'),function(button){button.onclick=function(){setExpiryDemo(button.dataset.expiryDemo)}});syncExpiryButtons(expiredIndexes.length===2?'all':expiredIndexes.length?'one':'none');if(status==='done'){if(lines[0].choice==='pending')lines[0].choice='accepted';if(lines[1].choice==='pending')lines[1].choice='rejected'}render();
    })();
  </script>
</body>
</html>
