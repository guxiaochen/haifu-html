<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>询价单列表 - 元象农产品买家工作台</title>
    <link rel="stylesheet" href="询价样式.css">
    <link rel="stylesheet" href="客户端详情公共样式.css">
    <style>
        .main { min-width: 0; }
        .page-head { gap: 12px; }
        .page-head .title-actions { margin-left: auto; display: flex; gap: 8px; }
        .filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .filter label { color: #666; font-size: 13px; }
        .filter input, .filter select { margin: 0; min-width: 150px; }
        .table-wrap { overflow-x: auto; }
        .table { min-width: 820px; }
        .table th, .table td { white-space: nowrap; }
        .status-draft { background: #f5f5f5; color: #8c8c8c; }
        .status-submitted { background: #e6f7ff; color: #1890ff; }
        .status-done { background: #f0faf5; color: #2BA471; }
        .empty { padding: 44px; text-align: center; color: #999; }
        .action-link { color: #2BA471; text-decoration: none; margin-right: 12px; cursor: pointer; }
        .action-link:hover { text-decoration: underline; }
        .action-link.delete { color: #ff4d4f; }
        .modal-mask { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
        .modal-mask.show { display: flex; }.modal { width: 420px; overflow: hidden; border-radius: 6px; background: #fff; box-shadow: 0 12px 32px rgba(0,0,0,.2); }.modal-head { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid #f0f0f0; font-weight:600; }.modal-head button { margin-left:auto; border:0; background:transparent; color:#999; cursor:pointer; font-size:20px; }.modal-body { padding:20px 18px; color:#666; line-height:1.8; }.modal-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid #f0f0f0; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="brand-logo">元</div>
        <div class="brand-name">元象农产品</div>
        <div class="brand-sub">买家工作台</div>
        <div class="top-right">🔔　超级管理员　▾</div>
    </header>

    <div class="layout">
        <div id="sidebar-container"></div>
        <main class="main">
            <div class="bread">
                <a href="采购订单列表.html">采购订单</a> / 询价单
            </div>

            <div class="page-head">
                <span class="title">询价单</span>
                <div class="title-actions">
                    <button class="btn primary" onclick="location.href='询价单详情.html?mode=new'">+ 新建询价单</button>
                </div>
            </div>

            <div class="card filter">
                <label for="projectName">询价项目名</label>
                <input id="projectName" placeholder="请输入询价项目名">
                <label for="status">状态</label>
                <select id="status">
                    <option value="">全部状态</option>
                    <option value="draft">草稿</option>
                    <option value="submitted">已提交</option>
                    <option value="completed">已完成</option>
                </select>
                <label for="createdDate">创建日期</label>
                <input id="createdDate" type="date">
                <label for="deadlineDate">报价截止日期</label>
                <input id="deadlineDate" type="date">
                <button class="btn primary" onclick="render()">查询</button>
                <button class="btn default" onclick="resetFilter()">重置</button>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>询价编号</th>
                                <th>询价项目名</th>
                                <th>业务员</th>
                                <th>报价截止日期</th>
                                <th>创建日期</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="body"></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span id="total">共 0 条</span>
                    <button class="page-btn">‹</button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">›</button>
                </div>
            </div>
        </main>
    </div>
    <div class="modal-mask" id="deleteModal"><div class="modal"><div class="modal-head">删除询价单 <button type="button" onclick="closeDelete()">×</button></div><div class="modal-body" id="deleteText"></div><div class="modal-foot"><button class="btn default" type="button" onclick="closeDelete()">取消</button><button class="btn primary" type="button" onclick="confirmDelete()">确认删除</button></div></div></div>

    <script src="sidebar.js"></script>
    <script>
        var data = [
            { no: 'XJ2025090076', project: '9月食堂蔬菜补货询价', status: 'draft', deadline: '2026-09-18', salesman: '徐白雪', date: '2026-09-11' },
            { no: 'XJ2025080060', project: '食堂蔬菜补货询价', status: 'submitted', deadline: '2026-08-29', salesman: '徐白雪', date: '2026-08-22' },
            { no: 'XJ2025080021', project: '冷链农产品采购询价', status: 'completed', deadline: '2026-08-25', salesman: '侯慧鲁', date: '2026-08-18' }
        ];

        var labels = {
            draft: ['status-draft', '草稿'],
            submitted: ['status-submitted', '已提交'],
            completed: ['status-done', '已完成']
        };

        function render() {
            var projectName = document.getElementById('projectName').value.trim().toLowerCase();
            var status = document.getElementById('status').value;
            var createdDate = document.getElementById('createdDate').value;
            var deadlineDate = document.getElementById('deadlineDate').value;
            var list = data.filter(function (item) {
                return (!projectName || item.project.toLowerCase().indexOf(projectName) >= 0) &&
                    (!status || item.status === status) &&
                    (!createdDate || item.date === createdDate) &&
                    (!deadlineDate || item.deadline === deadlineDate);
            });

            document.getElementById('total').textContent = '共 ' + list.length + ' 条';
            document.getElementById('body').innerHTML = list.length ? list.map(function (item) {
                var label = labels[item.status];
                var detailUrl = '询价单详情.html?no=' + encodeURIComponent(item.no) + '&status=' + encodeURIComponent(item.status);
                var operations='<a class="action-link" href="'+detailUrl+'">查看</a>'+(item.status==='draft'?'<a class="action-link delete" href="javascript:void(0)" onclick="openDelete(\''+item.no+'\')">删除</a>':'');
                return '<tr>' +
                    '<td><a class="action-link" href="' + detailUrl + '">' + item.no + '</a></td>' +
                    '<td>' + item.project + '</td>' +
                    '<td>' + item.salesman + '</td>' +
                    '<td>' + item.deadline + '</td>' +
                    '<td>' + item.date + '</td>' +
                    '<td><span class="tag ' + label[0] + '">' + label[1] + '</span></td>' +
                    '<td>'+operations+'</td>' +
                    '</tr>';
            }).join('') : '<tr><td class="empty" colspan="7">暂无询价单</td></tr>';
        }

        function resetFilter() {
            document.getElementById('projectName').value = '';
            document.getElementById('status').value = '';
            document.getElementById('createdDate').value = '';
            document.getElementById('deadlineDate').value = '';
            render();
        }

        var pendingDeleteNo = '';
        function openDelete(no) { pendingDeleteNo = no; document.getElementById('deleteText').textContent = '确认删除草稿询价单“' + no + '”吗？删除后不可恢复。'; document.getElementById('deleteModal').classList.add('show'); }
        function closeDelete() { pendingDeleteNo = ''; document.getElementById('deleteModal').classList.remove('show'); }
        function confirmDelete() { if (!pendingDeleteNo) return; data = data.filter(function (item) { return item.no !== pendingDeleteNo; }); closeDelete(); render(); }
        document.getElementById('deleteModal').addEventListener('click', function (event) { if (event.target === this) closeDelete(); });

        render();
    </script>
</body>
</html>
