<html lang="zh-CN">

  <title>询价单详情 - 元象农产品买家工作台</title>
  <link rel="stylesheet" href="询价样式.css">
  <link rel="stylesheet" href="客户端详情公共样式.css">
  <style>
    .main{min-width:0}.page-head{display:flex;align-items:center;gap:12px}.page-head .title{font-size:18px;font-weight:600}.title-middle{flex:1;display:flex;justify-content:center}.quote-pill{display:none;align-items:center;gap:6px;padding:4px 12px;border:0;border-radius:12px;background:#e6f7ff;color:#1890ff;cursor:pointer;font-size:12px}.quote-pill b{padding:0 6px;border-radius:9px;background:#1890ff;color:#fff}.status-bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #f0f0f0}.steps{display:flex;align-items:center;font-size:13px}.steps span{position:relative;margin-right:-8px;padding:6px 18px;background:#f5f5f5;color:#666;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}.steps span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}.steps span:last-child{margin-right:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8px 50%)}.steps .done{background:#e8e8e8;color:#999}.steps .active{background:#2BA471;color:#fff}.steps .cancelled{background:#ff4d4f;color:#fff}.info-title{margin:18px 0 16px;padding-left:8px;border-left:3px solid #2BA471;color:#2BA471;font-weight:600}.info{display:grid;grid-template-columns:1fr 1fr;gap:16px 60px}.info-item{display:flex;align-items:center;min-width:0;gap:12px}.info-item label{width:100px;flex:0 0 100px;text-align:right;color:#333}.info-item input,.info-item select{width:100%;min-width:0;height:32px;padding:0 9px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#333;font:inherit}.info-item input[readonly]{border-color:transparent;background:transparent;padding-left:0}.required::before{content:'*';margin-right:3px;color:#ff4d4f}.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.detail-tab{padding:7px 14px;border-radius:4px 4px 0 0;border-bottom:2px solid #2BA471;background:#f0faf5;color:#2BA471;font-weight:600}.table-wrap{overflow-x:auto}.table{min-width:1320px}.table th,.table td{white-space:nowrap;vertical-align:middle}.table th{text-align:center}.table td{text-align:center}.table td:first-child{color:#999}.cell-edit{min-width:74px;min-height:30px;padding:6px 7px;border-bottom:1px dashed #b7cdbf;border-radius:3px;background:#f8fbf9;color:#25332b;text-align:center;outline:0;cursor:text}.cell-edit:empty:before{content:attr(data-placeholder);color:#a8b5ad}.cell-edit:hover,.cell-edit:focus{border-bottom-color:#2BA471;background:#edf8f1;box-shadow:inset 0 0 0 1px #2BA471}.cell-edit[data-key="qty"]{background:#fffaf0}.cell-edit[data-key="price"]{background:#f0f8ff}.cell-edit[data-key="supplier"]{background:#f8f5ff}.cell-read{color:#333}.image-cell{width:54px}.image-upload{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;overflow:hidden;border:1px dashed #b8c5bc;border-radius:4px;background:#f7faf8;color:#6f8978;cursor:pointer;font-size:16px}.image-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.image-upload img{width:100%;height:100%;object-fit:cover}.add-row{margin-top:14px}.empty{padding:42px!important;color:#999;text-align:center!important}.totals{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;color:#666}.totals strong{color:#2BA471;font-size:15px}.hint{margin:8px 0 0;color:#999;font-size:12px}.modal-mask{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}.modal-mask.show{display:flex}.modal{width:620px;max-width:calc(100vw - 32px);overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:600}.modal-head button{border:0;background:transparent;color:#999;cursor:pointer;font-size:20px}.modal-body{padding:20px;color:#666;line-height:1.8}.modal-body input{margin-top:12px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #f0f0f0}.message{display:none;margin-bottom:14px;padding:9px 12px;border-radius:4px;background:#fff1f0;color:#cf1322;font-size:13px}.message.show{display:block}.message.success{background:#f0faf5;color:#2BA471}.row-delete{border:0;background:transparent;color:#ff4d4f;cursor:pointer;font-size:12px}.readonly-note{padding:9px 12px;margin-bottom:14px;border-radius:4px;background:#f6faff;color:#1890ff;font-size:12px}@media(max-width:980px){.info{grid-template-columns:1fr}.status-bar{align-items:flex-start;gap:12px;flex-direction:column}.steps{align-self:flex-end}}
  </style>
</head>
<body>
  <header class="top-nav"><div class="brand-logo">元</div><div class="brand-name">元象农产品</div><div class="brand-sub">买家工作台</div><div class="top-right">🔔　超级管理员　▾</div></header>
  <div class="layout"><div id="sidebar-container"></div><main class="main">
    <div class="bread"><a href="询价单列表.html">询价单</a> / <span id="crumbCurrent">询价单详情</span></div>
    <div class="page-head"><span class="title" id="pageTitle">询价单</span><div class="title-middle"><button id="quotePill" class="quote-pill" type="button">平台报价单 <b>× 2</b></button></div></div>
    <section class="card" id="detailCard">
      <div class="status-bar"><div class="ops" id="topActions"></div><div class="steps" id="steps"><span>草稿</span><span>已提交</span><span>已完成</span></div></div>
      <div id="readonlyNote" class="readonly-note" style="display:none"></div><div id="validationMessage" class="message"></div>
      <div class="info-title">询价基本信息</div><div class="info" id="infoGrid"></div>
      <div class="section-head"><div class="detail-tab">询价明细</div><button class="btn primary" id="importBtn" type="button">产品导入</button></div>
      <div class="table-wrap"><table class="table" id="itemTable"><thead><tr><th>序号</th><th>产品名称</th><th>产品图片</th><th>品牌</th><th>规格</th><th>单位</th><th>订购数量</th><th>期望交期</th><th>备注</th><th class="draft-only">操作</th></tr></thead><tbody id="itemBody"></tbody></table></div>
      <div class="add-row" id="addRowWrap"><button class="btn primary" id="addRowBtn" type="button">+ 添加行</button></div>
      <div class="totals"><span>合计金额（总采购金额）：</span><strong id="totalAmount">¥ 0.00</strong></div><p class="hint" id="totalHint">客户询价明细不填写采购单价，合计金额待平台报价单生成后确认。</p>
    </section>
  </main></div>
  <div class="modal-mask" id="importModal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head">导入产品明细 <button type="button" id="closeImport" aria-label="关闭">×</button></div><div class="modal-body">请选择产品明细文件（支持 .xlsx）<br><input id="importFile" type="file" accept=".xlsx"></div><div class="modal-foot"><button class="btn default" type="button" id="cancelImport">取消</button><button class="btn primary" type="button" id="confirmImport">导入</button></div></div></div>
  <script src="sidebar.js"></script>
  <script>
    (function () {
      var query=new URLSearchParams(location.search),status=query.get('status')||(query.get('mode')==='new'?'draft':'submitted'),no=query.get('no')||(status==='draft'?'新建询价单':'XJ2026080062'),editable=status==='draft',isSavedDraft=status==='draft'&&query.get('mode')!=='new',sourceQuote=query.get('sourceQuote'),sourceRejected=query.get('rejected'),rows=[],inputIds={},savedDraft=null;
      try{savedDraft=JSON.parse(sessionStorage.getItem('clientInquiryDraft')||'null');if(!savedDraft||savedDraft.no!==no)savedDraft=null}catch(e){}
      var infoFields=[['项目名','projectName','请输入询价项目名',false], ['操作人', 'salesman', '当前登录账号自动带入', false],['公司名称','customer','请输入公司名称',true], ['联系人', 'contact', '当前登录账号自动带入', true],['报价截止日期','deadline','请选择报价截止日期',true,'datetime-local'], ['联系电话', 'phone', '当前登录账号自动带入', true],['付款条款','payment','请输入付款条款',false],['收货地址','address','请输入收货地址',true]];
      var sampleInfo={projectName:'2026年8月农产品采购询价',salesman:'张三（当前登录账号）',customer:'aqtest海赋（山东）数字产业发展有限公司LL',deadline:'2026-08-27T16:00',contact:'侯振鲁',phone:'17505308090',payment:'立即付款',address:'山东省菏泽市单县港镇哈伦街1123',createdAt:'2026-08-25'};
      var sampleRows=[{name:'大蒜',brand:'金乡',spec:'4.0',unit:'吨',qty:5,expectedDelivery:'2026-08-31',note:'需冷链运输'},{name:'洋葱',brand:'金乡',spec:'3.2',unit:'吨',qty:8,expectedDelivery:'2026-09-02',note:'—'}];
      var $=function(id){return document.getElementById(id)}; var money=function(n){return '¥ '+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}; var esc=function(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]})};
      function stateSetup(){var title=$('pageTitle'),current=$('crumbCurrent');title.textContent='询价单 '+no;current.textContent=no;var statusName={draft:'草稿',submitted:'已提交',completed:'已完成'}[status]||'已提交';if(!editable){$('readonlyNote').style.display='block';$('readonlyNote').textContent='当前询价单状态：'+statusName+'，基础信息与询价明细仅可查看。';Array.prototype.forEach.call(document.querySelectorAll('.draft-only'),function(el){el.style.display='none'})}var activeMap={draft:0,submitted:1,completed:2};var active=Object.prototype.hasOwnProperty.call(activeMap,status)?activeMap[status]:1;Array.prototype.forEach.call($('steps').children,function(step,index){step.className=index<active?'done':'';if(index===active)step.className='active'});$('topActions').innerHTML=editable?'<button class="btn default" id="saveBtn" type="button">保存</button><button class="btn primary" id="submitBtn" type="button">提交</button>':'<button class="btn default" type="button" onclick="location.href=\'询价单列表.html\'">← 返回列表</button>';$('quotePill').style.display=!editable&&(status==='submitted'||status==='completed')?'inline-flex':'none';$('quotePill').onclick=function(){location.href='平台报价单列表.html?inquiry='+encodeURIComponent(no)}}
      function buildInfo(){$('infoGrid').innerHTML=infoFields.map(function(field){var label=field[0],key=field[1],placeholder=field[2],required=field[3],type=field[4]||'text',autoFilled=['salesman','contact','phone'].indexOf(key)>=0,value=editable?(savedDraft?(savedDraft.info[key]||''):(isSavedDraft?(sampleInfo[key]||''):(sourceQuote&&key!=='createdAt'?(sampleInfo[key]||''):(autoFilled?(sampleInfo[key]||''):'')))):(sampleInfo[key]||'—'),readonly=(!editable||key==='salesman')?'readonly':'';inputIds[key]='field_'+key;return '<div class="info-item"><label class="'+(required&&editable?'required':'')+'">'+label+'</label><input id="'+inputIds[key]+'" type="'+type+'" value="'+esc(value)+'" placeholder="'+placeholder+'" '+readonly+'></div>'}).join('')}
      function newRow(data){return Object.assign({name:'',brand:'',spec:'',unit:'',qty:'',expectedDelivery:'',note:''},data||{})}
      function renderRows(){var body=$('itemBody');var col=editable?10:9;if(!rows.length){body.innerHTML='<tr><td class="empty" colspan="'+col+'">暂无询价明细，请添加行或导入产品明细</td></tr>';updateTotal();return}body.innerHTML=rows.map(function(row,index){function cell(key,placeholder){if(!editable)return '<span class="cell-read">'+esc(row[key]||'—')+'</span>';return '<div class="cell-edit" contenteditable="true" role="textbox" data-index="'+index+'" data-key="'+key+'" data-placeholder="'+placeholder+'">'+esc(row[key])+'</div>'}return '<tr><td>'+(index+1)+'</td><td>'+cell('name','请输入产品名称')+'</td><td class="image-cell">📦</td><td>'+cell('brand','请输入品牌')+'</td><td>'+cell('spec','请输入规格')+'</td><td>'+cell('unit','请输入单位')+'</td><td>'+cell('qty','请输入订购数量')+'</td><td>'+cell('expectedDelivery','请输入期望交期')+'</td><td>'+cell('note','选填')+'</td>'+(editable?'<td><button class="row-delete" data-delete="'+index+'" type="button">删除</button></td>':'')+'</tr>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('.cell-edit'),function(cell){cell.addEventListener('input',function(){rows[Number(this.dataset.index)][this.dataset.key]=this.textContent.trim();updateTotal()});cell.addEventListener('blur',function(){var row=rows[Number(this.dataset.index)],key=this.dataset.key;if(key==='qty'){row[key]=String(this.textContent).replace(/[^0-9]/g,'');this.textContent=row[key]}updateTotal()})});Array.prototype.forEach.call(document.querySelectorAll('[data-delete]'),function(button){button.addEventListener('click',function(){rows.splice(Number(this.dataset.delete),1);renderRows()})});updateTotal()}
      function updateTotal(){$('totalAmount').textContent=money(0)}function showError(text){$('validationMessage').textContent=text;$('validationMessage').className='message show'}function clearError(){$('validationMessage').className='message'}function currentDraftNo(){return no==='新建询价单'?'XJ2026090077':no}function saveDraft(){clearError();var info={};infoFields.forEach(function(field){var key=field[1],input=$(inputIds[key]);info[key]=input?input.value.trim():''});try{sessionStorage.setItem('clientInquiryDraft',JSON.stringify({no:currentDraftNo(),info:info,rows:rows}))}catch(e){}location.href='询价单详情.html?no='+encodeURIComponent(currentDraftNo())+'&status=draft'}
      function submit(){clearError();var required=['customer','deadline','address','contact','phone'];for(var i=0;i<required.length;i++){if(!$('field_'+required[i]).value.trim()){showError('请填写必填的询价基本信息。');return}}if(!rows.length){showError('请至少添加一条询价明细。');return}var invalid=rows.some(function(row){return !row.name||!row.unit||!Number.isInteger(Number(row.qty))||Number(row.qty)<1});if(invalid){showError('请完善每条明细的产品名称、单位和订购数量；订购数量必须为正整数。');return}try{sessionStorage.removeItem('clientInquiryDraft')}catch(e){}location.href='询价单详情.html?no='+encodeURIComponent(currentDraftNo())+'&status=submitted'}
      function closeImport(){$('importModal').classList.remove('show')}stateSetup();buildInfo();var rejectedRows=[];if(sourceQuote&&sourceRejected){if(sourceRejected==='all')rejectedRows=sampleRows;else rejectedRows=sourceRejected.split(',').map(function(index){return sampleRows[Number(index)]}).filter(Boolean)}rows=editable?(savedDraft?savedDraft.rows.map(newRow):(isSavedDraft?sampleRows.map(newRow):rejectedRows.map(newRow))):sampleRows.map(newRow);renderRows();if(sourceQuote&&sourceRejected){$('readonlyNote').style.display='block';$('readonlyNote').textContent='已带入原询价基本信息和 '+rejectedRows.length+' 条被拒绝明细，请核对后重新提交。'}$('importBtn').style.display=editable?'inline-block':'none';$('addRowWrap').style.display=editable?'block':'none';$('addRowBtn').addEventListener('click',function(){rows.push(newRow());renderRows()});if($('submitBtn'))$('submitBtn').addEventListener('click',submit);if($('saveBtn'))$('saveBtn').addEventListener('click',saveDraft);$('importBtn').addEventListener('click',function(){$('importModal').classList.add('show')});$('closeImport').addEventListener('click',closeImport);$('cancelImport').addEventListener('click',closeImport);$('importModal').addEventListener('click',function(event){if(event.target===this)closeImport()});$('confirmImport').addEventListener('click',function(){if(!$('importFile').files.length){showError('请选择 .xlsx 产品明细文件。');return}rows.push(newRow({name:'导入产品示例',brand:'—',spec:'—',unit:'件',qty:1,expectedDelivery:'',note:''}));closeImport();renderRows()})
    })();
  </script>
</body>
</html>
