<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号管理 - 元象农产品买家工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#333;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{height:56px;background:#2ba471;color:#fff;display:flex;align-items:center;padding:0 24px;font-weight:600}.layout{display:flex;min-height:calc(100vh - 56px)}.main{flex:1;padding:18px;min-width:0}.bread{color:#999;margin-bottom:14px}.card{background:#fff;border-radius:6px;box-shadow:0 1px 2px #0000000a;margin-bottom:14px}.title{padding:16px 20px;display:flex;align-items:center;font-size:18px;font-weight:600}.title button{margin-left:auto}.tip{padding:12px 18px;background:#f0faf5;border:1px solid #b7e4cd;color:#237a55;border-radius:5px;margin-bottom:14px}.btn{padding:7px 15px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer}.primary{background:#2ba471;color:#fff;border-color:#2ba471}table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid #f0f0f0;text-align:left}th{background:#fafafa;color:#666;font-weight:500}.tag{padding:2px 9px;border-radius:10px;background:#f0faf5;color:#2ba471}.actions a{color:#2ba471;margin-right:12px;cursor:pointer}.modal-mask{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;z-index:20}.modal-mask.show{display:flex}.modal{width:620px;background:#fff;border-radius:8px}.mh,.mf{padding:16px 20px;display:flex;align-items:center;border-bottom:1px solid #eee}.mf{border-top:1px solid #eee;border-bottom:0;justify-content:flex-end;gap:8px}.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.form label{display:block;color:#666;font-size:12px;margin-bottom:5px}.form input,.form select{width:100%;padding:9px;border:1px solid #d9d9d9;border-radius:4px}.sub{font-size:12px;color:#999;margin-top:5px}
</style></head><body><div class="top">元象农产品　买家工作台</div><div class="layout"><div id="sidebar-container"></div><script src="sidebar.js"></script><main class="main"><div class="bread">账号管理 / 登录账号</div><div class="tip">平台管理员统一配置角色、菜单和权限；客户端仅管理本企业账号，并从平台已授权角色中选择。</div><div class="card"><div class="title">登录账号<button class="btn primary" onclick="openEditor()">+新增账号</button></div><table><thead><tr><th>序号</th><th>登录账号</th><th>联系人姓名</th><th>联系电话</th><th>平台授权角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<div class="modal-mask" id="editor"><div class="modal"><div class="mh"><b id="et">新增账号</b></div><div class="form"><div><label>登录账号</label><input id="account"></div><div><label>联系人姓名</label><input id="name"></div><div><label>联系电话</label><input id="phone"></div><div><label>角色</label><select id="role"><option>企业管理员</option><option>采购员</option><option>收货员</option><option>财务人员</option><option>只读人员</option></select><div class="sub">角色由平台管理员预先授权</div></div></div><div class="mf"><button class="btn" onclick="closeEditor()">取消</button><button class="btn primary" onclick="save()">保存</button></div></div></div><script>
var users=[{account:'admin',name:'侯振鲁',phone:'17505308090',role:'企业管理员',enabled:true},{account:'buyer01',name:'李钦彤',phone:'18480941200',role:'采购员',enabled:true},{account:'receiver01',name:'邱艳',phone:'18765008620',role:'收货员',enabled:true}],edit=-1;function render(){rows.innerHTML=users.map(function(u,i){return '<tr><td>'+(i+1)+'</td><td>'+u.account+'</td><td>'+u.name+'</td><td>'+u.phone+'</td><td>'+u.role+'</td><td><span class="tag">'+(u.enabled?'已启用':'已停用')+'</span></td><td class="actions"><a onclick="loginAs('+i+')">模拟登录</a><a onclick="openEditor('+i+')">编辑</a><a onclick="toggle('+i+')">'+(u.enabled?'停用':'启用')+'</a></td></tr>'}).join('')}function openEditor(i){edit=Number.isInteger(i)?i:-1;var u=edit>=0?users[edit]:{};et.textContent=edit>=0?'编辑账号':'新增账号';account.value=u.account||'';name.value=u.name||'';phone.value=u.phone||'';role.value=u.role||'采购员';editor.classList.add('show')}function closeEditor(){editor.classList.remove('show')}function save(){if(!account.value.trim()||!name.value.trim()||!phone.value.trim()){alert('请完整填写账号、姓名和电话');return}var u={account:account.value.trim(),name:name.value.trim(),phone:phone.value.trim(),role:role.value,enabled:edit>=0?users[edit].enabled:true};if(edit>=0)users[edit]=u;else users.push(u);closeEditor();render()}function toggle(i){users[i].enabled=!users[i].enabled;render()}function loginAs(i){if(!users[i].enabled){alert('该账号已停用');return}localStorage.setItem('currentClientUser',JSON.stringify(users[i]));alert('已切换当前登录人为：'+users[i].name+'\n新建采购订单将自动带出其姓名和电话。')}render();
</script></body></html>
