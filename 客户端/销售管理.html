<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>销售管理 - 元象农产品买家工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;background:#f5f5f5;color:#333;font-size:14px;min-height:100vh}.top-nav{height:56px;background:#2BA471;color:#fff;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:100}.top-nav-left,.top-nav-right{display:flex;align-items:center;gap:16px}.top-nav-right{margin-left:auto}.brand-logo{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:4px;display:grid;place-items:center;font-weight:600}.brand-name{font-size:16px;font-weight:600}.brand-sub{font-size:13px;color:rgba(255,255,255,.85);padding-left:12px;border-left:1px solid rgba(255,255,255,.3)}.account{position:relative;cursor:pointer;padding:6px 10px}.account-menu{display:none;position:absolute;right:0;top:100%;background:#fff;color:#333;min-width:140px;padding:8px;box-shadow:0 4px 12px #0002}.account:hover .account-menu{display:block}.layout{display:flex;min-height:calc(100vh - 56px)}.main{flex:1;padding:18px;overflow:auto}.breadcrumb{font-size:13px;color:#999;margin-bottom:14px}.breadcrumb a{color:#2BA471;text-decoration:none}.page-head,.card{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.page-head{padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}.title{font-size:18px;font-weight:600}.desc{font-size:13px;color:#999;margin-top:5px}.btn{padding:7px 16px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;color:#666;cursor:pointer;font-size:13px}.btn-primary{background:#2BA471;border-color:#2BA471;color:#fff}.btn:hover{filter:brightness(.97)}.card{padding:18px 20px}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select,.field input,.field select{height:32px;border:1px solid #d9d9d9;border-radius:4px;padding:6px 10px;font:inherit;min-width:140px}.filters input:focus,.field input:focus,.field select:focus{outline:none;border-color:#2BA471}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.count{color:#999;font-size:13px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{background:#fafafa;color:#666;font-weight:500;text-align:left;padding:11px 10px;border-bottom:1px solid #eee}td{padding:12px 10px;border-bottom:1px solid #f0f0f0}tr:hover td{background:#fbfefc}.link{color:#2BA471;cursor:pointer}.status{display:inline-block;padding:3px 8px;border-radius:12px;background:#f6ffed;color:#389e0d}.empty{padding:45px;text-align:center;color:#999}.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;align-items:center;justify-content:center;padding:20px}.modal-mask.open{display:flex}.modal{width:min(900px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:6px;box-shadow:0 8px 28px #0003}.modal-head{padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600}.modal-close{border:0;background:none;font-size:22px;color:#999;cursor:pointer}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}.field{display:flex;align-items:center;gap:10px}.field.full{grid-column:1/-1}.field label{width:90px;flex-shrink:0;text-align:right;color:#666;font-size:13px}.field input,.field select{flex:1;min-width:0}.section-title{grid-column:1/-1;font-size:15px;font-weight:600;padding:10px 0 0;border-top:1px solid #eee}.items-editor{grid-column:1/-1;overflow:auto}.items-editor table{min-width:760px}.items-editor input{width:100%;min-width:70px}.items-editor .btn{padding:4px 10px}.modal-foot{padding:14px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}.toast{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:500;background:#fff;padding:11px 20px;border:1px solid #b7eb8f;color:#389e0d;border-radius:4px;box-shadow:0 4px 12px #0002}.toast.show{display:block}@media(max-width:900px){.table-wrap{overflow:auto}.form-grid{grid-template-columns:1fr}.field.full,.section-title,.items-editor{grid-column:auto}}
</style>
</head>
<body>
<header class="top-nav"><div class="top-nav-left"><div class="brand-logo">元</div><div class="brand-name">元象农产品</div><div class="brand-sub">买家工作台</div></div><div class="top-nav-right"><span>🔔</span><div class="account">超级管理员 ▾<div class="account-menu">账号信息<br><br>退出登录</div></div></div></header>
<div class="layout"><div id="sidebar-container"></div><main class="main">
<div class="breadcrumb"><a href="鸡蛋-订货单列表.html">首页</a>　/　<span>销售管理</span></div>
<section class="page-head"><div><div class="title">销售管理</div><div class="desc">维护本企业的销售订单信息，保存后同步至平台销售订单。</div></div><button class="btn btn-primary" onclick="openEditor()">＋ 新增销售订单</button></section>
<section class="card"><div class="filters"><input id="qNo" placeholder="销售订单号"><input id="qContact" placeholder="联系人"><select id="qStatus"><option value="">全部订单状态</option><option>待确认</option><option>已确认</option><option>收货完成</option></select><button class="btn btn-primary" onclick="renderRows()">查询</button><button class="btn" onclick="resetFilters()">重置</button></div>
<div class="toolbar"><div class="title" style="font-size:15px">销售订单列表 <span class="count" id="rowCount"></span></div><span class="count">仅展示当前客户所属订单</span></div>
<div class="table-wrap"><table><thead><tr><th>订单号</th><th>客户名称</th><th>联系人</th><th>联系电话</th><th>订单金额</th><th>付款条款</th><th>支付状态</th><th>订单状态</th><th>交货状态</th><th>下单日期</th><th>操作</th></tr></thead><tbody id="salesRows"></tbody></table></div></section>
</main></div>
<div class="modal-mask" id="editorMask" onclick="if(event.target===this)closeEditor()"><div class="modal"><div class="modal-head"><span id="editorTitle">新增销售订单</span><button class="modal-close" aria-label="关闭" onclick="closeEditor()">×</button></div><div class="modal-body"><div class="form-grid">
<div class="field"><label>订单号</label><input id="fNo" placeholder="保存后自动生成"></div><div class="field"><label>客户名称</label><input id="fCustomer" value="平原县蛋鸡养殖合作社"></div><div class="field"><label>联系人</label><input id="fContact" value="王志远"></div><div class="field"><label>收货人</label><input id="fReceiver" value="王志远"></div><div class="field"><label>联系电话</label><input id="fPhone" value="13905310001"></div><div class="field"><label>收货电话</label><input id="fReceiverPhone" value="13905310001"></div><div class="field full"><label>收货地址</label><input id="fAddress" value="山东省德州市平原县鸡蛋产业园3号仓"></div><div class="field"><label>付款条款</label><select id="fTerms"><option>immediate</option><option>15 days</option><option>30 days</option><option>60 days</option></select></div><div class="field"><label>下单日期</label><input id="fDate" type="date" value="2026-11-20"></div><div class="field full"><label>备注</label><input id="fRemark" placeholder="请输入订单备注"></div><div class="section-title">订单明细</div><div class="items-editor"><table><thead><tr><th>物料编码</th><th>产品名称</th><th>规格型号</th><th>品牌</th><th>数量</th><th>单位</th><th>单价</th><th>税率</th><th>含税金额</th><th>操作</th></tr></thead><tbody id="itemRows"></tbody></table><button class="btn" type="button" onclick="addItemRow()">＋ 添加商品</button></div>
</div></div><div class="modal-foot"><button class="btn" onclick="closeEditor()">取消</button><button class="btn btn-primary" onclick="saveOrder()">保存并同步</button></div></div></div><div class="toast" id="toast"></div>
<script src="sidebar.js"></script><script>
var salesOrders=[
{no:'SO-C-0003',customer:'平原县蛋鸡养殖合作社',contact:'王志远',phone:'13905310001',amount:6420.50,terms:'immediate',pay:'未支付',status:'待确认',delivery:'未发货',date:'2026-11-18',receiver:'王志远',receiverPhone:'13905310001',address:'山东省德州市平原县鸡蛋产业园3号仓',remark:'请按期交货',items:[{code:'EGG-001',name:'鲜鸡蛋',spec:'红壳鸡蛋 30枚/箱',brand:'海赋优选',qty:50,unit:'箱',price:128.41,tax:0}]},
{no:'SO-C-0002',customer:'平原县蛋鸡养殖合作社',contact:'王志远',phone:'13905310001',amount:18500,terms:'30 days',pay:'部分支付',status:'已确认',delivery:'部分发货',date:'2026-11-12',receiver:'王志远',receiverPhone:'13905310001',address:'山东省德州市平原县鸡蛋产业园3号仓',remark:'分批配送',items:[{code:'EGG-001',name:'鲜鸡蛋',spec:'红壳鸡蛋 30枚/箱',brand:'海赋优选',qty:100,unit:'箱',price:185,tax:0}]},
{no:'SO-C-0001',customer:'平原县蛋鸡养殖合作社',contact:'王志远',phone:'13905310001',amount:32800,terms:'60 days',pay:'全额支付',status:'收货完成',delivery:'全部发货',date:'2026-11-03',receiver:'王志远',receiverPhone:'13905310001',address:'山东省德州市平原县鸡蛋产业园3号仓',remark:'—',items:[{code:'EGG-001',name:'鲜鸡蛋',spec:'红壳鸡蛋 30枚/箱',brand:'海赋优选',qty:200,unit:'箱',price:164,tax:0}]}
];var editingIndex=-1;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function renderRows(){var no=document.getElementById('qNo').value.trim().toLowerCase(),contact=document.getElementById('qContact').value.trim().toLowerCase(),status=document.getElementById('qStatus').value;var rows=salesOrders.filter(function(o){return (!no||o.no.toLowerCase().includes(no))&&(!contact||o.contact.toLowerCase().includes(contact))&&(!status||o.status===status)});document.getElementById('rowCount').textContent='共 '+rows.length+' 条';document.getElementById('salesRows').innerHTML=rows.length?rows.map(function(o){var idx=salesOrders.indexOf(o);return '<tr><td>'+esc(o.no)+'</td><td>'+esc(o.customer)+'</td><td>'+esc(o.contact)+'</td><td>'+esc(o.phone)+'</td><td>¥ '+Number(o.amount).toLocaleString('zh-CN',{minimumFractionDigits:2})+'</td><td>'+esc(o.terms)+'</td><td>'+esc(o.pay)+'</td><td><span class="status">'+esc(o.status)+'</span></td><td>'+esc(o.delivery)+'</td><td>'+esc(o.date)+'</td><td><a class="link" onclick="openEditor('+idx+')">编辑</a></td></tr>'}).join(''):'<tr><td colspan="11" class="empty">暂无符合条件的销售订单</td></tr>'}
function addItemRow(item){item=item||{code:'',name:'',spec:'',brand:'',qty:1,unit:'',price:0,tax:0};var tr=document.createElement('tr');tr.innerHTML='<td><input data-key="code" value="'+esc(item.code)+'"></td><td><input data-key="name" value="'+esc(item.name)+'"></td><td><input data-key="spec" value="'+esc(item.spec)+'"></td><td><input data-key="brand" value="'+esc(item.brand)+'"></td><td><input data-key="qty" type="number" min="1" step="1" value="'+esc(item.qty)+'"></td><td><input data-key="unit" value="'+esc(item.unit)+'"></td><td><input data-key="price" type="number" min="0" step="0.01" value="'+esc(item.price)+'"></td><td><input data-key="tax" type="number" min="0" max="100" step="1" value="'+esc(item.tax)+'"></td><td class="item-amount">—</td><td><button class="btn" type="button" onclick="this.closest(\'tr\').remove();updateTotal()">删除</button></td>';document.getElementById('itemRows').appendChild(tr);tr.querySelectorAll('input').forEach(function(input){input.addEventListener('input',function(){updateItemAmount(tr);updateTotal()})});updateItemAmount(tr)}
function updateItemAmount(tr){var qty=Number(tr.querySelector('[data-key="qty"]').value)||0,price=Number(tr.querySelector('[data-key="price"]').value)||0,tax=Number(tr.querySelector('[data-key="tax"]').value)||0;tr.querySelector('.item-amount').textContent='¥ '+(qty*price*(1+tax/100)).toFixed(2)}
function updateTotal(){var total=Array.from(document.querySelectorAll('#itemRows tr')).reduce(function(sum,tr){return sum+(Number(tr.querySelector('[data-key="qty"]').value)||0)*(Number(tr.querySelector('[data-key="price"]').value)||0)*(1+(Number(tr.querySelector('[data-key="tax"]').value)||0)/100)},0);document.getElementById('fAmount').value=total?total.toFixed(2):''}
function openEditor(index){editingIndex=typeof index==='number'?index:-1;var o=editingIndex>=0?salesOrders[editingIndex]:{no:'',customer:'平原县蛋鸡养殖合作社',contact:'王志远',phone:'13905310001',amount:'',terms:'immediate',date:'2026-11-20',receiver:'王志远',receiverPhone:'13905310001',address:'山东省德州市平原县鸡蛋产业园3号仓',remark:'',items:[]};document.getElementById('editorTitle').textContent=editingIndex>=0?'编辑销售订单':'新增销售订单';[['fNo','no'],['fCustomer','customer'],['fContact','contact'],['fReceiver','receiver'],['fPhone','phone'],['fReceiverPhone','receiverPhone'],['fAddress','address'],['fTerms','terms'],['fDate','date'],['fRemark','remark']].forEach(function(pair){document.getElementById(pair[0]).value=o[pair[1]]||''});document.getElementById('itemRows').innerHTML='';(o.items||[]).forEach(addItemRow);if(!o.items||!o.items.length)addItemRow();document.getElementById('fAmount').value=o.amount||'';document.getElementById('editorMask').classList.add('open')}
function closeEditor(){document.getElementById('editorMask').classList.remove('open')}
function saveOrder(){var customer=document.getElementById('fCustomer').value.trim(),contact=document.getElementById('fContact').value.trim(),phone=document.getElementById('fPhone').value.trim(),receiver=document.getElementById('fReceiver').value.trim(),receiverPhone=document.getElementById('fReceiverPhone').value.trim(),address=document.getElementById('fAddress').value.trim(),items=Array.from(document.querySelectorAll('#itemRows tr')).map(function(tr){var item={};tr.querySelectorAll('[data-key]').forEach(function(input){item[input.dataset.key]=input.type==='number'?Number(input.value):input.value.trim()});return item}),amount=items.reduce(function(sum,item){return sum+item.qty*item.price*(1+item.tax/100)},0);if(!customer||!contact||!phone||!receiver||!receiverPhone||!address||!items.length||items.some(function(item){return !item.name||!item.qty||item.qty<1||item.price<0})){toast('请补全客户、联系人、收货信息及有效商品明细');return}var o={no:document.getElementById('fNo').value.trim()||('SO-C-'+String(Date.now()).slice(-6)),customer:customer,contact:contact,phone:phone,receiver:receiver,receiverPhone:receiverPhone,address:address,remark:document.getElementById('fRemark').value.trim(),items:items,amount:amount,terms:document.getElementById('fTerms').value,pay:'未支付',status:'待确认',delivery:'未发货',date:document.getElementById('fDate').value};if(editingIndex>=0){o.pay=salesOrders[editingIndex].pay;o.status=salesOrders[editingIndex].status;o.delivery=salesOrders[editingIndex].delivery;salesOrders[editingIndex]=o}else salesOrders.unshift(o);closeEditor();renderRows();toast('销售订单已保存并同步至平台销售订单')}
function resetFilters(){['qNo','qContact'].forEach(function(id){document.getElementById(id).value='' });document.getElementById('qStatus').value='';renderRows()}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2200)}
renderRows();
</script></body></html>
