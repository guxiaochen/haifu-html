<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品详情 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh;
        }

        /* ===== 顶部导航 ===== */
        .top-nav {
            height: 56px; background: #fff; color: #333;
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .top-nav-icon { cursor: pointer; color: #666; position: relative; font-size: 18px; padding: 6px; border-radius: 4px; }
        .top-nav-icon:hover { background: #f5f5f5; color: #2BA471; }
        .top-nav-icon .badge {
            position: absolute; top: 2px; right: 2px;
            background: #ff4d4f; color: #fff; font-size: 11px;
            min-width: 16px; height: 16px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
        }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; color: #333; }
        .account:hover { background: #f5f5f5; }
        .account-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #2BA471, #5BC09F);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
        }

        /* ===== 左右分栏 ===== */
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #f0f0f0; flex-shrink: 0; padding: 12px 0; }
        .menu-item { padding: 10px 24px 10px 48px; color: #666; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
        .menu-item:hover { background: #f5f5f5; color: #2BA471; }
        .menu-item.active { color: #2BA471; border-left-color: #2BA471; background: #f0faf5; font-weight: 500; }
        .menu-group-title { padding: 10px 20px; color: #333; font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .menu-group-title:first-of-type { margin-top: 4px; }
        .menu-group-icon { font-size: 16px; width: 20px; text-align: center; }

        /* 右侧主内容 */
        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }

        /* 面包屑 */
        .breadcrumb-bar {
            background: #fff; padding: 12px 20px;
            border-radius: 4px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar a:hover { color: #2BA471; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        /* 页面标题卡片 */
        .title-card {
            background: #fff; padding: 14px 20px;
            border-radius: 4px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 12px;
        }
        .title-card .page-title { font-size: 18px; font-weight: 600; color: #333; }
        .title-card .title-actions { margin-left: auto; display: flex; gap: 8px; }

        /* 按钮 */
        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: all .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }

        /* 内容卡片 */
        .content-card {
            background: #fff; padding: 24px;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            margin-bottom: 12px;
        }
        .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }

        /* 表单网格 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 80px;
        }
        .form-item { display: flex; align-items: flex-start; gap: 16px; }
        .form-item.full { grid-column: span 2; }
        .form-label {
            min-width: 90px; color: #999; font-size: 13px;
            text-align: right; flex-shrink: 0; line-height: 32px;
        }
        .form-value { color: #333; font-size: 13px; line-height: 32px; }
        .stock-period-value { color: #333; font-size: 13px; line-height: 32px; }
        .product-image-view { width: 72px; height: 72px; display: inline-flex; align-items: center; justify-content: center; background: #f5f7fa; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 30px; overflow: hidden; vertical-align: middle; }
        .product-image-view img { width: 100%; height: 100%; object-fit: cover; }

        /* 状态标签 */
        .tag {
            display: inline-block; padding: 2px 10px;
            border-radius: 10px; font-size: 12px; font-weight: 500;
        }
        .tag-real { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
        .tag-virtual { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
        .supplier-card { margin-top: 12px; }
        .supplier-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .supplier-toolbar .card-title { margin: 0; padding: 0; border: 0; }
        .supplier-toolbar .btn { margin-left: auto; }
        .supplier-table-wrap { width: 100%; overflow: hidden; }
        .supplier-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        .supplier-table th { background: #fafafa; color: #666; font-weight: 500; white-space: normal; word-break: break-all; }
        .supplier-table th, .supplier-table td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; text-align: left; word-break: break-all; overflow-wrap: anywhere; }
        .supplier-table td { color: #333; }
        .supplier-table .price { font-family: monospace; }
        .supplier-table input, .supplier-table select { width: 100%; min-width: 0; max-width: 100%; padding: 6px 5px; border: 1px solid #d9d9d9; border-radius: 2px; font: inherit; }
        .supplier-table .edit-actions { white-space: nowrap; }
        .supplier-table .edit-actions .link { display: inline-block; margin-right: 10px; }
        .supplier-table .edit-actions .link:last-child { margin-right: 0; }
        .supplier-empty { padding: 28px; text-align: center; color: #999; }

    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">

        <div class="top-nav-icon" title="消息">🔔<span class="badge">13</span></div>
        <div class="account">
            <div class="account-avatar">A</div>
            <div>Administrator</div>
        </div>
    </div>
</div>

<div class="layout">
    <div id="sidebar-container"></div>

    <main class="main">
        <!-- 面包屑 -->
        <div class="breadcrumb-bar">
            <span>🏠</span>
            <a onclick="location.href='产品库.html'">首页</a>
            <span class="sep">/</span>
            <a onclick="location.href='产品库.html'">产品管理</a>
            <span class="sep">/</span>
            <a onclick="location.href='产品库.html'">产品库</a>
            <span class="sep">/</span>
            <span class="current">产品详情</span>
        </div>

        <!-- 标题卡片 -->
        <div class="title-card">
            <div class="page-title">产品详情</div>
            <div class="title-actions">
                <button class="btn" onclick="location.href='产品库.html'">返回</button>
                <button class="btn btn-primary" onclick="location.href='产品编辑.html?code=' + getParam('code')">编辑</button>
            </div>
        </div>

        <!-- 基本信息 -->
        <div class="content-card">
            <div class="card-title">基本信息</div>
            <div class="form-grid">
                <div class="form-item">
                    <label class="form-label">产品编码</label>
                    <span class="form-value" id="v-code">00000442</span>
                </div>
                <div class="form-item">
                    <label class="form-label">产品名称</label>
                    <span class="form-value" id="v-name">卷门遮挡布</span>
                </div>
                <div class="form-item">
                    <label class="form-label">产品图片</label>
                    <span class="form-value"><span class="product-image-view" id="v-image">📦</span></span>
                </div>
                <div class="form-item">
                    <label class="form-label">颜色</label>
                    <span class="form-value" id="v-color">—</span>
                </div>
                <div class="form-item">
                    <label class="form-label">规格</label>
                    <span class="form-value" id="v-spec">卷门800*250MM</span>
                </div>
                <div class="form-item">
                    <label class="form-label">品牌</label>
                    <span class="form-value" id="v-brand">—</span>
                </div>
                <div class="form-item">
                    <label class="form-label">等级</label>
                    <span class="form-value" id="v-grade">—</span>
                </div>
                <div class="form-item">
                    <label class="form-label">销售价</label>
                    <span class="form-value" id="v-price">¥ 225.00</span>
                </div>
                <div class="form-item">
                    <label class="form-label">税率</label>
                    <span class="form-value" id="v-tax">13%</span>
                </div>
                <div class="form-item">
                    <label class="form-label">计量单位</label>
                    <span class="form-value" id="v-unit">个</span>
                </div>
                <div class="form-item">
                    <label class="form-label">产品类型</label>
                    <span class="form-value" id="v-type">所有产品</span>
                </div>
                <div class="form-item full">
                    <label class="form-label">备注</label>
                    <span class="form-value" id="v-remark">—</span>
                </div>
            </div>
        </div>

        <div class="content-card supplier-card">
            <div class="supplier-toolbar">
                <div class="card-title">供应商采购明细</div>
                <button class="btn btn-primary" type="button" onclick="window.addSupplierDetail()">+ 新增采购明细</button>
            </div>
            <div class="supplier-table-wrap">
                <table class="supplier-table">
                    <thead><tr><th>供应商</th><th>供应商产品名称</th><th>开始日期</th><th>结束日期</th><th>当前库存数量</th><th>单位</th><th>采购价</th><th>产品备货期</th><th>操作</th></tr></thead>
                    <tbody id="supplier-detail-list"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    var supplierDetails = [
        { supplier: 'aqtest海赋（山东）数字产业发展有限公司HZ', code: 'HZ-000442', name: '卷门遮挡布', start: '', end: '', stock: 0, unit: '个', price: 200, currency: 'CNY' },
        { supplier: 'aqtest海赋（山东）数字产业发展有限公司LL', code: 'LL-000442', name: '卷门遮挡布', start: '', end: '', stock: 0, unit: '个', price: 50, currency: 'CNY' }
    ];
    function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (char) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
    }
    function supplierOptions(selected) {
        var names = ['aqtest海赋（山东）数字产业发展有限公司HZ', 'aqtest海赋（山东）数字产业发展有限公司LL', '青岛海尔智能家电有限公司', '菏泽牡丹食品加工厂'];
        return '<option value="">请选择供应商</option>' + names.map(function (name) {
            return '<option value="' + escapeHtml(name) + '"' + (name === selected ? ' selected' : '') + '>' + escapeHtml(name) + '</option>';
        }).join('');
    }
    function renderSupplierDetails() {
        var list = document.getElementById('supplier-detail-list');
        if (!supplierDetails.length) { list.innerHTML = '<tr><td colspan="8" class="supplier-empty">暂无供应商采购明细</td></tr>'; return; }
        list.innerHTML = supplierDetails.map(function (item, index) {
            return '<tr><td>' + escapeHtml(item.supplier) + '</td><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.start || '—') + '</td><td>' + escapeHtml(item.end || '—') + '</td><td>' + Math.trunc(Number(item.stock || 0)) + '</td><td>' + escapeHtml(item.unit) + '</td><td class="price">' + Number(item.price || 0).toFixed(2) + '</td><td>' + escapeHtml(item.stockDays ? item.stockDays + '天' : '—') + '</td><td class="edit-actions"><a class="link" href="javascript:void(0)" onclick="window.editSupplierDetail(' + index + ')">编辑</a><a class="link" href="javascript:void(0)" onclick="window.removeSupplierDetail(' + index + ')">删除</a></td></tr>';
        }).join('');
    }
    function editSupplierDetail(index) {
        var item = supplierDetails[index];
        if (!item) return;
        var row = document.getElementById('supplier-detail-list').rows[index];
        row.innerHTML = '<td><select class="supplier-input">' + supplierOptions(item.supplier) + '</select></td>' +
            '<td><input class="supplier-input" value="' + escapeHtml(item.name) + '"></td>' +
            '<td><input class="supplier-input" type="date" value="' + escapeHtml(item.start) + '"></td>' +
            '<td><input class="supplier-input" type="date" value="' + escapeHtml(item.end) + '"></td>' +
            '<td><input class="supplier-input" type="number" min="0" step="1" value="' + Math.trunc(Number(item.stock || 0)) + '"></td>' +
            '<td><input class="supplier-input" value="' + escapeHtml(item.unit) + '"></td>' +
            '<td><input class="supplier-input" type="number" min="0" step="0.01" value="' + Number(item.price || 0) + '"></td>' +
            '<td><div class="stock-period"><select class="supplier-input"><option value="3">3天</option><option value="7"' + (Number(item.stockDays || 7) === 7 ? ' selected' : '') + '>7天</option><option value="14">14天</option><option value="30">一个月</option><option value="custom">自定义</option></select><input class="supplier-input stock-days-input" type="number" min="1" value="' + Number(item.stockDays || 7) + '" placeholder="天数"></div></td>' +
            '<td class="edit-actions"><a class="link" href="javascript:void(0)" onclick="window.saveSupplierRow(' + index + ', this)">保存</a><a class="link" href="javascript:void(0)" onclick="window.renderSupplierDetails()">取消</a></td>';
    }
    function saveSupplierRow(index, link) {
        var row = link.closest('tr');
        var fields = row.querySelectorAll('.supplier-input');
        if (!fields[0].value.trim()) { alert('请选择供应商'); return; }
        if (!fields[1].value.trim()) { alert('请输入供应商产品名称'); return; }
        supplierDetails[index] = {
            supplier: fields[0].value,
            name: fields[1].value.trim(),
            start: fields[2].value,
            end: fields[3].value,
            stock: Number(fields[4].value) || 0,
            unit: fields[5].value.trim() || '个',
            price: Number(fields[6].value) || 0,
            stockDays: Number(fields[8].value) || 7
        };
        renderSupplierDetails();
    }
    function supplierForm(item) {
        var value = item || { supplier: '', name: '', start: '', end: '', stock: 0, unit: '个', price: '' };
        var text = '供应商：' + value.supplier + '\n供应商产品名称：' + value.name + '\n开始日期（可空）：' + value.start + '\n结束日期（可空）：' + value.end + '\n当前库存数量：' + value.stock + '\n单位：' + value.unit + '\n采购价：' + value.price;
        return prompt('请按以下顺序填写，字段之间使用“|”分隔：\n供应商|供应商产品名称|开始日期|结束日期|当前库存数量|单位|采购价\n\n当前内容：\n' + text, [value.supplier, value.name, value.start, value.end, value.stock, value.unit, value.price].join('|'));
    }
    function saveSupplierDetail(index) {
        var raw = supplierForm(index === undefined ? null : supplierDetails[index]);
        if (raw === null) return;
        var parts = raw.split('|');
        if (parts.length < 7 || !parts[0].trim()) { alert('请至少填写供应商，并按格式录入完整采购明细'); return; }
        supplierDetails[index === undefined ? supplierDetails.length : index] = { supplier: parts[0].trim(), name: parts[1].trim(), start: parts[2].trim(), end: parts[3].trim(), stock: Number(parts[4]) || 0, unit: parts[5].trim() || '个', price: Number(parts[6]) || 0 };
        renderSupplierDetails();
    }
    function addSupplierDetail() { saveSupplierDetail(); }
    function removeSupplierDetail(index) { if (confirm('确定删除这条供应商采购明细吗？')) { supplierDetails.splice(index, 1); renderSupplierDetails(); } }

    function getParam(name) {
        var reg = new RegExp('[?&]' + name + '=([^&]*)');
        var m = location.search.match(reg);
        return m ? decodeURIComponent(m[1]) : '';
    }

    // 预置产品数据（与列表页一致）
    var products = {
        '00000442': { code:'00000442', name:'卷门遮挡布', color:'', spec:'卷门800*250MM', brand:'', grade:'', company:'', price:225.00, unit:'个', type:'所有产品', stockDays:7, remark:'', tax:13 },
        '00000443': { code:'00000443', name:'灭火器', color:'', spec:'二氯化碳', brand:'', grade:'', company:'', price:70.00, unit:'个', type:'所有产品', template:'', remark:'', tax:13 },
        '00000111': { code:'00000111', name:'载手套', color:'', spec:'', brand:'君聪', grade:'', company:'', price:125.00, unit:'双', type:'所有产品', template:'', remark:'', tax:13 },
        '00000151': { code:'00000151', name:'HONEYWELL/霍尼韦尔 首罩... 黄色', color:'黄色', spec:'VIS110', brand:'HONEYWELL...', grade:'', company:'', price:215.39, unit:'个', type:'所有产品 / 劳保商品 / 零力矩...', template:'', remark:'', tax:13 },
        '00000020': { code:'00000020', name:'咬达咬口器', color:'', spec:'SOS', brand:'世达', grade:'', company:'', price:1.00, unit:'个', type:'所有产品', template:'', remark:'', tax:13 },
        '00000009': { code:'00000009', name:'ABB防爆排风扇', color:'', spec:'D171S248BCPF29 DC24V', brand:'国产', grade:'', company:'', price:1.00, unit:'个', type:'所有产品', template:'', remark:'', tax:13 },
        '00000112': { code:'00000112', name:'安全带', color:'', spec:'全身式', brand:'凯捷', grade:'', company:'', price:125.00, unit:'条', type:'所有产品', template:'', remark:'', tax:13 },
        '00000828': { code:'00000828', name:'YMD/海美博 迷彩防棉服', color:'', spec:'ZW5C0004 L5L 51+58+32cm', brand:'YMD/海美博', grade:'', company:'', price:71.48, unit:'个', type:'所有产品 / 商品存储 / 劳保服...', template:'', remark:'', tax:13 },
        '00000057': { code:'00000057', name:'网卡', color:'黄色', spec:'16 寸', brand:'GB/戴格斯', grade:'A', company:'', price:79.00, unit:'件', type:'所有产品', template:'', remark:'', tax:13 },
        '00000113': { code:'00000113', name:'围裙', color:'', spec:'12G', brand:'三泰', grade:'', company:'', price:125.00, unit:'个', type:'所有产品', template:'', remark:'', tax:13 },
        '00000264': { code:'00000264', name:'东成 充电式刷柄割草机', color:'', spec:'14V', brand:'DGPR1435LFS', grade:'东成', company:'', price:607.84, unit:'个', type:'所有产品 / 五金工具 / 电动工...', template:'', remark:'', tax:13 },
        '00000037': { code:'00000037', name:'卫生纸', color:'', spec:'4X100', brand:'原木', grade:'', company:'', price:1.00, unit:'包', type:'所有产品', template:'', remark:'', tax:13 },
