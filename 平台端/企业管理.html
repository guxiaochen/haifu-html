<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营企业管理 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh; }
        .top-nav { height: 56px; background: #fff; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#2BA471,#5BC09F); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .brand-name { font-size: 16px; font-weight: 600; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; }
        .account { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .account-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#2BA471,#5BC09F); color: #fff; display: flex; align-items: center; justify-content: center; }
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar { background: #fff; padding: 12px 20px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .home-icon { color: #2BA471; } .sep { color: #d9d9d9; } .current { color: #333; font-weight: 500; }
        .filter-card, .table-card { background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .filter-card { padding: 20px; margin-bottom: 12px; }
        .filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select { min-width: 180px; padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 2px; outline: none; font-size: 13px; }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }
        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { color: #fff; background: #2BA471; border-color: #2BA471; }
        .btn-primary:hover { color: #fff; background: #229963; border-color: #229963; }
        .table-card { padding: 16px 20px; }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; }
        .count { color: #999; font-size: 13px; font-weight: 400; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { background: #fafafa; }
        th { padding: 10px 12px; text-align: left; color: #555; font-weight: 500; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        td { padding: 12px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
        tbody tr:hover { background: #fafdfb; }
        .company-name { color: #2BA471; cursor: pointer; font-weight: 500; }
        .muted { color: #999; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 12px; border: 1px solid; }
        .tag-ok { background: #f6ffed; color: #52c41a; border-color: #b7eb8f; }
        .tag-stop { background: #fff1f0; color: #ff4d4f; border-color: #ffa39e; }
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 10px; white-space: nowrap; }
        .link:hover { text-decoration: underline; }
        .link-stop { color: #ff4d4f; }
        .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; color: #666; font-size: 13px; }
        .page-btn { min-width: 28px; height: 28px; padding: 0 8px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; }
        .page-btn.active { color: #fff; background: #2BA471; border-color: #2BA471; }
        .modal-mask { position: fixed; inset: 0; z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding-top: 52px; background: rgba(0,0,0,.45); }
        .modal-mask.show { display: flex; }
        .modal { width: 720px; max-height: calc(100vh - 104px); overflow-y: auto; background: #fff; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,.15); }
        .modal.small { width: 440px; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #f0f0f0; }
        .modal-title { font-size: 15px; font-weight: 600; }
        .modal-close { color: #999; font-size: 20px; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: #333; }
        .modal-body { padding: 20px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid #f0f0f0; }
        .section-title { margin-bottom: 14px; padding-left: 9px; border-left: 3px solid #2BA471; font-size: 14px; font-weight: 600; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
        .form-row { display: flex; flex-direction: column; gap: 5px; }
        .form-row.full { grid-column: 1 / -1; }
        .form-row label { color: #666; font-size: 13px; }
        .req { color: #ff4d4f; }
        .form-row input, .form-row select { width: 100%; padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 2px; outline: none; font-size: 13px; }
        .form-row input:focus, .form-row select:focus { border-color: #2BA471; }
        .address-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
        .detail-item { display: grid; grid-template-columns: 112px 1fr; gap: 12px; min-height: 42px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .detail-label { color: #999; } .detail-value { color: #333; word-break: break-all; }
        .confirm-text { color: #555; line-height: 1.8; }
        .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 2000; display: none; padding: 10px 18px; border-radius: 4px; background: #f0faf5; color: #237b55; border: 1px solid #a7dfc5; box-shadow: 0 3px 12px rgba(0,0,0,.08); }
        .toast.show { display: block; }
        .error-text { color: #ff4d4f; min-height: 18px; margin-top: 6px; font-size: 12px; }
    </style>
</head>
<body>
<div class="top-nav">
    <div class="brand"><div class="brand-logo">叶</div><div class="brand-name">运营管理平台</div></div>
    <div class="top-nav-right"><div class="account"><div class="account-avatar">A</div><span>Administrator</span></div></div>
</div>
<div class="layout">
    <div id="sidebar-container"></div>
    <main class="main">
        <div class="breadcrumb-bar"><span class="home-icon">🏠</span><span>首页</span><span class="sep">/</span><span>系统管理</span><span class="sep">/</span><span class="current">运营企业管理</span></div>
        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item"><label>企业名称</label><input id="filterName" placeholder="请输入企业名称"></div>
                <div class="filter-item"><label>统一社会信用代码</label><input id="filterCode" placeholder="请输入统一社会信用代码"></div>
                <div class="filter-item"><label>企业状态</label><select id="filterStatus"><option value="">全部</option><option value="enabled">启用</option><option value="disabled">停用</option></select></div>
                <div class="filter-actions"><button class="btn btn-primary" onclick="searchCompanies()">🔍 搜索</button><button class="btn" onclick="resetSearch()">重置</button></div>
            </div>
        </div>
        <div class="table-card">
            <div class="table-toolbar"><div class="table-title">运营企业列表<span class="count" id="companyCount"></span></div><div class="table-toolbar-right"><button class="btn btn-primary" onclick="openEditModal()">+ 新增运营企业</button></div></div>
            <table>
                <thead><tr><th>企业编号</th><th>企业名称</th><th>统一社会信用代码</th><th>法定代表人</th><th>公司电话</th><th>状态</th><th>创建时间</th><th style="width:170px">操作</th></tr></thead>
                <tbody id="companyBody"></tbody>
            </table>
            <div class="pagination"><span id="totalText"></span><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div>
        </div>
    </main>
</div>

<div class="modal-mask" id="editMask">
    <div class="modal">
        <div class="modal-header"><span class="modal-title" id="editTitle">新增运营企业</span><span class="modal-close" onclick="closeModal('editMask')">×</span></div>
        <div class="modal-body">
            <div class="section-title">公司信息</div>
            <div class="form-grid">
                <div class="form-row full"><label>公司名称 <span class="req">*</span></label><input id="mName" placeholder="请输入公司全称"><div class="error-text" id="nameError"></div></div>
                <div class="form-row"><label>统一社会信用代码</label><input id="mCode" maxlength="18" placeholder="请输入18位统一社会信用代码"></div>
                <div class="form-row"><label>法定代表人</label><input id="mLegal" placeholder="请输入法定代表人"></div>
                <div class="form-row full"><label>注册地址</label><div class="address-row"><select id="mProvince"><option value="">请选择省份</option><option>山东省</option><option>江苏省</option><option>广东省</option></select><select id="mCity"><option value="">请选择城市</option><option>济南市</option><option>德州市</option><option>青岛市</option></select><select id="mDistrict"><option value="">请选择区/县</option><option>历下区</option><option>平原县</option><option>市中区</option></select></div></div>
                <div class="form-row full"><label>详细地址</label><input id="mAddress" placeholder="请输入街道、门牌号等"></div>
                <div class="form-row"><label>公司电话</label><input id="mPhone" placeholder="请输入公司电话"></div>
                <div class="form-row"><label>公司邮箱</label><input id="mEmail" type="email" placeholder="请输入公司邮箱"></div>
            </div>
        </div>
        <div class="modal-footer"><button class="btn" onclick="closeModal('editMask')">取消</button><button class="btn btn-primary" onclick="saveCompany()">确定</button></div>
    </div>
</div>

<div class="modal-mask" id="detailMask">
    <div class="modal">
        <div class="modal-header"><span class="modal-title">运营企业详情</span><span class="modal-close" onclick="closeModal('detailMask')">×</span></div>
        <div class="modal-body"><div class="section-title">公司信息</div><div class="detail-grid" id="detailGrid"></div></div>
        <div class="modal-footer"><button class="btn" onclick="closeModal('detailMask')">关闭</button><button class="btn btn-primary" onclick="editFromDetail()">编辑</button></div>
    </div>
</div>

<div class="modal-mask" id="statusMask">
    <div class="modal small">
        <div class="modal-header"><span class="modal-title" id="statusTitle">停用企业</span><span class="modal-close" onclick="closeModal('statusMask')">×</span></div>
        <div class="modal-body"><p class="confirm-text" id="statusText"></p></div>
        <div class="modal-footer"><button class="btn" onclick="closeModal('statusMask')">取消</button><button class="btn btn-primary" onclick="confirmStatus()">确定</button></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script src="sidebar.js"></script>
<script>
var companies = [
    { id: 'ENT000001', name: '海赋农产品运营管理有限公司', code: '91370100MA3XXXXXXX', legal: '张立华', province: '山东省', city: '济南市', district: '历下区', address: '经十路9999号', phone: '0531-88886666', email: 'service@haifu.example', status: 'enabled', createdAt: '2026-09-01 09:20' },
    { id: 'ENT000002', name: '山东元象农产品运营有限公司', code: '91370000MA3YYYYYYY', legal: '李建国', province: '山东省', city: '济南市', district: '市中区', address: '英雄山路88号', phone: '0531-86668888', email: '', status: 'enabled', createdAt: '2026-10-12 11:05' }
];
var filteredCompanies = companies.slice();
var editingId = null;
var detailId = null;
var pendingStatusId = null;

function display(value) { return value || '<span class="muted">—</span>'; }
function renderCompanies() {
    var body = document.getElementById('companyBody');
    body.innerHTML = filteredCompanies.map(function(item) {
        var status = item.status === 'enabled' ? '<span class="tag tag-ok">启用</span>' : '<span class="tag tag-stop">停用</span>';
        var actionText = item.status === 'enabled' ? '停用' : '启用';
        var actionClass = item.status === 'enabled' ? 'link link-stop' : 'link';
        return '<tr>' +
            '<td>' + item.id + '</td>' +
            '<td><span class="company-name" onclick="openDetail(\'' + item.id + '\')">' + item.name + '</span></td>' +
            '<td>' + display(item.code) + '</td><td>' + display(item.legal) + '</td><td>' + display(item.phone) + '</td>' +
            '<td>' + status + '</td><td>' + item.createdAt + '</td>' +
            '<td><a class="link" onclick="openDetail(\'' + item.id + '\')">查看</a><a class="link" onclick="openEditModal(\'' + item.id + '\')">编辑</a>' +
            '<a class="' + actionClass + '" onclick="openStatusModal(\'' + item.id + '\')">' + actionText + '</a></td></tr>';
    }).join('');
    document.getElementById('companyCount').textContent = '共 ' + filteredCompanies.length + ' 家';
    document.getElementById('totalText').textContent = '共 ' + filteredCompanies.length + ' 条';
}

function searchCompanies() {
    var name = document.getElementById('filterName').value.trim().toLowerCase();
    var code = document.getElementById('filterCode').value.trim().toLowerCase();
    var status = document.getElementById('filterStatus').value;
    filteredCompanies = companies.filter(function(item) {
        return (!name || item.name.toLowerCase().indexOf(name) >= 0) && (!code || item.code.toLowerCase().indexOf(code) >= 0) && (!status || item.status === status);
    });
    renderCompanies();
}
function resetSearch() { document.getElementById('filterName').value = ''; document.getElementById('filterCode').value = ''; document.getElementById('filterStatus').value = ''; filteredCompanies = companies.slice(); renderCompanies(); }
function getCompany(id) { return companies.find(function(item) { return item.id === id; }); }
function openEditModal(id) {
    editingId = id || null;
    var item = id ? getCompany(id) : { name:'', code:'', legal:'', province:'', city:'', district:'', address:'', phone:'', email:'' };
    document.getElementById('editTitle').textContent = id ? '编辑运营企业' : '新增运营企业';
    document.getElementById('mName').value = item.name; document.getElementById('mCode').value = item.code; document.getElementById('mLegal').value = item.legal;
    document.getElementById('mProvince').value = item.province; document.getElementById('mCity').value = item.city; document.getElementById('mDistrict').value = item.district;
    document.getElementById('mAddress').value = item.address; document.getElementById('mPhone').value = item.phone; document.getElementById('mEmail').value = item.email;
    document.getElementById('nameError').textContent = '';
    document.getElementById('editMask').classList.add('show');
}
function saveCompany() {
    var name = document.getElementById('mName').value.trim();
    if (!name) { document.getElementById('nameError').textContent = '请输入公司名称'; document.getElementById('mName').focus(); return; }
    var data = { name:name, code:document.getElementById('mCode').value.trim(), legal:document.getElementById('mLegal').value.trim(), province:document.getElementById('mProvince').value, city:document.getElementById('mCity').value, district:document.getElementById('mDistrict').value, address:document.getElementById('mAddress').value.trim(), phone:document.getElementById('mPhone').value.trim(), email:document.getElementById('mEmail').value.trim() };
    if (editingId) { Object.assign(getCompany(editingId), data); showToast('企业信息已更新'); }
    else { data.id = 'ENT' + String(companies.length + 1).padStart(6,'0'); data.status = 'enabled'; data.createdAt = '2026-11-05 09:30'; companies.unshift(data); showToast('运营企业已新增'); }
    closeModal('editMask'); resetSearch();
}
function openDetail(id) {
    detailId = id; var item = getCompany(id);
    var address = [item.province,item.city,item.district,item.address].filter(Boolean).join(' ');
    var rows = [['企业编号',item.id],['公司名称',item.name],['统一社会信用代码',item.code],['法定代表人',item.legal],['注册地址',address],['公司电话',item.phone],['公司邮箱',item.email],['企业状态',item.status === 'enabled' ? '启用' : '停用'],['创建时间',item.createdAt]];
    document.getElementById('detailGrid').innerHTML = rows.map(function(row) { return '<div class="detail-item"><span class="detail-label">' + row[0] + '</span><span class="detail-value">' + (row[1] || '—') + '</span></div>'; }).join('');
    document.getElementById('detailMask').classList.add('show');
}
function editFromDetail() { var id = detailId; closeModal('detailMask'); openEditModal(id); }
function openStatusModal(id) {
    pendingStatusId = id; var item = getCompany(id); var enabling = item.status === 'disabled';
    document.getElementById('statusTitle').textContent = enabling ? '启用企业' : '停用企业';
    document.getElementById('statusText').textContent = enabling ? '确定启用企业“' + item.name + '”吗？' : '确定停用企业“' + item.name + '”吗？停用后企业账号将不能登录。';
    document.getElementById('statusMask').classList.add('show');
}
function confirmStatus() { var item = getCompany(pendingStatusId); item.status = item.status === 'enabled' ? 'disabled' : 'enabled'; closeModal('statusMask'); searchCompanies(); showToast(item.status === 'enabled' ? '企业已启用' : '企业已停用'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showToast(text) { var toast = document.getElementById('toast'); toast.textContent = text; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); },1800); }
renderCompanies();
</script>
</body>
</html>
