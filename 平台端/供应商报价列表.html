      const keyword=document.getElementById('keyword').value.trim().toLowerCase(),selection=displaySelections(),panel=document.getElementById('viewPanel'),workbench=document.querySelector('.workbench');
      document.getElementById('viewNote').style.display='';document.getElementById('statusLabel').style.display='';document.getElementById('submit').textContent='提交采用报价';panel.classList.remove('legacy-product-view');workbench.classList.remove('legacy-product-workbench');
      let html='';products.forEach(function(p,index){const rows=quotes.filter(q=>q.product===p.id),match=!keyword||[p.name,p.code,p.brand].join(' ').toLowerCase().indexOf(keyword)>=0||rows.some(q=>q.supplier.toLowerCase().indexOf(keyword)>=0);if(!match)return;const lowest=Math.min.apply(null,rows.map(quoteTotal)),selected=selection[p.id],adoptedQuote=selected?quoteById(selected):null,lineState=adoptedQuote?'已采用 · '+adoptedQuote.supplier:'待采用',expanded=expandedProducts[p.id] !== undefined ? expandedProducts[p.id] : index===0;html+='<section class="legacy-product" data-product="'+p.id+'"><div class="legacy-phead" onclick="toggleProduct(\''+p.id+'\')"><div><div class="legacy-title">'+p.name+' <span class="legacy-code">'+p.code+'</span><span class="legacy-state '+(adoptedQuote?'adopted':'wait')+'">'+lineState+'</span></div><div class="legacy-meta"><span>排序号 <b>'+p.seq+'</b></span><span>品牌 <b>'+p.brand+'</b></span><span>规格/型号 <b>'+p.spec+'</b></span><span>类别 <b>'+p.category+'</b></span><span>颜色 <b>'+p.color+'</b></span><span>单位 <b>'+p.unit+'</b></span><span>收货地 <b>'+p.destination+'</b></span><span>订购数量 <b>'+p.qty+'</b></span><span>备注 <b>'+p.note+'</b></span></div></div><div class="legacy-summary"><b>¥'+formatMoney(lowest)+'</b><small>最低报价含税总价 · '+rows.length+' 家报价</small></div><span class="legacy-arrow" id="arrow-'+p.id+'">'+(expanded?'⌃':'⌄')+'</span></div><div class="legacy-quotes '+(expanded?'':'hide')+'" id="rows-'+p.id+'">'+rows.map(q=>legacyQuoteRow(q,p)).join('')+'</div></section>';});panel.innerHTML=html||'<div class="empty">未找到匹配的供应商报价</div>';
    }
    function supplierName(id){const q=quotes.find(x=>x.supplierId===id);return q?q.supplier:''}function supplierMeta(id){const q=quotes.find(x=>x.supplierId===id);return q?(q.type==='internal'?'内部供应商':'外部供应商')+' · 联系人：'+q.contact:''}
    function renderSupplierView(){
      const keyword=document.getElementById('keyword').value.trim().toLowerCase(),selection=displaySelections(),readOnly=isReadonly();
      const visibleIds=supplierOrder.filter(function(id){const rows=quotes.filter(q=>q.supplierId===id);return !keyword||supplierName(id).toLowerCase().indexOf(keyword)>=0||rows.some(q=>productById(q.product).name.toLowerCase().indexOf(keyword)>=0)});
      if(!visibleIds.length){document.getElementById('viewPanel').innerHTML='<div class="empty">未找到匹配的供应商报价</div>';return}
      if(visibleIds.indexOf(selectedSupplierId)<0)selectedSupplierId=visibleIds[0];
      const rows=quotes.filter(q=>q.supplierId===selectedSupplierId),selectedCount=rows.filter(q=>selection[q.product]===q.id).length,allSelected=selectedCount===rows.length;
      const nav=visibleIds.map(function(id){const supplierRows=quotes.filter(q=>q.supplierId===id),count=supplierRows.filter(q=>selection[q.product]===q.id).length,typeText=supplierRows[0].type==='external'?'外部供应商':'内部供应商';return '<button class="supplier-nav-item '+(id===selectedSupplierId?'active':'')+'" onclick="selectSupplier(\''+id+'\')"><div class="supplier-nav-name">'+supplierName(id)+'</div><div class="supplier-nav-meta"><span>'+typeText+'</span><span>'+supplierRows.length+' 条报价</span></div><div class="supplier-nav-meta supplier-nav-progress"><span>已选择 '+count+' / '+supplierRows.length+' 条</span></div></button>'}).join('');
      const tableRows=rows.map(function(q){const p=productById(q.product),checked=selection[p.id]===q.id;return '<tr class="'+(checked?'selected-row':'')+'"><td>'+(readOnly?'': '<input class="row-check" type="checkbox" '+(checked?'checked':'')+' onchange="toggleSupplierQuote(\''+q.id+'\',this.checked)">')+'</td><td>'+p.seq+'</td><td>'+p.image+'</td><td>'+p.name+'</td><td>'+p.code+'</td><td>'+p.brand+'</td><td>'+p.spec+'</td><td>'+p.color+'</td><td>'+p.unit+'</td><td>'+p.category+'</td><td>'+p.destination+'</td><td>'+p.qty+'</td><td class="price">¥'+formatMoney(q.unit)+'</td><td>'+q.tax+'%</td><td>¥'+formatMoney(quoteTax(q))+'</td><td class="price">¥'+formatMoney(quoteTotal(q))+'</td><td>'+q.delivery+'</td><td>'+q.valid+'</td><td>'+q.note+'</td><td>'+(checked?'<span class="readonly-tag">'+(readOnly?'已采用':'已选择')+'</span>':(readOnly?'<span class="readonly-tag" style="background:#f2f4f7;color:#667085">未采用</span>':'—'))+'</td></tr>'}).join('');
      document.getElementById('viewPanel').innerHTML='<div class="supplier-split"><aside class="supplier-nav"><div class="supplier-nav-title">参与报价的供应商</div>'+nav+'</aside><section class="supplier-detail"><div class="supplier-detail-head"><div><h2>'+supplierName(selectedSupplierId)+'</h2><p>'+supplierMeta(selectedSupplierId)+' · 当前供应商已报价 '+rows.length+' 条产品明细</p></div>'+(readOnly?'<span class="readonly-tag">只读结果</span>':'<label class="all-select"><input type="checkbox" '+(allSelected?'checked':'')+' onchange="toggleSupplierAll(\''+selectedSupplierId+'\',this.checked)">全选该供应商报价</label>')+'</div><div class="table-wrap"><table class="supplier-table"><thead><tr><th></th><th>序号</th><th>产品图片</th><th>产品名称</th><th>产品编码</th><th>品牌</th><th>规格/型号</th><th>颜色</th><th>单位</th><th>类别</th><th>收货地</th><th>订购数量</th><th>含税单价</th><th>税率</th><th>税额</th><th>含税总价</th><th>承诺交期</th><th>价格有效期</th><th>备注</th><th>结果</th></tr></thead><tbody>'+tableRows+'</tbody></table></div></section></div>';
    }
    function switchView(view){activeView=view;document.getElementById('productTab').classList.toggle('active',view==='product');document.getElementById('supplierTab').classList.toggle('active',view==='supplier');if(view==='supplier'){document.getElementById('viewPanel').classList.remove('legacy-product-view');document.querySelector('.workbench').classList.remove('legacy-product-workbench');document.getElementById('viewNote').style.display='';document.getElementById('statusLabel').style.display='';document.getElementById('submit').textContent='提交采用'}render()}
    function toggleProduct(id){const rows=document.getElementById('rows-'+id),arrow=document.getElementById('arrow-'+id),hide=rows.classList.toggle('hide');expandedProducts[id]=!hide;arrow.textContent=hide?'⌄':'⌃'}
    function selectSupplier(id){selectedSupplierId=id;render()}
    function selectProductQuote(id){if(isReadonly())return;const q=quoteById(id);activeSelections.product[q.product]=id;render()}
    function toggleSupplierQuote(id,checked){if(isReadonly())return;const q=quoteById(id);if(checked)activeSelections.supplier[q.product]=id;else delete activeSelections.supplier[q.product];render()}
    function toggleSupplierAll(supplierId,checked){if(isReadonly())return;quotes.filter(q=>q.supplierId===supplierId).forEach(q=>{if(checked)activeSelections.supplier[q.product]=q.id;else if(activeSelections.supplier[q.product]===q.id)delete activeSelections.supplier[q.product]});render()}
    function activeSelectedQuotes(){const selection=displaySelections();return products.map(p=>quoteById(selection[p.id])).filter(Boolean)}
    function updateFooter(){const selected=activeSelectedQuotes(),count=selected.length,total=selected.reduce((sum,q)=>sum+quoteTotal(q),0),allChosen=count===products.length,canSubmit=!isReadonly()&&allChosen;document.getElementById('count').textContent=count;document.getElementById('lineCount').textContent=products.length;document.getElementById('total').textContent=formatMoney(total);const hint=document.getElementById('hint'),submit=document.getElementById('submit');if(submitted){hint.textContent='已按“'+(submittedView==='product'?'按产品明细比价':'按供应商报价')+'”提交采用结果，两个视图均为只读';submit.textContent='已提交';submit.style.display='';submit.disabled=true}else if(inquiryStatus==='已完成'){hint.textContent='询价已完成，当前页面仅展示最终采用结果';submit.style.display='none'}else{hint.textContent=allChosen?'已完成全部选择，可提交采用结果':'还需选择 '+(products.length-count)+' 条产品明细的供应商报价';submit.style.display='';submit.disabled=!canSubmit}}
    function render(){document.getElementById('statusLabel').textContent=inquiryStatus;const note=document.getElementById('viewNote');if(isReadonly())note.textContent='采用结果已锁定：当前页面仅供查看，不可再选择或提交。';else note.textContent=activeView==='product'?'按产品明细横向比较：每条产品明细只能选择一家供应商报价。':'按供应商汇总查看：可选择单条报价，也可全选某供应商已报价的全部产品明细；同一产品仅保留一条选择。';if(activeView==='product')renderProductView();else renderSupplierView();updateFooter()}
    function filterCurrentView(){render()}
    function openConfirm(){const selected=activeSelectedQuotes();if(selected.length!==products.length)return;document.getElementById('confirmRows').innerHTML=selected.map(q=>{const p=productById(q.product);return '<div class="confirm-row"><span>'+p.seq+' · '+p.name+'（'+p.qty+p.unit+'）</span><span>'+q.supplier+'　¥'+formatMoney(quoteTotal(q))+'</span></div>'}).join('');document.getElementById('confirmTotal').textContent=formatMoney(selected.reduce((sum,q)=>sum+quoteTotal(q),0));document.getElementById('confirmMask').classList.add('show')}
    function closeConfirm(){document.getElementById('confirmMask').classList.remove('show')}
    function submitAdoption(){finalSelections=Object.assign({},activeSelections[activeView]);submitted=true;submittedView=activeView;closeConfirm();render()}
    document.getElementById('confirmMask').addEventListener('click',function(e){if(e.target===this)closeConfirm()});
    document.getElementById('inquiryCrumb').textContent=inquiryNo;document.getElementById('inquiryCrumb').href='平台询价单详情.html?status='+encodeURIComponent(inquiryStatus)+'&inquiry='+encodeURIComponent(inquiryNo);if(inquiryStatus==='已完成'){finalSelections={garlic:'g-a',onion:'o-b'};submitted=true;submittedView='product'}render();
  </script>
  <script src="sidebar.js"></script>
</body>
