<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>客户竞价 - 运营管理平台</title>
  <link rel="stylesheet" href="竞价管理.css">
  <link rel="stylesheet" href="竞价审核页面.css">
  <link rel="stylesheet" href="竞价分页.css">
</head>
<body data-kind="customer">
  <header class="topbar"><div class="brand"><i>叶</i>运营管理平台</div><div class="user">🔔　Administrator</div></header>
  <div class="layout"><aside id="sidebar-container"></aside><main>
    <div class="crumb">首页 / 竞价管理 / <strong>客户竞价</strong></div>
    <section class="card pagehead"><h1>客户竞价</h1></section>
    <section class="card filters">
      <div class="field"><label for="q">竞价标题</label><input id="q"></div>
      <div class="field"><label for="type">竞价类型</label><select id="type"><option value="">全部</option><option>总价竞价</option><option>逐条竞价</option></select></div>
      <div class="field"><label for="deposit">是否支付保证金</label><select id="deposit"><option value="">全部</option><option>是</option><option>否</option></select></div>
      <div class="field"><label for="status">竞价状态</label><select id="status"><option value="">全部</option><option>审核中</option><option>已驳回</option><option>竞价中</option><option>已截止</option><option>已完成</option><option>已取消</option></select></div>
      <div class="field"><label for="deadline">截止时间</label><input id="deadline" type="text" placeholder="开始时间~结束时间" onfocus="this.type='date'"></div>
      <div class="actions"><button class="btn primary" data-action="search">查询</button><button class="btn" data-action="reset">重置</button></div>
    </section>
    <section class="card"><div class="tablewrap"><table class="auction-table"><thead><tr><th>竞价信息</th><th>采购方</th><th>竞价类型</th><th>运输方式</th><th>结算方式</th><th>保证金金额</th><th>需求发布人</th><th>联系电话</th><th>竞价时间</th><th>竞价状态</th></tr></thead><tbody id="rows"></tbody></table></div><nav class="pagination" id="pageNav" aria-label="客户竞价列表分页"></nav></section>
  </main></div>
  <div class="overlay" id="overlay"><div class="modal" id="dialog" role="dialog" aria-modal="true"><div class="modalhead"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="关闭">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></div></div>
  <script src="sidebar.js"></script><script src="竞价审核页面.js"></script>
</body>
</html>
