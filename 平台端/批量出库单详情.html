<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批量发货详情 - 运营管理平台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#333;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{height:56px;display:flex;align-items:center;padding:0 20px;background:#fff;border-bottom:1px solid #eee}.brand{font-size:16px;font-weight:600}.layout{display:flex;min-height:calc(100vh - 56px)}.main{flex:1;padding:16px 20px;overflow:auto}.breadcrumb,.card{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.breadcrumb{display:flex;gap:8px;padding:12px 20px;margin-bottom:12px;color:#666}.breadcrumb a,.link{color:#2BA471;cursor:pointer;text-decoration:none}.head{display:flex;align-items:center;padding:18px 20px;margin-bottom:12px}.head h1{margin:0;font-size:18px}.tag{margin-left:12px;padding:3px 9px;border-radius:10px;background:#fff7e6;color:#d48806;font-size:12px}.tag.sent{background:#e6fffb;color:#00a870}.actions{margin-left:auto;display:flex;gap:8px}.btn{padding:7px 16px;border:1px solid #d9d9d9;border-radius:3px;background:#fff;cursor:pointer}.btn.primary{border-color:#2BA471;background:#2BA471;color:#fff}.btn:disabled{cursor:not-allowed;opacity:.55}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:0 42px;padding:18px 20px;margin-bottom:12px}.field{display:flex;padding:10px 0;border-bottom:1px solid #f2f2f2}.field label{width:110px;color:#888}.section{padding:20px;margin-bottom:12px}.section-title{display:flex;align-items:center;margin-bottom:15px}.section h2{margin:0;padding-left:9px;border-left:3px solid #2BA471;font-size:15px}.section-title .btn{margin-left:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#fafafa;color:#666}.qty{font-weight:600}.owing{color:#d46b08}
.qty.recv-diff{background:#fff7e6;color:#d46b08;font-weight:600}.logistics{display:grid;gap:12px}.log-card{padding:15px;border:1px solid #e5eee9;border-radius:5px;background:#fbfefc}.log-head{display:flex;align-items:center;margin-bottom:12px}.log-title{color:#2BA471;font-weight:600}.log-actions{margin-left:auto;display:flex;gap:8px}.log-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.log-fields label{display:block;margin-bottom:6px;color:#777}.log-fields input{width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:3px}.files{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.file-box{padding:10px;border:1px dashed #d9d9d9;border-radius:4px;color:#666}.file-box input{display:block;margin-top:7px;max-width:100%}.file-chip{display:inline-block;margin:6px 6px 0 0;padding:4px 8px;border-radius:3px;background:#f0faf5;color:#2BA471;font-size:12px}.empty{padding:35px;text-align:center;color:#999}
  </style>
</head>
<body>
  <header class="top"><span class="brand">运营管理平台</span></header>
  <div class="layout"><div id="sidebar-container"></div><main class="main">
    <div class="breadcrumb"><a onclick="location.href='出库单列表.html'">出库单</a><span>/</span><span id="crumb">批量发货详情</span></div>
    <div class="card head"><h1>批量发货单 <span id="batch-no"></span></h1><span class="tag" id="status-tag">待发货</span><div class="actions"><button class="btn" onclick="location.href='出库单列表.html'">返回出库单</button><button class="btn primary" id="accept-btn" onclick="applyAcceptance()">申请验收</button></div></div>
    <div class="card info"><div class="field"><label>客户</label><span id="customer"></span></div><div class="field"><label>收货地址</label><span id="address"></span></div><div class="field"><label>关联销售订单</label><span id="order-count"></span></div><div class="field"><label>关联出库单</label><span id="shipment-count"></span></div></div>
    <section class="card section"><div class="section-title"><h2>出库分摊明细</h2></div><table><thead><tr><th>出库单号</th><th>销售订单号</th><th>物料编码</th><th>产品名称</th><th>规格</th><th>订单数量</th><th>剩余数量</th><th>发货数量</th><th>实收数量</th><th>差异处理</th><th>单位</th></tr></thead><tbody id="body"></tbody></table></section>
    <section class="card section"><div class="section-title"><h2>物流信息</h2><button class="btn primary" id="add-logistics" onclick="addLogistics()">新增物流信息</button></div><div class="logistics" id="logistics"></div></section>
  </main></div>
  <script src="sidebar.js"></script><script src="库存演示数据.js"></script>
  <script>
    function param(name){var m=location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));return m?decodeURIComponent(m[1]):''}
    var batch=param('batch'),rows=[],logistics=[];
    function editable(){return rows.length>0&&rows.every(function(row){return row.status==='pending'})}
    function persistLogistics(){rows.forEach(function(row){HaifuInventory.saveLogistics(row.id,logistics)})}
    function fileNames(files){return (files||[]).map(function(file){return '<span class="file-chip">'+file.name+'</span>'}).join('')}
    function addFiles(index,type,input){var record=logistics[index];Array.from(input.files||[]).forEach(function(file){record[type].push({name:file.name,size:file.size})});input.value='';persistLogistics();renderLogistics()}
    function updateLogistics(index,field,value){logistics[index][field]=value;logistics[index].saved=false;persistLogistics()}
    function saveLogistics(index){var row=logistics[index];if(!row.plate.trim()||!row.driver.trim()||!row.phone.trim()){alert('请填写车牌号、司机姓名和司机手机号');return}row.saved=true;persistLogistics();renderLogistics()}
    function removeLogistics(index){logistics.splice(index,1);persistLogistics();renderLogistics()}
    function addLogistics(){logistics.push({id:Date.now(),plate:'',driver:'',phone:'',saved:false,headPhoto:[],tailPhoto:[],video:[],excel:[]});persistLogistics();renderLogistics()}
    function fileBox(index,type,label,accept){var row=logistics[index];return '<div class="file-box">'+label+(editable()?'<input type="file" accept="'+accept+'" multiple onchange="addFiles('+index+',\''+type+'\',this)">':'')+fileNames(row[type])+'</div>'}
    function renderLogistics(){var root=document.getElementById('logistics'),canEdit=editable();document.getElementById('add-logistics').style.display=canEdit?'':'none';if(!logistics.length){root.innerHTML='<div class="empty">'+(canEdit?'暂无物流信息，请点击“新增物流信息”':'暂无物流信息')+'</div>';return}root.innerHTML=logistics.map(function(item,index){return '<div class="log-card"><div class="log-head"><span class="log-title">物流信息 '+(index+1)+'</span><div class="log-actions">'+(canEdit?'<button class="btn primary" onclick="saveLogistics('+index+')">保存</button><button class="btn" onclick="removeLogistics('+index+')">删除</button>':'')+'</div></div><div class="log-fields"><div><label>车牌号 *</label><input '+(canEdit?'':'disabled')+' value="'+(item.plate||'')+'" onchange="updateLogistics('+index+',\'plate\',this.value)"></div><div><label>司机姓名 *</label><input '+(canEdit?'':'disabled')+' value="'+(item.driver||'')+'" onchange="updateLogistics('+index+',\'driver\',this.value)"></div><div><label>司机手机号 *</label><input '+(canEdit?'':'disabled')+' value="'+(item.phone||'')+'" onchange="updateLogistics('+index+',\'phone\',this.value)"></div></div><div class="files">'+fileBox(index,'headPhoto','车辆车头照片（可选）','.jpg,.jpeg,.png')+fileBox(index,'tailPhoto','车辆车尾照片（可选）','.jpg,.jpeg,.png')+fileBox(index,'video','视频（可选，MP4/MOV）','.mp4,.mov')+fileBox(index,'excel','Excel（可选，XLS/XLSX）','.xls,.xlsx')+'</div></div>'}).join('')}
    function render(){rows=HaifuInventory.getBatchShipments(batch);document.getElementById('batch-no').textContent=batch||'—';document.getElementById('crumb').textContent=batch||'批量发货详情';if(!rows.length){document.getElementById('body').innerHTML='<tr><td colspan="11" class="empty">未找到批量发货单数据</td></tr>';document.getElementById('accept-btn').style.display='none';renderLogistics();return}var orders=[];rows.forEach(function(row){if(orders.indexOf(row.orderNo)<0)orders.push(row.orderNo)});var canEdit=editable();document.getElementById('status-tag').textContent=canEdit?'待发货':'已发货';document.getElementById('status-tag').className='tag'+(canEdit?'':' sent');document.getElementById('accept-btn').style.display=canEdit?'':'none';document.getElementById('customer').textContent=rows[0].counterparty||'—';document.getElementById('address').textContent=rows[0].receiverAddress||'—';document.getElementById('order-count').textContent=orders.length+' 笔';document.getElementById('shipment-count').textContent=rows.length+' 张';var html='';rows.forEach(function(row){(row.items||[]).forEach(function(item){var remain=canEdit?HaifuInventory.remainQty(item):0,sent=canEdit?Number(item.batchPlannedQty||0):Number(item.shippedQty||0),short=Math.max(0,Number(item.sentQty||0)-sent);html+='<tr><td><a class="link" href="出库单详情.html?id='+encodeURIComponent(row.id)+'">'+row.bizNo+'</a></td><td>'+row.orderNo+'</td><td>'+item.code+'</td><td>'+item.name+'</td><td>'+item.spec+'</td><td>'+HaifuInventory.qty(item.orderQty)+'</td><td>'+HaifuInventory.qty(remain)+'</td><td class="qty">'+HaifuInventory.qty(sent)+'</td><td class="qty'+(function(){var r=(item.receivedQty===undefined||item.receivedQty===null)?sent:Number(item.receivedQty);return (sent>0&&r!==sent)?' recv-diff':''})()+'">'+(function(){var r=(item.receivedQty===undefined||item.receivedQty===null)?sent:Number(item.receivedQty);return HaifuInventory.qty(r)})()+'</td><td class="'+(short?'owing':'')+'">'+(short?'差额 '+HaifuInventory.qty(short)+'，生成平台补发欠单':'足额发货')+'</td><td>'+item.unit+'</td></tr>'})});document.getElementById('body').innerHTML=html;logistics=(rows[0].logistics||[]).map(function(item){return JSON.parse(JSON.stringify(item))});renderLogistics()}
    function applyAcceptance(){if(!logistics.length){alert('请先新增并保存物流信息');return}var invalid=logistics.some(function(row){return !row.saved||!String(row.plate||'').trim()||!String(row.driver||'').trim()||!String(row.phone||'').trim()});if(invalid){alert('请完整填写并保存所有物流信息');return}if(!confirm('申请验收后发货数量和物流信息将锁定，客户端生成一张合并收货单。是否继续？'))return;var result=HaifuInventory.applyBatchDraft(batch,logistics);if(!result.ok){alert(result.message);return}alert(result.owings.length?'已申请验收并生成 '+result.owings.length+' 张平台补发欠单，客户端已生成合并收货单':'已申请验收，客户端已生成合并收货单');render()}
    render();
  </script>
</body>
</html>
