<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目的位置维护 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh;
        }

        .top-nav {
            height: 56px; background: #fff; color: #333;
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .top-nav-icon { cursor: pointer; color: #666; position: relative; font-size: 18px; padding: 6px; border-radius: 4px; }
        .top-nav-icon:hover { background: #f5f5f5; color: #2BA471; }
        .top-nav-icon .badge {
            position: absolute; top: 2px; right: 2px;
            background: #ff4d4f; color: #fff; font-size: 11px;
            min-width: 16px; height: 16px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
        }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; color: #333; }
        .account:hover { background: #f5f5f5; }
        .account-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #2BA471, #5BC09F);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
        }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar {
            background: #fff; padding: 12px 20px;
            border-radius: 4px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar a:hover { color: #2BA471; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        .filter-card {
            background: #fff; padding: 20px;
            border-radius: 4px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select {
            padding: 6px 10px; border: 1px solid #d9d9d9;
            border-radius: 2px; font-size: 13px;
            outline: none; min-width: 140px;
            transition: border-color .2s;
        }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        .btn {
            padding: 6px 16px; border: 1px solid #d9d9d9;
            background: #fff; border-radius: 2px;
            cursor: pointer; font-size: 13px; color: #333;
            transition: all .2s;
        }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-danger:hover { color: #ff4d4f; border-color: #ff4d4f; }

        .table-card {
            background: #fff; padding: 16px 20px;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count { color: #999; font-weight: 400; font-size: 13px; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }
        .table-tip { color: #999; font-size: 12px; margin-bottom: 12px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead { background: #fafafa; }
        table th {
            padding: 10px 10px; text-align: left; color: #555;
            font-weight: 500; border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        table td { padding: 12px 10px; color: #333; border-bottom: 1px solid #f5f5f5; }
        table tbody tr:hover { background: #fafdfb; }
        .empty-cell { text-align: center; color: #999; padding: 36px; }

        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 12px; }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #ff4d4f; }

        /* 分页 */
        .pagination {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 8px; margin-top: 16px; font-size: 13px; color: #666;
        }
        .pagination .page-info { margin-right: 16px; }
        .page-btn {
            min-width: 28px; height: 28px; padding: 0 8px;
            border: 1px solid #d9d9d9; background: #fff;
            border-radius: 2px; cursor: pointer; font-size: 13px;
        }
        .page-btn:hover { color: #2BA471; border-color: #2BA471; }
        .page-btn.active { background: #2BA471; color: #fff; border-color: #2BA471; }
        .page-btn:disabled { color: #ccc; cursor: not-allowed; }

        /* 弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: #fff; border-radius: 4px; width: 480px;
            padding: 20px 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .modal-desc { color: #888; font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
        .modal-field { margin-bottom: 14px; }
        .modal-field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
        .modal-field input {
            width: 100%; padding: 7px 10px; border: 1px solid #d9d9d9;
            border-radius: 2px; font-size: 13px; outline: none;
            font-family: inherit; color: #333;
        }
        .modal-field input:focus { border-color: #2BA471; }
        .modal-field .hint { color: #999; font-size: 12px; margin-top: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        .modal-actions .btn-pass { background: #2BA471; color: #fff; border-color: #2BA471; }
        .modal-actions .btn-pass:hover { background: #229963; color: #fff; }

        /* 删除确认弹窗 */
        .confirm-modal { width: 400px; }
        .confirm-modal .modal-title { color: #ff4d4f; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">
        <div class="top-nav-icon" title="消息">🔔<span class="badge">13</span></div>
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<div class="layout">

    <div id="sidebar-container"></div>

    <main class="main">

        <div class="breadcrumb-bar">
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <a>库存管理</a>
            <span class="sep">/</span>
            <span class="current">目的位置维护</span>
        </div>

        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>位置</label>
                    <input type="text" id="filter-location" placeholder="请输入位置">
                </div>
                <div class="filter-item">
                    <label>位置类型</label>
                    <input type="text" id="filter-type" placeholder="请输入位置类型">
                </div>
                <div class="filter-item">
                    <label>公司</label>
                    <input type="text" id="filter-company" placeholder="请输入公司">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyFilter()">🔍 搜索</button>
                    <button class="btn" onclick="resetFilter()">重置</button>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-title">
                    目的位置列表
                    <span class="count" id="table-count">共 0 条</span>
                </div>
                <div class="table-toolbar-right">
                    <button class="btn btn-primary" onclick="openAddModal()">+ 新增目的位置</button>
                </div>
            </div>

            <div class="table-tip">目的位置用于平台中转入库单、出库单的「目的位置」下拉选择；位置、位置类型、公司均为非必填项。</div>

            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>位置</th>
                        <th>位置类型</th>
                        <th>公司</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="location-tbody"></tbody>
            </table>

            <div class="pagination">
                <span class="page-info" id="page-info">共 0 条</span>
                <button class="page-btn" disabled>‹</button>
                <button class="page-btn active">1</button>
                <button class="page-btn" disabled>›</button>
            </div>
        </div>
    </main>
</div>

<!-- 新增 / 修改弹窗 -->
<div class="modal-mask" id="edit-modal">
    <div class="modal">
        <div class="modal-title" id="edit-modal-title">新增目的位置</div>
        <div class="modal-desc">位置、位置类型、公司均为非必填项，可按实际管理需要填写。</div>
        <div class="modal-field">
            <label>位置</label>
            <input type="text" id="edit-location" placeholder="请输入位置名称">
        </div>
        <div class="modal-field">
            <label>位置类型</label>
            <input type="text" id="edit-type" placeholder="如：自有仓库 / 分公司仓库 / 中转点">
        </div>
        <div class="modal-field">
            <label>公司</label>
            <input type="text" id="edit-company" placeholder="请输入公司名称">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeEditModal()">取消</button>
            <button class="btn btn-pass" onclick="saveLocation()">保存</button>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-mask" id="delete-modal">
    <div class="modal confirm-modal">
        <div class="modal-title">删除目的位置</div>
        <div class="modal-desc" id="delete-desc">确认删除该目的位置吗？删除后单据中将无法再选择该位置。</div>
        <div class="modal-actions">
            <button class="btn" onclick="closeDeleteModal()">取消</button>
            <button class="btn btn-pass" style="background:#ff4d4f;border-color:#ff4d4f;" onclick="confirmDelete()">确认删除</button>
        </div>
    </div>
</div>

<script src="sidebar.js"></script>
<script src="库存演示数据.js"></script>
<script>
    var editingId = null;   // 当前编辑的记录 id；为空表示新增
    var deletingId = null;  // 待删除的记录 id

    function filteredLocations() {
        var location = (document.getElementById('filter-location').value || '').trim();
        var type = (document.getElementById('filter-type').value || '').trim();
        var company = (document.getElementById('filter-company').value || '').trim();

        return HaifuInventory.getLocations().filter(function (row) {
            if (location && (row.location || '').indexOf(location) < 0) return false;
            if (type && (row.type || '').indexOf(type) < 0) return false;
            if (company && (row.company || '').indexOf(company) < 0) return false;
            return true;
        });
    }

    function render() {
        var rows = filteredLocations();
        var tbody = document.getElementById('location-tbody');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-cell">暂无目的位置数据，可点击「新增目的位置」添加</td></tr>';
        } else {
            tbody.innerHTML = rows.map(function (row, index) {
                return '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + (row.location || '—') + '</td>' +
                    '<td>' + (row.type || '—') + '</td>' +
                    '<td>' + (row.company || '—') + '</td>' +
                    '<td>' +
                        '<a class="link" onclick="openEditModal(\'' + row.id + '\')">修改</a>' +
                        '<a class="link link-danger" onclick="openDeleteModal(\'' + row.id + '\')">删除</a>' +
                    '</td>' +
                    '</tr>';
            }).join('');
        }
        document.getElementById('table-count').textContent = '共 ' + rows.length + ' 条';
        document.getElementById('page-info').textContent = '共 ' + rows.length + ' 条';
    }

    function applyFilter() { render(); }

    function resetFilter() {
        ['filter-location', 'filter-type', 'filter-company'].forEach(function (id) {
            document.getElementById(id).value = '';
        });
        render();
    }

    /* ============ 新增 / 修改 ============ */

    function openAddModal() {
        editingId = null;
        document.getElementById('edit-modal-title').textContent = '新增目的位置';
        document.getElementById('edit-location').value = '';
        document.getElementById('edit-type').value = '';
        document.getElementById('edit-company').value = '';
        document.getElementById('edit-modal').classList.add('show');
    }

    function openEditModal(id) {
        var record = HaifuInventory.getLocations().filter(function (row) { return row.id === id; })[0];
        if (!record) return;
        editingId = id;
        document.getElementById('edit-modal-title').textContent = '修改目的位置';
        document.getElementById('edit-location').value = record.location || '';
        document.getElementById('edit-type').value = record.type || '';
        document.getElementById('edit-company').value = record.company || '';
        document.getElementById('edit-modal').classList.add('show');
    }

    // 取消仅关闭弹窗，不保存、不改变数据
    function closeEditModal() {
        document.getElementById('edit-modal').classList.remove('show');
        editingId = null;
    }

    function saveLocation() {
        var data = {
            location: document.getElementById('edit-location').value.trim(),
            type: document.getElementById('edit-type').value.trim(),
            company: document.getElementById('edit-company').value.trim()
        };
        if (editingId) {
            HaifuInventory.updateLocation(editingId, data);
        } else {
            HaifuInventory.addLocation(data);
        }
        closeEditModal();
        render();
    }

    /* ============ 删除 ============ */

    function openDeleteModal(id) {
        var record = HaifuInventory.getLocations().filter(function (row) { return row.id === id; })[0];
        if (!record) return;
        deletingId = id;
        document.getElementById('delete-desc').textContent =
            '确认删除目的位置「' + (record.location || '未命名') + '」吗？删除后单据中将无法再选择该位置。';
        document.getElementById('delete-modal').classList.add('show');
    }

    // 取消仅关闭弹窗，不删除数据
    function closeDeleteModal() {
        document.getElementById('delete-modal').classList.remove('show');
        deletingId = null;
    }

    function confirmDelete() {
        if (deletingId) HaifuInventory.removeLocation(deletingId);
        closeDeleteModal();
        render();
    }

    render();
</script>

</body>
</html>
