<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色管理 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh; }
        .top-nav { height: 56px; background: #fff; color: #333; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }
        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .account { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 13px; }
        .account:hover { background: #f5f5f5; }
        .account-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #2BA471, #5BC09F); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; background: #fff; border-right: 1px solid #f0f0f0; flex-shrink: 0; padding: 12px 0; }
        .menu-item { padding: 10px 24px 10px 48px; color: #666; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
        .menu-item:hover { background: #f5f5f5; color: #2BA471; }
        .menu-item.active { color: #2BA471; border-left-color: #2BA471; background: #f0faf5; font-weight: 500; }
        .menu-group-title { padding: 10px 20px; color: #333; font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .menu-group-title:first-of-type { margin-top: 4px; }
        .menu-group-icon { font-size: 16px; width: 20px; text-align: center; }

        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar { background: #fff; padding: 12px 20px; border-radius: 4px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        .filter-card { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 13px; outline: none; min-width: 140px; transition: border-color .2s; }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; color: #333; transition: all .2s; }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary { background: #2BA471; color: #fff; border-color: #2BA471; }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-danger { color: #ff4d4f; border-color: #ffa39e; }
        .btn-danger:hover { background: #fff1f0; border-color: #ff4d4f; }

        .table-card { background: #fff; padding: 16px 20px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .table-toolbar { display: flex; align-items: center; margin-bottom: 14px; }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count { color: #999; font-weight: 400; font-size: 13px; margin-left: 6px; }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table thead { background: #fafafa; }
        table th { padding: 10px 12px; text-align: left; color: #555; font-weight: 500; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        table td { padding: 10px 12px; color: #333; border-bottom: 1px solid #f5f5f5; }
        table tbody tr:hover { background: #fafdfb; }
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 8px; }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #ff4d4f; }
        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch span { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 18px; transition: .2s; }
        .switch span:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .2s; }
        .switch input:checked + span { background: #2BA471; }
        .switch input:checked + span:before { transform: translateX(18px); }
    </style>
    <link rel="stylesheet" href="rbac.css">
</head>
<body>

<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<div class="layout">
    <div id="sidebar-container"></div>
    <main class="main">
        <div class="breadcrumb-bar">
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <a>系统管理</a>
            <span class="sep">/</span>
            <span class="current">角色管理</span>
        </div>

        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>角色名称</label>
                    <input type="text" id="f-name" placeholder="请输入角色名称">
                </div>
                <div class="filter-item">
                    <label>权限字符</label>
                    <input type="text" id="f-key" placeholder="请输入权限字符">
                </div>
                <div class="filter-item">
                    <label>状态</label>
                    <select id="f-status">
                        <option value="">全部</option>
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="renderRoles()">🔍 搜索</button>
                    <button class="btn" onclick="resetSearch()">重置</button>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-title">
                    角色列表
                    <span class="count" id="role-count"></span>
                </div>
                <div class="table-toolbar-right rbac-toolbar-btns">
                    <button class="btn btn-primary" onclick="openRoleModal()">+ 新增</button>
                    <button class="btn btn-danger" onclick="batchDelete()">🗑 删除</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width:32px;"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
                        <th>角色编号</th>
                        <th>角色名称</th>
                        <th>权限字符</th>
                        <th>显示顺序</th>
                        <th>状态</th>
                        <th>菜单权限数</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="role-tbody"></tbody>
            </table>
        </div>
    </main>
</div>

<!-- 角色新增/编辑弹窗（含权限树） -->
<div class="rbac-modal-mask" id="role-modal">
    <div class="rbac-modal" style="min-width:680px;">
        <div class="rbac-modal-header">
            <span class="rbac-modal-title" id="role-modal-title">新增角色</span>
            <span class="rbac-modal-close" onclick="closeRoleModal()">×</span>
        </div>
        <div class="rbac-modal-body">
            <div class="rbac-form">
                <div class="form-row">
                    <label>角色名称 <span class="req">*</span></label>
                    <input type="text" id="m-name" placeholder="请输入角色名称">
                </div>
                <div class="form-row">
                    <label>权限字符 <span class="req">*</span></label>
                    <input type="text" id="m-key" placeholder="如 system:user:list">
                </div>
                <div class="form-row">
                    <label>显示顺序</label>
                    <input type="number" id="m-sort" value="0" min="0">
                </div>
                <div class="form-row">
                    <label>状态</label>
                    <select id="m-status">
                        <option value="0">正常</option>
                        <option value="1">停用</option>
                    </select>
                </div>
                <div class="form-row full">
                    <label>菜单权限分配（勾选角色可访问的菜单及按钮）</label>
                    <div style="display:flex;gap:8px;margin-bottom:6px;">
                        <a class="link" onclick="expandPermTree(true)">展开全部</a>
                        <a class="link" onclick="expandPermTree(false)">折叠全部</a>
                        <a class="link" onclick="checkPermTree(true)">全选</a>
                        <a class="link" onclick="checkPermTree(false)">取消全选</a>
                        <a class="link" onclick="checkPermMenuOnly()">仅选菜单</a>
                    </div>
                    <div class="perm-tree" id="perm-tree"></div>
                </div>
                <div class="form-row full">
                    <label>备注</label>
                    <textarea id="m-remark" placeholder="请输入备注"></textarea>
                </div>
            </div>
        </div>
        <div class="rbac-modal-footer">
            <button class="btn" onclick="closeRoleModal()">取消</button>
            <button class="btn btn-primary" onclick="saveRole()">确定</button>
        </div>
    </div>
</div>

<script src="rbac-data.js"></script>
<script src="sidebar.js"></script>
<script>
var editingRoleId = null;

/* ===== 角色列表 ===== */
function renderRoles() {
    var roles = RBAC.getRoles();
    var name   = document.getElementById('f-name').value.trim();
    var key    = document.getElementById('f-key').value.trim();
    var status = document.getElementById('f-status').value;
    if (name)   roles = roles.filter(function (r) { return r.name.indexOf(name) >= 0; });
    if (key)    roles = roles.filter(function (r) { return r.roleKey.indexOf(key) >= 0; });
    if (status) roles = roles.filter(function (r) { return r.status === status; });

    var html = '';
    roles.forEach(function (r) {
        var menuCount = (r.menuIds || []).length;
        var checked = r.status === '0';
        html += '<tr>' +
            '<td><input type="checkbox" class="row-check" data-id="' + r.id + '"' + (r.roleKey === 'admin' ? ' disabled' : '') + '></td>' +
            '<td>' + r.id + '</td>' +
            '<td>' + r.name + '</td>' +
            '<td>' + r.roleKey + '</td>' +
            '<td>' + (r.sort || 0) + '</td>' +
            '<td><label class="switch"><input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleStatus(\'' + r.id + '\', this.checked)"' + (r.roleKey === 'admin' ? ' disabled' : '') + '><span></span></label></td>' +
            '<td>' + menuCount + ' 项</td>' +
            '<td>' + (r.createTime || '2026-01-01') + '</td>' +
            '<td>' +
                '<a class="link" onclick="openRoleModal(\'' + r.id + '\')">编辑</a>' +
                // '<a class="link" onclick="openDataScope(\'' + r.id + '\')">数据权限</a>' +
                (r.roleKey === 'admin' ? '' : '<a class="link link-danger" onclick="deleteRole(\'' + r.id + '\')">删除</a>') +
            '</td>' +
        '</tr>';
    });
    if (!html) html = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
    document.getElementById('role-tbody').innerHTML = html;
    document.getElementById('role-count').textContent = '共 ' + roles.length + ' 条';
}

function resetSearch() {
    document.getElementById('f-name').value = '';
    document.getElementById('f-key').value = '';
    document.getElementById('f-status').value = '';
    renderRoles();
}
function toggleAll(el) {
    document.querySelectorAll('.row-check:not(:disabled)').forEach(function (cb) { cb.checked = el.checked; });
}
function getCheckedIds() {
    var ids = [];
    document.querySelectorAll('.row-check:checked').forEach(function (cb) { ids.push(cb.dataset.id); });
    return ids;
}
function toggleStatus(roleId, checked) {
    var roles = RBAC.getRoles();
    var r = roles.find(function (x) { return x.id === roleId; });
    if (r) { r.status = checked ? '0' : '1'; RBAC.saveRoles(roles); }
}

/* ===== 权限树渲染 ===== */
function renderPermTree(selectedIds) {
    var tree = RBAC.getMenuTree();
    document.getElementById('perm-tree').innerHTML = buildPermNodes(tree, selectedIds || []);
}
function buildPermNodes(nodes, selectedIds) {
    var html = '';
    nodes.forEach(function (n) {
        var hasChildren = n.children && n.children.length;
        var checked = selectedIds.indexOf(n.id) >= 0 ? 'checked' : '';
        var labelCls = n.type === 'F' ? ' is-btn' : '';
        var permsTxt = n.perms ? '<span class="perm-tree-perms">(' + n.perms + ')</span>' : '';
        html += '<div class="perm-tree-node">';
        html += '<div class="perm-tree-row">';
        html += '<span class="perm-tree-toggle' + (hasChildren ? '' : ' empty') + '" onclick="togglePermNode(this)">▶</span>';
        html += '<input type="checkbox" class="perm-tree-check" value="' + n.id + '" data-type="' + n.type + '" data-parent="' + n.parentId + '" ' + checked + ' onchange="onPermCheck(this)">';
        html += '<span class="perm-tree-label' + labelCls + '">' + (n.icon ? n.icon + ' ' : '') + n.name + ' ' + RBAC.menuTypeTag(n.type) + permsTxt + '</span>';
        html += '</div>';
        if (hasChildren) {
            html += '<div class="perm-tree-children open">' + buildPermNodes(n.children, selectedIds) + '</div>';
        }
        html += '</div>';
    });
    return html;
}
function togglePermNode(el) {
    var childDiv = el.closest('.perm-tree-node').querySelector(':scope > .perm-tree-children');
    if (!childDiv) return;
    var isOpen = childDiv.classList.toggle('open');
    el.textContent = isOpen ? '▼' : '▶';
}
function expandPermTree(expand) {
    document.querySelectorAll('.perm-tree-children').forEach(function (d) {
        if (expand) d.classList.add('open'); else d.classList.remove('open');
    });
    document.querySelectorAll('.perm-tree-toggle').forEach(function (t) {
        if (t.classList.contains('empty')) return;
        t.textContent = expand ? '▼' : '▶';
    });
}
function checkPermTree(check) {
    document.querySelectorAll('.perm-tree-check').forEach(function (cb) { cb.checked = check; });
}
function checkPermMenuOnly() {
    document.querySelectorAll('.perm-tree-check').forEach(function (cb) {
        cb.checked = (cb.dataset.type === 'M' || cb.dataset.type === 'C');
    });
}

/* ===== 联动：勾选子节点自动勾选父节点；勾选父节点可选联动子节点 ===== */
function onPermCheck(el) {
    var checked = el.checked;
    var nodeId = el.value;
    // 联动子节点
    var node = el.closest('.perm-tree-node');
    if (node) {
        node.querySelectorAll(':scope > .perm-tree-children .perm-tree-check').forEach(function (cb) { cb.checked = checked; });
    }
    // 联动父节点（向上查找）
    if (checked) {
        var parent = el.closest('.perm-tree-node').parentElement.closest('.perm-tree-node');
        while (parent) {
            var pCheck = parent.querySelector(':scope > .perm-tree-row > .perm-tree-check');
            if (pCheck && !pCheck.checked) pCheck.checked = true;
            parent = parent.parentElement.closest('.perm-tree-node');
        }
    }
}

/* ===== 新增/编辑 ===== */
function openRoleModal(roleId) {
    editingRoleId = roleId || null;
    document.getElementById('role-modal-title').textContent = roleId ? '编辑角色' : '新增角色';
    if (roleId) {
        var r = RBAC.getRoleById(roleId);
        document.getElementById('m-name').value   = r.name;
        document.getElementById('m-key').value    = r.roleKey;
        document.getElementById('m-sort').value   = r.sort || 0;
        document.getElementById('m-status').value = r.status || '0';
        document.getElementById('m-remark').value = r.remark || '';
        renderPermTree(r.menuIds || []);
    } else {
        document.getElementById('m-name').value = '';
        document.getElementById('m-key').value = '';
        document.getElementById('m-sort').value = 0;
        document.getElementById('m-status').value = '0';
        document.getElementById('m-remark').value = '';
        renderPermTree([]);
    }
    document.getElementById('role-modal').classList.add('show');
}
function closeRoleModal() {
    document.getElementById('role-modal').classList.remove('show');
}
function saveRole() {
    var name = document.getElementById('m-name').value.trim();
    var key  = document.getElementById('m-key').value.trim();
    if (!name) { alert('请输入角色名称'); return; }
    if (!key)  { alert('请输入权限字符'); return; }

    var menuIds = [];
    document.querySelectorAll('.perm-tree-check:checked').forEach(function (cb) { menuIds.push(cb.value); });

    var roles = RBAC.getRoles();
    if (editingRoleId) {
        var r = roles.find(function (x) { return x.id === editingRoleId; });
        r.name    = name;
        r.roleKey = key;
        r.sort    = parseInt(document.getElementById('m-sort').value) || 0;
        r.status  = document.getElementById('m-status').value;
        r.remark  = document.getElementById('m-remark').value.trim();
        r.menuIds = menuIds;
    } else {
        roles.push({
            id: RBAC.genId('R'),
            name: name,
            roleKey: key,
            sort: parseInt(document.getElementById('m-sort').value) || 0,
            status: document.getElementById('m-status').value,
            remark: document.getElementById('m-remark').value.trim(),
            menuIds: menuIds,
            createTime: new Date().toISOString().slice(0, 10)
        });
    }
    RBAC.saveRoles(roles);
    closeRoleModal();
    renderRoles();
}

function deleteRole(roleId) {
    if (!confirm('确认删除该角色？')) return;
    var roles = RBAC.getRoles().filter(function (r) { return r.id !== roleId; });
    RBAC.saveRoles(roles);
    renderRoles();
}
function batchDelete() {
    var ids = getCheckedIds();
    if (!ids.length) { alert('请勾选要删除的角色'); return; }
    if (!confirm('确认删除选中的 ' + ids.length + ' 个角色？')) return;
    var roles = RBAC.getRoles().filter(function (r) { return ids.indexOf(r.id) < 0; });
    RBAC.saveRoles(roles);
    renderRoles();
}

function openDataScope(roleId) {
    alert('演示项目：数据权限（部门数据范围）功能，暂未实现详细配置。角色 ' + roleId);
}

/* ===== 初始化 ===== */
renderRoles();
</script>
</body>
</html>
