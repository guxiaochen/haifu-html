  <script>location.replace('邀请供应商报价-选择询价明细.html' + location.search);</script>
  <style>
    * { box-sizing:border-box; } body { margin:0; min-width:1200px; background:#f5f7fa; color:#333; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif; }
    .top { height:56px; display:flex; align-items:center; padding:0 20px; background:#fff; border-bottom:1px solid #f0f0f0; box-shadow:0 1px 4px rgba(0,0,0,.04); }.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}.logo{display:grid;width:32px;height:32px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#2BA471,#5BC09F);color:#fff}.user{margin-left:auto;color:#666;font-size:13px}.shell{display:flex;min-height:calc(100vh - 56px)}.side{width:200px;padding:18px 0;background:#fff;border-right:1px solid #f0f0f0}.side strong{display:block;padding:10px 20px;font-size:15px}.side span{display:block;padding:10px 24px 10px 48px;border-left:3px solid #2BA471;background:#f0faf5;color:#2BA471;font-size:13px;font-weight:500}.base{flex:1;padding:16px 20px}.base-card{height:150px;margin-top:12px;padding:20px;border-radius:4px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}.base-card h1{margin:0;font-size:18px}.base-card p{color:#999;font-size:13px}.shade{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.45)}
    .modal{position:fixed;z-index:6;top:22px;right:4.5%;bottom:22px;left:25.5%;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.2)}.head{display:flex;align-items:center;min-height:60px;padding:0 18px;border-bottom:1px solid #f0f0f0;font-size:16px;font-weight:600}.head small{margin-left:10px;color:#999;font-size:12px;font-weight:400}.close{margin-left:auto;border:0;background:transparent;color:#999;font-size:25px;cursor:pointer}.steps{display:flex;align-items:center;gap:8px;padding:15px 18px 9px;color:#999;font-size:12px}.step{display:inline-flex;align-items:center;gap:6px}.dot{display:grid;width:18px;height:18px;place-items:center;border-radius:50%;background:#e8e8e8;color:#999;font-size:11px}.dot.active{background:#2BA471;color:#fff}.line{width:38px;height:1px;background:#2BA471}
    .tabs{display:flex;gap:0;padding:0 18px;border-bottom:1px solid #f0f0f0}.tab{padding:10px 20px;border:0;border-bottom:2px solid transparent;background:#fff;color:#666;cursor:pointer;font-size:13px}.tab.active{border-bottom-color:#2BA471;color:#2BA471;font-weight:500}.tab .badge{margin-left:5px;color:#999;font-size:11px}.toolbar{display:flex;align-items:center;gap:8px;padding:14px 18px}.hint{color:#999;font-size:12px}.search{display:flex;align-items:center;width:360px;height:34px;margin-left:auto;border:1px solid #d9d9d9;border-radius:2px;overflow:hidden}.search input{min-width:0;flex:1;border:0;outline:0;padding:0 10px;font:13px inherit}.search button{width:36px;height:100%;border:0;border-left:1px solid #f0f0f0;background:#fff;color:#666;cursor:pointer}.icon{display:grid;width:34px;height:34px;place-items:center;border:0;border-radius:4px;background:#2BA471;color:#fff;font-size:17px;cursor:pointer}.icon.filter{background:#6574ba}.pager{display:flex;align-items:center;gap:8px;color:#666;font-size:13px}.arrow{display:grid;width:32px;height:32px;place-items:center;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#666;cursor:pointer}
    .table-wrap{flex:1;min-height:0;overflow:auto;padding:0 18px}.grid{width:100%;min-width:820px;border-collapse:separate;border-spacing:0 10px;font-size:13px}.grid th{padding:0 10px 10px;color:#333;font-weight:600;text-align:left;white-space:nowrap}.grid th:first-child{width:46px;text-align:center}.grid td{padding:15px 10px;background:#fff;border-top:1px solid #f3f3f3;border-bottom:1px solid #f3f3f3;white-space:nowrap}.grid td:first-child{border-left:1px solid #f3f3f3;border-radius:10px 0 0 10px;text-align:center}.grid td:last-child{border-right:1px solid #f3f3f3;border-radius:0 10px 10px 0}.grid tr.selected td{background:#f0faf5;border-color:#ccebdc}.grid tr.selected td:first-child{border-left-color:#ccebdc}.grid tr.selected td:last-child{border-right-color:#ccebdc}.checkbox{width:16px;height:16px;accent-color:#2BA471;cursor:pointer}.supplier{font-weight:500}.contact{color:#666}.category{color:#2BA471}.external-tag{display:inline-block;padding:2px 8px;border-radius:9px;background:#fff7e6;color:#d48806;font-size:11px}.empty{padding:42px;text-align:center;color:#999}.foot{display:flex;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid #f0f0f0}.selection{color:#666;font-size:13px}.selection b{color:#2BA471}.spacer{flex:1}.btn{padding:7px 14px;border:1px solid #d9d9d9;border-radius:2px;background:#fff;color:#333;cursor:pointer;font-size:13px}.btn:hover{border-color:#2BA471;color:#2BA471}.primary{border-color:#2BA471;background:#2BA471;color:#fff}.primary:hover{border-color:#229963;background:#229963;color:#fff}.primary:disabled{border-color:#e8e8e8;background:#e8e8e8;color:#999;cursor:not-allowed}.preview{display:none;position:fixed;inset:0;z-index:12;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}.preview.show{display:flex}.preview-box{width:680px;overflow:hidden;border-radius:8px;background:#fff;box-shadow:0 12px 36px rgba(0,0,0,.2)}.preview-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:600}.phone-area{display:flex;gap:42px;align-items:center;padding:25px 50px}.phone{width:290px;height:500px;overflow:hidden;border:8px solid #333;border-radius:30px;background:#f5f7fa}.phone-top{padding:18px 16px 10px;background:#2BA471;color:#fff}.phone-top b{display:block;font-size:15px}.phone-top span{font-size:11px;opacity:.85}.phone-content{padding:14px}.phone-card{margin-bottom:10px;padding:12px;border-radius:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}.phone-card b{display:block;margin-bottom:6px}.phone-card small{display:block;margin-top:4px;color:#666;line-height:1.5}.phone-btn{margin:8px 14px;padding:10px;border-radius:4px;background:#2BA471;color:#fff;text-align:center;font-size:13px}.preview-note{width:210px;color:#666;font-size:13px;line-height:1.8}.preview-note strong{display:block;margin-bottom:8px;color:#333;font-size:15px}.preview-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #f0f0f0}.toast{position:fixed;bottom:30px;left:50%;z-index:20;transform:translate(-50%,20px);padding:9px 14px;border-radius:4px;background:rgba(0,0,0,.76);color:#fff;font-size:13px;opacity:0;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
    .steps { gap:0; margin:14px 18px 12px; padding:0; border:1px solid #e8f3ed; border-radius:6px; background:#f7fcf9; overflow:hidden; }
    .step { flex:1; justify-content:center; min-height:42px; padding:0 16px; color:#7a8b80; font-size:13px; }.step.current { background:#e8f7ef; color:#157a4e; font-weight:600; }.step .dot { width:20px; height:20px; }.line { width:1px; height:22px; background:#ccebdc; }
    .toolbar { padding:14px 18px; }.toolbar .search { margin-left:0; }.toolbar .spacer { flex:1; }.toolbar .icon, .toolbar .pager { display:none; }.foot .pager { display:flex; align-items:center; gap:8px; margin-left:14px; color:#666; font-size:12px; }
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="logo">叶</span>运营管理平台</div><div class="user">🔔　Administrator</div></header><div class="shell"><aside class="side"><strong>📋 订单管理</strong><span>平台询价单</span></aside><main class="base"><div>平台询价单 / XJ2026080062</div><div class="base-card"><h1>平台询价单 XJ2026080062</h1><p>已选 2 条询价明细，正在选择需要发起报价邀请的供应商。</p></div></main></div><div class="shade"></div>
  <section class="modal"><div class="head">选择供应商 <small>已选 2 条询价明细：大蒜、洋葱</small><button class="close" onclick="closeModal()">×</button></div>
    <div class="steps"><span class="step"><b class="dot">✓</b>选择询价明细</span><span class="line"></span><span class="step current"><b class="dot active">2</b>选择供应商并发送邀请</span></div>
    <div class="tabs"><button class="tab active" onclick="switchTab('internal',this)">已入驻供应商 <span class="badge">3</span></button><button class="tab" onclick="switchTab('external',this)">外部邀请链接</button></div>
    <div class="toolbar"><div class="search"><input id="keyword" placeholder="搜索供应商名称、联系人、主营品类" oninput="render()"><button onclick="render()">⌕</button></div><span class="spacer"></span><button class="btn" onclick="document.getElementById('keyword').value='';render()">重置筛选</button></div>
    <div class="table-wrap"><table class="grid" id="supplierTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="externalLinkPanel" style="display:none;padding:38px 12px;text-align:center"><div style="max-width:620px;margin:auto;padding:24px;border:1px dashed #9fd8ba;border-radius:8px;background:#f7fcf9"><b style="display:block;margin-bottom:10px;color:#2BA471;font-size:16px">生成外部供应商报价邀请链接</b><p style="margin:0 0 18px;color:#666;font-size:13px">外部供应商信息无需预先维护；对方打开链接后自行填写企业与联系人信息，再提交报价。</p><div style="display:flex;gap:8px"><input id="externalInviteLink" readonly placeholder="点击生成后显示报价链接" style="flex:1;height:34px;padding:0 10px;border:1px solid #d9d9d9;border-radius:2px"><button class="btn primary" type="button" onclick="generateExternalInviteLink()">生成邀请链接</button><button class="btn" type="button" onclick="copyExternalInviteLink()">复制链接</button></div></div></div></div>
    <div class="foot"><span class="selection">已选 <b id="selectedNum">0</b> 家供应商 <span id="sourceSummary"></span></span><span class="pager">共 <b id="pageTotal">3</b> 条　1 / 1 <button class="arrow" disabled>‹</button><button class="arrow" disabled>›</button></span><span class="spacer"></span><button class="btn" onclick="location.href='邀请供应商报价-选择询价明细.html'+location.search">上一步</button><button class="btn primary" id="send" disabled onclick="sendInvite()">发送邀请</button><button class="btn" onclick="closeModal()">关闭</button></div>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    const data={internal:[{id:'i1',name:'aqtest海赋（山东）数字产业发展有限公司',contact:'张建国 / 13600136000',category:'农产品、蔬菜'},{id:'i2',name:'天津市思睿国际贸易有限公司',contact:'王立 / 13805310088',category:'农产品、调味品'},{id:'i3',name:'金乡农产品供应链有限公司',contact:'李梅 / 13900139000',category:'大蒜、洋葱'}]}; let type='internal'; const selected=new Map();
    function switchTab(t,btn){type=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('hint').textContent=t==='internal'?'选择已入驻供应商后，将在供应商端生成待报价任务。':'选择外部供应商后，系统将生成小程序报价链接。';document.getElementById('keyword').value='';render();}
    function render(){const isExternal=type==='external',footSelection=document.querySelector('.selection'),footPager=document.querySelector('.foot .pager'),sendButton=document.getElementById('send');document.getElementById('supplierTable').style.display=isExternal?'none':'';document.getElementById('externalLinkPanel').style.display=isExternal?'block':'none';document.querySelector('.toolbar').style.display=isExternal?'none':'flex';footSelection.style.display=isExternal?'none':'';footPager.style.display=isExternal?'none':'flex';sendButton.style.display=isExternal?'none':'';if(isExternal){document.getElementById('pageTotal').textContent='—';return;}const q=document.getElementById('keyword').value.trim().toLowerCase();document.getElementById('thead').innerHTML='<tr><th>勾选</th><th>供应商名称</th><th>联系人</th><th>主营品类</th></tr>';const rows=data.internal.filter(x=>(x.name+x.contact+x.category).toLowerCase().includes(q));document.getElementById('tbody').innerHTML=rows.length?rows.map(x=>'<tr class="'+(selected.has(x.id)?'selected':'')+'"><td><input class="checkbox" type="checkbox" '+(selected.has(x.id)?'checked':'')+' onchange="toggle(\''+x.id+'\')"></td><td class="supplier">'+x.name+'</td><td class="contact">'+x.contact+'</td><td class="category">'+x.category+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">暂无匹配供应商</td></tr>';update();}
    function toggle(id){if(selected.has(id))selected.delete(id);else selected.set(id,type);render();}function update(){const a=[...selected.values()];document.getElementById('selectedNum').textContent=a.length;document.getElementById('sourceSummary').textContent=a.length?'（已入驻供应商）':'';document.getElementById('send').disabled=!a.length;}function sendInvite(){notify('已向 '+selected.size+' 家已入驻供应商发起报价邀请');}function closeModal(){restoreInquiryDetail();}function generateExternalInviteLink(){document.getElementById('externalInviteLink').value='../供应商端/外部供应商报价.html?token=INVITE-Q8A6';notify('已生成外部供应商报价邀请链接');}function copyExternalInviteLink(){if(!document.getElementById('externalInviteLink').value)generateExternalInviteLink();notify('邀请链接已复制');}document.querySelector('.shade').addEventListener('click',closeModal);function notify(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),2100);}render();
  </script>
<script>
  const updatePageTotal = function () { document.getElementById('pageTotal').textContent = document.querySelectorAll('#tbody input.checkbox').length; };
  updatePageTotal();
  new MutationObserver(updatePageTotal).observe(document.getElementById('tbody'), { childList: true });
</script>
<script>
  // 不依赖内联 onclick：供应商类型 Tab 始终由明确事件绑定切换。
  window.switchTab = function (nextType, button) {
    type = nextType;
    document.querySelectorAll('.tabs .tab').forEach(function (tab) { tab.classList.remove('active'); });
    button.classList.add('active');
    document.getElementById('keyword').value = '';
    render();
  };
  document.querySelectorAll('.tabs .tab').forEach(function (button, index) {
    button.removeAttribute('onclick');
    button.addEventListener('click', function () { switchTab(index === 0 ? 'internal' : 'external', button); });
  });
  const supplierToolbar = document.querySelector('.toolbar');
  supplierToolbar.querySelector('.spacer').remove();
  supplierToolbar.style.justifyContent = 'center';
  const filterButton = document.createElement('button');
  filterButton.className = 'btn'; filterButton.textContent = '筛选';
  filterButton.addEventListener('click', function () { notify('已按当前供应商类型筛选，可继续输入关键词缩小范围'); });
  supplierToolbar.insertBefore(filterButton, supplierToolbar.querySelector('.btn'));
</script>
<script src="询价弹窗底页.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
