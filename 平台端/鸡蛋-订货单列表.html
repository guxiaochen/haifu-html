<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订货单列表 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh;
        }

        /* ===== 顶部绿色通栏 ===== */
        .top-nav {
            height: 56px; background: #fff; color: #333;
            display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid #f0f0f0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .top-nav-left { display: flex; align-items: center; gap: 24px; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #2BA471 0%, #5BC09F 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .brand-name { font-size: 16px; font-weight: 600; color: #333; }

        .top-nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .top-nav-icon {
            cursor: pointer; color: #666; position: relative;
            font-size: 18px; padding: 6px;
            border-radius: 4px;
        }
        .top-nav-icon:hover { background: #f5f5f5; color: #2BA471; }
        .top-nav-icon .badge {
            position: absolute; top: 2px; right: 2px;
            background: #ff4d4f; color: #fff; font-size: 11px;
            min-width: 16px; height: 16px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
        }
        .account {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; padding: 4px 10px; border-radius: 4px;
            font-size: 13px; color: #333;
        }
        .account:hover { background: #f5f5f5; }
        .account-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #2BA471, #5BC09F);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 500;
        }
        .account-name { font-size: 13px; }

        /* ===== 左右分栏 ===== */
        .layout { display: flex; min-height: calc(100vh - 56px); }

        /* 右侧主内容 */
        .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
        .breadcrumb-bar {
            background: #fff; padding: 12px 20px;
            border-radius: 4px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .breadcrumb-bar .menu-toggle { font-size: 18px; color: #666; cursor: pointer; margin-right: 8px; }
        .breadcrumb-bar .home-icon { color: #2BA471; cursor: pointer; }
        .breadcrumb-bar a { color: #666; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar a:hover { color: #2BA471; }
        .breadcrumb-bar .sep { color: #d9d9d9; margin: 0 2px; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }

        /* 搜索筛选区 */
        .filter-card {
            background: #fff; padding: 20px;
            border-radius: 4px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .filter-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .filter-item label { color: #666; white-space: nowrap; }
        .filter-item input, .filter-item select {
            padding: 6px 10px; border: 1px solid #d9d9d9;
            border-radius: 2px; font-size: 13px;
            outline: none; min-width: 140px;
            transition: border-color .2s;
        }
        .filter-item input:focus, .filter-item select:focus { border-color: #2BA471; }
        .filter-actions { margin-left: auto; display: flex; gap: 8px; }

        /* 按钮 */
        .btn {
            padding: 6px 16px; border: 1px solid #d9d9d9;
            background: #fff; border-radius: 2px;
            cursor: pointer; font-size: 13px; color: #333;
            transition: all .2s;
        }
        .btn:hover { color: #2BA471; border-color: #2BA471; }
        .btn-primary {
            background: #2BA471; color: #fff; border-color: #2BA471;
        }
        .btn-primary:hover { background: #229963; border-color: #229963; color: #fff; }
        .btn-search { background: #fff; }

        /* 订货单类型页签：客户订货单 / 供应商订货单 */
        .list-tabs {
            display: flex; background: #fff; border-radius: 4px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .list-tab {
            padding: 13px 22px; font-size: 14px; color: #666; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all .15s;
        }
        .list-tab:hover { color: #2BA471; }
        .list-tab.active { color: #2BA471; border-bottom-color: #2BA471; font-weight: 500; background: #f7fdfa; }
        .list-tab .lt-cnt { color: #999; font-size: 12px; font-weight: 400; margin-left: 6px; }
        .list-tab.active .lt-cnt { color: #2BA471; }

        /* 列表表格 */
        .table-card {
            background: #fff; padding: 16px 20px;
            border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .table-toolbar {
            display: flex; align-items: center; margin-bottom: 14px;
        }
        .table-title { font-size: 15px; font-weight: 600; color: #333; }
        .table-title .count {
            color: #999; font-weight: 400; font-size: 13px; margin-left: 6px;
        }
        .table-toolbar-right { margin-left: auto; display: flex; gap: 8px; }
        .btn-add {
            background: #2BA471; color: #fff; border: none;
            padding: 7px 18px; border-radius: 2px; font-size: 13px;
            cursor: pointer;
        }
        .btn-add:hover { background: #229963; }

        table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        table thead {
            background: #fafafa;
        }
        table th {
            padding: 10px 10px; text-align: left; color: #555;
            font-weight: 500; border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        table td {
            padding: 12px 10px; color: #333; border-bottom: 1px solid #f5f5f5;
        }
        table tbody tr:hover { background: #fafdfb; }
        table tbody tr { cursor: pointer; }

        /* 状态徽标 */
        .status {
            display: inline-block; padding: 2px 10px;
            border-radius: 10px; font-size: 12px; font-weight: 500;
        }
        .status-confirm { background: #e6fffb; color: #00b578; border: 1px solid #87e8de; }
        .status-pending { background: #fff7e6; color: #d48806; border: 1px solid #ffd591; }
        .status-done { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .status-cancel { background: #f5f5f5; color: #999; border: 1px solid #d9d9d9; }

        /* 收货状态 */
        .receive-status {
            display: inline-block; padding: 2px 10px;
            border-radius: 10px; font-size: 12px; font-weight: 500;
        }
        .receive-none { background: #fff7e6; color: #d48806; border: 1px solid #ffd591; }
        .receive-partial { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
        .receive-all { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }

        /* 操作链接 */
        .link { color: #2BA471; cursor: pointer; text-decoration: none; margin-right: 12px; }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #ff4d4f; }
        .link-danger:hover { color: #ff7875; }

        /* 星标收藏 */
        .star-col { width: 40px; text-align: center; }
        .star-btn {
            font-size: 16px; cursor: pointer; color: #d9d9d9;
            transition: color .15s;
        }
        .star-btn:hover, .star-btn.active { color: #faad14; }

        /* 活动图标 */
        .activity-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; border-radius: 50%;
            background: #f5f5f5; color: #999; font-size: 12px;
        }

        /* 分页 */
        .pagination {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 8px; margin-top: 16px; font-size: 13px; color: #666;
        }
        .pagination .page-info { margin-right: 16px; }
        .page-btn {
            min-width: 28px; height: 28px; padding: 0 8px;
            border: 1px solid #d9d9d9; background: #fff;
            border-radius: 2px; cursor: pointer; font-size: 13px;
        }
        .page-btn:hover { color: #2BA471; border-color: #2BA471; }
        .page-btn.active { background: #2BA471; color: #fff; border-color: #2BA471; }
        .page-btn:disabled { color: #ccc; cursor: not-allowed; }
        .page-jumper input {
            width: 40px; padding: 4px 6px; border: 1px solid #d9d9d9;
            border-radius: 2px; margin: 0 4px; text-align: center;
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
    <div class="top-nav-left">
        <div class="brand">
            <div class="brand-logo">叶</div>
            <div class="brand-name">运营管理平台</div>
        </div>
    </div>
    <div class="top-nav-right">

        <div class="top-nav-icon" title="消息">
            🔔<span class="badge">13</span>
        </div>
        <div class="account">
            <div class="account-avatar">A</div>
            <div class="account-name">Administrator</div>
        </div>
    </div>
</div>

<!-- 左右分栏 -->
<div class="layout">

    <!-- 左侧菜单（组件化） -->
    <div id="sidebar-container"></div>

    <!-- 右侧主内容 -->
    <main class="main">

        <!-- 面包屑导航 -->
        <div class="breadcrumb-bar">
            <span class="menu-toggle">☰</span>
            <span class="home-icon">🏠</span>
            <a>首页</a>
            <span class="sep">/</span>
            <a>鸡蛋采购</a>
            <span class="sep">/</span>
            <span class="current">订货单</span>
        </div>

        <!-- 订货单类型页签：客户订货单（薄眠→焱丰）/ 供应商订货单（焱丰→供应商） -->
        <div class="list-tabs">
            <div class="list-tab active" id="tab-customer" onclick="switchType('customer')">客户订货单<span class="lt-cnt">4</span></div>
            <div class="list-tab" id="tab-supplier" onclick="switchType('supplier')">供应商订货单<span class="lt-cnt">4</span></div>
        </div>

        <!-- 搜索筛选区 -->
        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>订货单编号</label>
                    <input type="text" placeholder="请输入订货单编号">
                </div>
                <div class="filter-item">
                    <label>采购单位</label>
                    <input type="text" placeholder="请输入采购单位">
                </div>
                <div class="filter-item">
                    <label>状态</label>
                    <select><option>全部</option><option>待提交</option><option>已完成</option></select>
                </div>
                <div class="filter-item">
                    <label>开单日期</label>
                    <input type="date">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-search">🔍 搜索</button>
                    <button class="btn">重置</button>
                </div>
            </div>
        </div>

        <!-- 表格 -->
        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-title">
                    <span id="listTitle">客户订货单</span>
                    <span class="count" id="listCount">共 4 条</span>
                </div>
                <div class="table-toolbar-right">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>订货单编号</th>
                        <th>采购单位</th>
                        <th>供货单位</th>
                        <th>开单日期</th>
                    </tr>
                </thead>
                <tbody id="dh-tbody"></tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination">
                <span class="page-info" id="pageInfo">共 4 条</span>
                <button class="page-btn" disabled>‹</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">›</button>
                <span class="page-jumper">
                    前往 <input type="text" value="1"> 页
                </span>
            </div>
        </div>
    </main>
</div>

<!-- 左侧菜单组件 -->
<script src="sidebar.js"></script>

<script>
    // ===== 订货单分两类：客户订货单（薄眠→焱丰，详情胶囊跳销售订单）/ 供应商订货单（焱丰→供应商，详情胶囊跳采购订单）=====
    var YANFENG = '焱丰（山东）供应链管理有限公司';
    var KEHU = 'aqtest薄眠（山东）数字产业发展有限公司';
    var DH_LIST = {
        customer: [
            { no: 'DH20260905002', buyer: KEHU,    seller: YANFENG,             date: '2026-09-05', status: 'draft' },
            { no: 'DH20260901001', buyer: KEHU,    seller: YANFENG,             date: '2026-09-01', status: 'completed' },
            { no: 'DH20260828003', buyer: KEHU,    seller: YANFENG,             date: '2026-08-28', status: 'completed' },
            { no: 'DH20260820004', buyer: KEHU,    seller: YANFENG,             date: '2026-08-20', status: 'completed' }
        ],
        supplier: [
            { no: 'DH20260905002', buyer: YANFENG, seller: '平原县蛋鸡养殖合作社',   date: '2026-09-05', status: 'completed' },
            { no: 'DH20260901001', buyer: YANFENG, seller: '平原县蛋鸡养殖合作社',   date: '2026-09-01', status: 'completed' },
            { no: 'DH20260828003', buyer: YANFENG, seller: '夏津县绿源养殖专业合作社', date: '2026-08-28', status: 'completed' },
            { no: 'DH20260820004', buyer: YANFENG, seller: '临邑县丰羽蛋鸡养殖场',   date: '2026-08-20', status: 'completed' }
        ]
    };
    var curType = 'customer';

    // 采购订单批量生成的供应商订货单草稿：与静态演示数据合并展示。
    (function () {
        var generated = [];
        try { generated = JSON.parse(localStorage.getItem('haifu_egg_supplier_orders') || '[]') || []; } catch (e) { generated = []; }
        generated.forEach(function (doc) {
            if (!doc || DH_LIST.supplier.some(function (item) { return item.no === doc.no; })) return;
            DH_LIST.supplier.unshift({ no: doc.no, buyer: YANFENG, seller: doc.supplier, date: doc.date, status: doc.status, purchaseNos: doc.purchaseNos, customerOrderNo: doc.customerOrderNo });
        });
    })();

    function goDetail(no, status, type) {
        location.href = '鸡蛋-订货单详情.html?no=' + encodeURIComponent(no)
            + '&status=' + encodeURIComponent(status)
            + '&type=' + encodeURIComponent(type);
    }

    function renderList() {
        var rows = DH_LIST[curType] || [];
        document.getElementById('dh-tbody').innerHTML = rows.map(function (r, i) {
            return '<tr onclick="goDetail(\'' + r.no + '\',\'' + r.status + '\',\'' + curType + '\')">'
                + '<td>' + (i + 1) + '</td>'
                + '<td>' + r.no + '</td>'
                + '<td>' + r.buyer + '</td>'
                + '<td>' + r.seller + '</td>'
                + '<td>' + r.date + '</td>'
                + '</tr>';
        }).join('');
        var label = curType === 'supplier' ? '供应商订货单' : '客户订货单';
        document.getElementById('listTitle').textContent = label;
        document.getElementById('listCount').textContent = '共 ' + rows.length + ' 条';
        document.getElementById('pageInfo').textContent = '共 ' + rows.length + ' 条';
        document.getElementById('tab-customer').classList.toggle('active', curType !== 'supplier');
        document.getElementById('tab-supplier').classList.toggle('active', curType === 'supplier');
        document.querySelector('#tab-customer .lt-cnt').textContent = DH_LIST.customer.length;
        document.querySelector('#tab-supplier .lt-cnt').textContent = DH_LIST.supplier.length;
    }

    function switchType(t) { curType = t; renderList(); }

    // 支持从详情页面包屑带 ?type= 回到对应页签
    (function () {
        var m = location.search.match(/[?&]type=([^&]*)/);
        if (m && decodeURIComponent(m[1]) === 'supplier') curType = 'supplier';
        renderList();
    })();
</script>

</body>
</html>
