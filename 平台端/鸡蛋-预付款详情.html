<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预付款详情 - 运营管理平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background-color: #f5f7fa; color: #333; font-size: 14px; min-height: 100vh; }
        .top-nav { height: 56px; background: #fff; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
        .brand-logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg,#2BA471,#5BC09F); color: #fff; }
        .account { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #666; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; background: #2BA471; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .main { flex: 1; padding: 16px 20px; min-width: 0; }
        .breadcrumb-bar { background: #fff; padding: 12px 20px; margin-bottom: 12px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.04); color: #666; font-size: 13px; }
        .breadcrumb-bar a { color: #2BA471; text-decoration: none; cursor: pointer; }
        .breadcrumb-bar .current { color: #333; font-weight: 500; }
        .sep { padding: 0 8px; color: #d9d9d9; }
        .page-title-bar { background: #fff; padding: 16px 20px; border-radius: 4px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); display: flex; align-items: center; gap: 12px; }
        .page-title { font-size: 18px; font-weight: 600; color: #222; }
        .status-tag { display: inline-block; padding: 3px 12px; border-radius: 11px; font-size: 12px; font-weight: 500; }
        .status-review { background: #fff7e6; color: #d48806; }
        .status-confirm { background: #e6fffb; color: #13c2c2; }
        .status-paid { background: #f0faf5; color: #2BA471; }
        .status-reject { background: #fff1f0; color: #ff4d4f; }
        .reject-reason { font-size: 12px; color: #ff4d4f; }
        .card { background: #fff; border-radius: 4px; padding: 20px 24px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .action-bar { display: flex; align-items: center; gap: 8px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid #f0f0f0; }
        .btn { padding: 7px 18px; border: none; border-radius: 2px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; }
        .btn-primary { background: #2BA471; color: #fff; }
        .btn-primary:hover { background: #259163; }
        .btn-default { background: #fff; color: #666; border: 1px solid #d9d9d9; }
        .btn-default:hover { border-color: #2BA471; color: #2BA471; }
        .steps-bar { margin-left: auto; display: flex; align-items: center; }
        .step { padding: 6px 18px; background: #f5f5f5; color: #666; font-size: 13px; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%, 8px 50%); margin-right: -8px; }
        .step:first-child { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); }
        .step:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 8px 50%); margin-right: 0; }
        .step.active { background: #2BA471; color: #fff; }
        .step.done { background: #e8e8e8; color: #999; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 64px; margin-bottom: 8px; }
        .section-title { font-size: 14px; font-weight: 600; color: #2BA471; margin: 4px 0 16px; padding-left: 10px; border-left: 3px solid #2BA471; }
        .kv { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
        .kv .k { min-width: 96px; color: #666; font-size: 13px; flex-shrink: 0; text-align: right; }
        .kv .v { flex: 1; color: #333; font-size: 13px; line-height: 1.6; }
        .kv .v b.amount { color: #2BA471; font-size: 15px; }
        .kv .v a { color: #2BA471; cursor: pointer; text-decoration: none; font-weight: 500; }
        .kv .v a:hover { text-decoration: underline; }
        .file-card { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fafafa; border: 1px solid #eee; border-radius: 6px; max-width: 380px; margin-bottom: 8px; }
        .file-ico { width: 32px; height: 32px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; flex-shrink: 0; }
        .file-ico.img { background: #4aa3df; } .file-ico.pdf { background: #d9534f; }
        .file-meta { flex: 1; min-width: 0; }
        .file-name { font-size: 13px; color: #333; display: block; }
        .file-type { font-size: 11px; color: #999; }
        .file-ops { display: inline-flex; gap: 10px; }
        .file-ops a { color: #2BA471; cursor: pointer; font-size: 13px; text-decoration: none; }
        .file-ops a:hover { text-decoration: underline; }
        .upload-tile { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px dashed #d9d9d9; border-radius: 6px; cursor: pointer; color: #2BA471; font-size: 13px; margin-top: 4px; }
        .upload-tile:hover { border-color: #2BA471; background: #f6fdfa; }
        .voucher-empty { font-size: 13px; color: #999; margin-bottom: 8px; }
        .voucher-tip { font-size: 12px; color: #d48806; margin-bottom: 8px; }
        .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); display: none; padding: 10px 18px; background: #f0faf5; border: 1px solid #b7e4cd; color: #1d6b46; border-radius: 6px; font-size: 13px; z-index: 1100; }
        .toast.show { display: block; }

        /* 审核弹窗（平台标准弹窗样式） */
        .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
        .modal-mask.show { display: flex; }
        .modal { width: 520px; background: #fff; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.18); overflow: hidden; }
        .modal-head { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; line-height: 1; }
        .modal-body { padding: 20px; }
        .form-row { display: flex; align-items: center; margin-bottom: 18px; }
        .form-row.top { align-items: flex-start; }
        .form-row label.t { width: 88px; color: #555; text-align: right; margin-right: 12px; font-size: 13px; flex-shrink: 0; }
        .radio-line { display: flex; align-items: center; gap: 20px; font-size: 13px; color: #333; }
        .radio-line label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .radio-line input { accent-color: #2BA471; }
        .modal-body textarea { flex: 1; min-height: 72px; padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 2px; font: inherit; font-size: 13px; outline: none; resize: vertical; }
        .modal-body textarea:focus { border-color: #2BA471; }
        .modal-foot { padding: 12px 20px; border-top: 1px solid #f0f0f0; text-align: right; }
        .modal-foot .btn { margin-left: 8px; padding: 6px 16px; }
        .modal-foot .btn-default:hover { color: #2BA471; border-color: #2BA471; }
    </style>
</head>
<body>
    <header class="top-nav"><div class="brand"><span class="brand-logo">叶</span><span>运营管理平台</span></div><div class="account"><span class="avatar">A</span>Administrator</div></header>
    <div class="layout"><div id="sidebar-container"></div>
    <main class="main">
        <div class="breadcrumb-bar">
            <a onclick="location.href='鸡蛋-预付款列表.html'">首页</a><span class="sep">/</span><a onclick="location.href='鸡蛋-预付款列表.html'">结算</a><span class="sep">/</span><a onclick="location.href='鸡蛋-预付款列表.html'">预付款</a><span class="sep">/</span><span class="current">预付款详情</span>
        </div>

        <div class="page-title-bar">
            <div class="page-title" id="payNo">EGG-PP-20260906001</div>
            <span class="status-tag status-paid" id="statusTag">已支付</span>
            <span class="reject-reason" id="rejectReasonText" style="display:none;"></span>
        </div>

        <div class="card">
            <div class="action-bar">
                <span id="statusBtns"></span>
                <div class="steps-bar">
                    <div class="step" id="step-0">待审核</div>
                    <div class="step" id="step-1">待确认</div>
                    <div class="step" id="step-2">已支付</div>
                </div>
            </div>

            <div class="section-title">单据信息</div>
            <div class="info-grid">
                <div class="kv"><span class="k">单据编号</span><span class="v" id="v-no">EGG-PP-20260906001</span></div>
                <div class="kv"><span class="k">采购订单号</span><span class="v"><a id="v-po" onclick="goPurchaseOrder()">EGG-PO-20260905001</a></span></div>
                <div class="kv"><span class="k">供应商</span><span class="v" id="v-supplier">平原县蛋鸡养殖合作社</span></div>
                <div class="kv"><span class="k">订单总金额</span><span class="v" id="v-order-total">¥ 128,587.20</span></div>
                <div class="kv"><span class="k">付款金额</span><span class="v"><b class="amount" id="v-amount">¥ 50,000.00</b></span></div>
                <div class="kv"><span class="k">付款方式</span><span class="v" id="v-way">银行转账</span></div>
                <div class="kv"><span class="k">申请日期</span><span class="v" id="v-date">2026-09-06</span></div>
            </div>

            <div class="section-title">支付凭证附件</div>
            <div class="voucher-tip" id="voucherTip" style="display:none;">确认付款前需上传支付凭证附件</div>
            <div class="voucher-empty" id="voucherEmpty" style="display:none;">暂无支付凭证附件</div>
            <div id="voucherArea"></div>
            <div class="upload-tile" onclick="uploadVoucher()">⬆ 上传支付凭证附件</div>
        </div>
    </main></div>
    <div class="toast" id="toast"></div>

    <!-- 审核弹窗 -->
    <div class="modal-mask" id="auditModal">
        <div class="modal">
            <div class="modal-head">审核预付款<button class="modal-close" onclick="closeAuditModal()">×</button></div>
            <div class="modal-body">
                <div class="form-row"><label class="t">审核结果</label>
                    <span class="radio-line">
                        <label><input type="radio" name="auditResult" value="pass" checked onchange="toggleReason()">审核通过</label>
                        <label><input type="radio" name="auditResult" value="reject" onchange="toggleReason()">审核驳回</label>
                    </span>
                </div>
                <div class="form-row top" id="reasonRow" style="display:none;"><label class="t">驳回原因</label><textarea id="rejectReason" placeholder="请填写驳回原因（必填）"></textarea></div>
            </div>
            <div class="modal-foot"><button class="btn btn-default" onclick="closeAuditModal()">取消</button><button class="btn btn-primary" onclick="submitAudit()">确定</button></div>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        function g(n){ var m = location.search.match(new RegExp('[?&]'+n+'=([^&]*)')); return m ? decodeURIComponent(m[1]) : ''; }
        var toastTimer = null;
        function showToast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200); }

        // ===== 预付款状态流：待审核 → 待确认 → 已支付（新增后即为待审核） =====
        var DEMO = {
            'EGG-PP-20260905001': { supplier:'平原县蛋鸡养殖合作社', amount:'¥ 20,000.00', way:'银行转账', date:'2026-09-05', po:'EGG-PO-20260901002', poStatus:'confirm', total:'¥ 128,587.20', vouchers:[] },
            'EGG-PP-20260906001': { supplier:'平原县蛋鸡养殖合作社', amount:'¥ 50,000.00', way:'银行转账', date:'2026-09-06', po:'EGG-PO-20260901002', poStatus:'confirm', total:'¥ 128,587.20', vouchers:['支付凭证_银行回单.jpg|img','支付凭证_付款汇总.pdf|pdf'] },
            'EGG-PP-20260907002': { supplier:'平原县蛋鸡养殖合作社', amount:'¥ 30,000.00', way:'银行转账', date:'2026-09-07', po:'EGG-PO-20260901002', poStatus:'confirm', total:'¥ 128,587.20', vouchers:[] },
            'EGG-PP-20260908003': { supplier:'夏津县绿源养殖专业合作社', amount:'¥ 45,000.00', way:'银行转账', date:'2026-09-08', po:'EGG-PO-20260828003', poStatus:'done', total:'¥ 196,465.72', vouchers:[] },
            'EGG-PP-20260909004': { supplier:'夏津县绿源养殖专业合作社', amount:'¥ 60,000.00', way:'银行转账', date:'2026-09-09', po:'EGG-PO-20260828003', poStatus:'done', total:'¥ 196,465.72', vouchers:['支付凭证_银行回单.jpg|img'] }
        };
        var STEPS = ['review','confirm','paid'];
        var LABELS = { review:'待审核', confirm:'待确认', paid:'已支付', reject:'已驳回' };
        var TAGS = { review:'status-review', confirm:'status-confirm', paid:'status-paid', reject:'status-reject' };
        var current = 'paid', currentNo = '', voucherCount = 0;

        function goPurchaseOrder() {
            var d = DEMO[currentNo] || DEMO['EGG-PP-20260906001'];
            location.href = '鸡蛋-采购订单详情.html?order=' + d.po + '&status=' + (d.poStatus || 'confirm');
        }
        function setBar(status) {
            var idx = STEPS.indexOf(status); if (idx < 0) idx = 0;   // 已驳回停留在待审核节点
            STEPS.forEach(function(s,i){
                document.getElementById('step-'+i).className = 'step' + (i < idx ? ' done' : (i === idx ? ' active' : ''));
            });
        }
        function setButtons(status) {
            var html = '';
            if (status === 'review' || status === 'reject') html = '<button class="btn btn-primary" onclick="openAuditModal()">审核</button>';
            else if (status === 'confirm') html = '<button class="btn btn-primary" onclick="confirmPay()">确认</button>';
            document.getElementById('statusBtns').innerHTML = html;
        }
        function fileCard(name, type){
            return '<div class="file-card"><span class="file-ico ' + type + '">' + (type === 'pdf' ? 'PDF' : '🖼') + '</span><span class="file-meta"><span class="file-name">' + name + '</span><span class="file-type">' + (type === 'pdf' ? 'PDF' : '图片') + '</span></span><span class="file-ops"><a title="预览" onclick="showToast(\'预览（演示）\')">🔍</a><a title="下载" onclick="showToast(\'下载（演示）\')">⬇</a><a title="删除" onclick="delVoucher(this)">✕</a></span></div>';
        }
        // 删除支付凭证附件
        function delVoucher(el) {
            var card = el.closest ? el.closest('.file-card') : null;
            if (!card) return;
            card.parentNode.removeChild(card);
            voucherCount = Math.max(0, voucherCount - 1);
            showToast('支付凭证已删除（演示）');
            renderVouchers();
        }
        function renderVouchers() {
            var has = voucherCount > 0;
            document.getElementById('voucherArea').style.display = has ? 'block' : 'none';
            document.getElementById('voucherEmpty').style.display = has ? 'none' : 'block';
            // 待确认状态提示：确认前必须上传凭证
            document.getElementById('voucherTip').style.display = (current === 'confirm' && !has) ? 'block' : 'none';
        }
        // 上传支付凭证（演示：点击追加一个附件）
        function uploadVoucher() {
            voucherCount++;
            document.getElementById('voucherArea').insertAdjacentHTML('beforeend', fileCard('支付凭证_银行回单_' + voucherCount + '.jpg', 'img'));
            showToast('支付凭证已上传（演示）');
            renderVouchers();
        }
        // 审核弹窗
        function openAuditModal() {
            document.querySelector('input[name="auditResult"][value="pass"]').checked = true;
            document.getElementById('rejectReason').value = '';
            toggleReason();
            document.getElementById('auditModal').classList.add('show');
        }
        function closeAuditModal(){ document.getElementById('auditModal').classList.remove('show'); }
        function toggleReason() {
            var reject = document.querySelector('input[name="auditResult"]:checked').value === 'reject';
            document.getElementById('reasonRow').style.display = reject ? 'flex' : 'none';
        }
        function submitAudit() {
            var reject = document.querySelector('input[name="auditResult"]:checked').value === 'reject';
            if (reject) {
                var reason = document.getElementById('rejectReason').value.trim();
                if (!reason) { showToast('请填写驳回原因'); return; }
                closeAuditModal();
                showToast('审核驳回：' + reason);
                applyStatus('reject', reason);
                return;
            }
            closeAuditModal();
            showToast('审核通过，单据流转至待确认');
            applyStatus('confirm');
        }
        // 确认付款：必须先上传支付凭证附件，提交后供应商端方可查看
        function confirmPay() {
            if (voucherCount === 0) { showToast('请先上传支付凭证附件，再确认付款'); return; }
            showToast('已确认付款，供应商端可查看该笔预付款');
            applyStatus('paid');
        }
        function applyStatus(status, reason) {
            current = status;
            var tag = document.getElementById('statusTag');
            tag.className = 'status-tag ' + TAGS[status];
            tag.textContent = LABELS[status];
            var rt = document.getElementById('rejectReasonText');
            if (status === 'reject' && reason) { rt.textContent = '驳回原因：' + reason; rt.style.display = 'inline'; }
            else { rt.textContent = ''; rt.style.display = 'none'; }
            setBar(status);
            setButtons(status);
            renderVouchers();
        }
        (function(){
            var no = g('no') || 'EGG-PP-20260906001';
            var d = DEMO[no] || DEMO['EGG-PP-20260906001'];
            currentNo = no;
            document.title = '预付款详情 ' + no + ' - 运营管理平台';
            document.getElementById('payNo').textContent = no;
            document.getElementById('v-no').textContent = no;
            document.getElementById('v-supplier').textContent = d.supplier;
            document.getElementById('v-amount').textContent = d.amount;
            document.getElementById('v-way').textContent = d.way;
            document.getElementById('v-date').textContent = d.date;
            document.getElementById('v-order-total').textContent = d.total;
            document.getElementById('v-po').textContent = d.po;
            // 已有凭证的单据渲染附件
            voucherCount = (d.vouchers || []).length;
            document.getElementById('voucherArea').innerHTML = (d.vouchers || []).map(function(v){ var p = v.split('|'); return fileCard(p[0], p[1]); }).join('');
            var status = g('status') || 'paid';
            if (status === 'posted' || status === 'draft') status = 'review';   // 兼容旧入口参数
            applyStatus(status);
        })();
        document.getElementById('auditModal').addEventListener('click', function(e){ if(e.target === this) closeAuditModal(); });
    </script>
</body>
</html>
